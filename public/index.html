<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Vrythos AI · Neural Core</title>
    <!-- Google Sign‑In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-deep: #07080e;
            --bg-surface: #0d0f1a;
            --bg-card: #131624;
            --bg-elevated: #1a1e30;
            --border-subtle: #252b42;
            --border-glow: rgba(139, 92, 246, 0.25);
            --text-primary: #f0f3fa;
            --text-secondary: #9aa4c8;
            --text-muted: #5e6e94;
            --accent-1: #8b5cf6;
            --accent-2: #6d28d9;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --gradient-brand: linear-gradient(135deg, #a78bfa, #7c3aed, #6d28d9);
            --gradient-glass: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
            --shadow-card: 0 12px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --radius-full: 9999px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-1);
            border-radius: var(--radius-full);
        }

        /* ── Auth Container ── */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background: radial-gradient(ellipse at 20% 30%, #131626, #07080e 70%);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.25rem 1.75rem;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        .auth-card h2 {
            font-size: 1.7rem;
            font-weight: 800;
            text-align: center;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1.75rem;
            font-weight: 400;
        }
        .auth-card input {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.85rem 1.25rem;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            margin-bottom: 0.9rem;
        }
        .auth-card input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .auth-card input::placeholder {
            color: var(--text-muted);
        }
        .auth-card button {
            width: 100%;
            background: var(--gradient-brand);
            border: none;
            border-radius: var(--radius-full);
            padding: 0.9rem;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.25rem;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .auth-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
        }
        .auth-card button:active {
            transform: scale(0.98);
        }
        .auth-switch {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-switch:hover {
            color: var(--accent-1);
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.25rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        .hidden {
            display: none !important;
        }
        #authMessage {
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: center;
            color: #f87171;
            min-height: 1.5rem;
        }
        .g_id_signin {
            display: flex;
            justify-content: center;
        }

        /* ── App Layout ── */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--bg-deep);
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 1.25rem 1rem;
            gap: 1.25rem;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .sidebar .logo span {
            font-size: 1.6rem;
        }
        .sidebar .new-chat-btn {
            background: var(--gradient-brand);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-full);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.25);
        }
        .sidebar .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 92, 246, 0.35);
        }
        .sidebar .section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1rem 1rem 0.75rem;
            border: 1px solid var(--border-subtle);
        }
        .sidebar .section-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.6rem;
            display: block;
        }
        .sidebar select {
            width: 100%;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.6rem 1rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar select:focus {
            border-color: var(--accent-1);
        }
        .sidebar .usage-badge {
            font-size: 0.7rem;
            background: var(--bg-deep);
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-full);
            text-align: center;
            margin-top: 0.5rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }
        .sidebar .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.3rem 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar .toggle-row:hover {
            color: var(--text-primary);
        }
        .sidebar .toggle-row input[type="checkbox"] {
            appearance: none;
            width: 36px;
            height: 20px;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .sidebar .toggle-row input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: var(--transition);
        }
        .sidebar .toggle-row input[type="checkbox"]:checked {
            background: var(--accent-1);
            border-color: var(--accent-1);
        }
        .sidebar .toggle-row input[type="checkbox"]:checked::after {
            left: 18px;
            background: #fff;
        }
        .sidebar .footer-stats {
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar .footer-stats strong {
            color: var(--text-secondary);
        }

        /* ── Main Chat ── */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            min-width: 0;
        }
        .chat-header {
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-surface);
            flex-shrink: 0;
        }
        .chat-header .ai-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .chat-header .ai-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .chat-header .user-menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.45rem 1.1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .chat-header .user-menu-btn:hover {
            border-color: var(--accent-1);
            color: var(--text-primary);
        }

        /* ── Messages ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.5rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .message {
            display: flex;
            gap: 0.7rem;
            max-width: 85%;
            animation: msg-in 0.25s ease;
        }
        @keyframes msg-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.ai-message {
            align-self: flex-start;
        }
        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--gradient-brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }
        .message.user-message .avatar {
            background: #374151;
            box-shadow: none;
        }
        .message .bubble {
            padding: 0.65rem 1.1rem;
            border-radius: var(--radius-md);
            line-height: 1.6;
            font-size: 0.9rem;
            word-break: break-word;
        }
        .message.user-message .bubble {
            background: var(--accent-1);
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        .message.ai-message .bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 4px;
        }
        .message .bubble img,
        .message .bubble video {
            border-radius: var(--radius-sm);
            max-width: 100%;
        }
        .message .bubble .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }
        .message .bubble .btn-row button {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.2rem 0.9rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .message .bubble .btn-row button:hover {
            border-color: var(--accent-1);
            color: var(--text-primary);
        }

        /* ── Input Area ── */
        .input-area {
            padding: 0.9rem 1.5rem 1.2rem;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            flex-shrink: 0;
        }
        .input-area .file-badge {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .input-area .file-badge .file-tag {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.2rem 0.8rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .input-area .file-badge .file-tag button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            transition: var(--transition);
        }
        .input-wrapper:focus-within {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.75rem 0;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            min-width: 0;
        }
        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }
        .input-wrapper input:disabled {
            opacity: 0.5;
        }
        .input-wrapper .tool-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.15rem;
            cursor: pointer;
            padding: 0.4rem 0.3rem;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .input-wrapper .tool-btn:hover {
            color: var(--text-primary);
        }
        .input-wrapper .send-btn {
            background: var(--gradient-brand);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-wrapper .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }
        .input-wrapper .send-btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1.5rem;
            animation: fade-in 0.2s ease;
        }
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.75rem 1.5rem;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            animation: slide-up 0.25s ease;
        }
        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .modal-content .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .modal-content .modal-header .close {
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            line-height: 1;
        }
        .modal-content .modal-header .close:hover {
            color: var(--text-primary);
        }
        .modal-content .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }
        .modal-content .card-sm {
            background: var(--bg-deep);
            border-radius: var(--radius-md);
            padding: 1rem 1.1rem;
            border: 1px solid var(--border-subtle);
        }
        .modal-content .card-sm h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .modal-content .card-sm label {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.5rem;
        }
        .modal-content .card-sm input,
        .modal-content .card-sm textarea {
            width: 100%;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.5rem 1rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            margin-top: 0.2rem;
        }
        .modal-content .card-sm input:focus,
        .modal-content .card-sm textarea:focus {
            border-color: var(--accent-1);
        }
        .modal-content .card-sm textarea {
            border-radius: var(--radius-md);
            resize: vertical;
            min-height: 60px;
        }
        .modal-content .card-sm .btn-sm {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.4rem;
            font-size: 0.8rem;
        }
        .modal-content .card-sm .btn-sm:hover {
            border-color: var(--accent-1);
        }
        .modal-content .card-sm .btn-sm.primary {
            background: var(--gradient-brand);
            border: none;
            color: #fff;
        }
        .modal-content .card-sm .btn-sm.danger {
            background: #7f1a1a;
            border: none;
            color: #fff;
        }
        .modal-content .card-sm .btn-sm.danger:hover {
            background: #991b1b;
        }
        .modal-content .card-sm .btn-sm.success {
            background: #065f46;
            border: none;
            color: #fff;
        }
        .modal-content .card-sm .btn-sm.success:hover {
            background: #047857;
        }
        .modal-content .key-list {
            max-height: 150px;
            overflow-y: auto;
            margin: 0.5rem 0;
        }
        .modal-content .key-list .key-item {
            background: var(--bg-deep);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.7rem;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            border: 1px solid var(--border-subtle);
        }
        .modal-content .key-list .key-item code {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }
        .modal-content .key-list .key-item .revoke {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .modal-content .free-key-box {
            background: var(--bg-deep);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            border: 1px solid var(--border-subtle);
            word-break: break-all;
        }
        .modal-content .free-key-box code {
            color: var(--accent-1);
        }
        .profile-preview {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-1);
            margin: 0.5rem auto;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--border-subtle);
        }

        /* ── Responsive ── */
        @media (max-width: 820px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 100;
                transform: translateX(-100%);
                width: 280px;
                border-right: 1px solid var(--border-subtle);
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.6);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 99;
                display: none;
            }
            .sidebar-overlay.active {
                display: block;
            }
            .mobile-hamburger {
                display: flex !important;
            }
            .modal-content .grid-2 {
                grid-template-columns: 1fr;
            }
            .message {
                max-width: 95%;
            }
            .auth-card {
                padding: 1.75rem 1.25rem;
            }
        }
        @media (max-width: 480px) {
            .chat-header {
                padding: 0.6rem 1rem;
            }
            .chat-header .ai-status {
                font-size: 0.8rem;
            }
            .chat-header .user-menu-btn {
                font-size: 0.7rem;
                padding: 0.3rem 0.8rem;
            }
            .messages {
                padding: 1rem 0.8rem 0.3rem;
            }
            .input-area {
                padding: 0.6rem 0.8rem 0.9rem;
            }
            .input-wrapper {
                padding: 0.1rem 0.1rem 0.1rem 0.8rem;
            }
            .input-wrapper input {
                font-size: 0.85rem;
                padding: 0.5rem 0;
            }
            .input-wrapper .send-btn {
                width: 36px;
                height: 36px;
                font-size: 0.9rem;
            }
            .input-wrapper .tool-btn {
                font-size: 1rem;
            }
            .message .bubble {
                font-size: 0.82rem;
                padding: 0.5rem 0.9rem;
            }
            .message .avatar {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .modal-content {
                padding: 1.25rem 1rem;
            }
            .auth-card {
                padding: 1.5rem 1rem;
            }
        }

        /* ── Utilities ── */
        .mobile-hamburger {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-accent {
            color: var(--accent-1);
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .gap-1 {
            gap: 0.5rem;
        }
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .w-full {
            width: 100%;
        }

        /* ── Loading / Error states ── */
        #app-root.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 1.2rem;
            color: var(--text-secondary);
            background: var(--bg-deep);
        }
        #app-root.error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #f87171;
            padding: 2rem;
            text-align: center;
            background: var(--bg-deep);
        }
        #app-root.error h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        #app-root.error p {
            max-width: 500px;
            color: var(--text-secondary);
        }
        #app-root.error button {
            margin-top: 1.5rem;
            background: var(--accent-1);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: var(--radius-full);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ─── APP ROOT ─── -->
    <div id="app-root" class="loading">⏳ Loading Vrythos Neural Core…</div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  BACKEND API HELPERS
        // ═══════════════════════════════════════════════════════════════
        async function apiGet(endpoint) {
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiPost(endpoint, data) {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Request failed');
            }
            return res.json();
        }
        async function apiPut(endpoint, data) {
            const res = await fetch(endpoint, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiDelete(endpoint) {
            const res = await fetch(endpoint, { method: 'DELETE' });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        // ─── GLOBALS ───
        let currentUser = null;
        let modules = [];
        let tournaments = [];
        let selectedModuleId = null;
        let deepThink = false;
        let liveImageMode = false;
        let liveVideoMode = false;
        let messagesHistory = [];
        let attachedFiles = [];
        let isProcessing = false;
        const DEFAULT_VIDEO_DURATION = 5;
        const imgStore = {};
        let imgStoreCounter = 0;
        const videoStore = {};
        let videoStoreCounter = 0;
        let abuseScore = 0;
        let abuseWarningShown = false;

        // ─── HELPERS ───
        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        async function hashPassword(pw) {
            const enc = new TextEncoder().encode(pw);
            const hash = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ─── ABUSE DETECTION ───
        async function addAbuseScore(points, reason, context) {
            if (!currentUser) return;
            abuseScore = Math.min(100, abuseScore + points);
            console.warn(`⚠️ Abuse +${points} → ${abuseScore}% (${reason})`);
            try {
                await apiPost('/api/pendingBans', {
                    email: currentUser.email,
                    username: currentUser.username,
                    score: abuseScore,
                    reason,
                    context: (context || '').slice(0, 200),
                    timestamp: Date.now(),
                    reviewed: false
                });
                await apiPost('/api/abuse', {
                    email: currentUser.email,
                    username: currentUser.username,
                    reason,
                    context: (context || '').slice(0, 100),
                    timestamp: Date.now()
                });
            } catch (_) { /* ignore */ }
            if ((abuseScore >= 10 && !abuseWarningShown) || points >= 5) {
                abuseWarningShown = true;
                addAIMessage(
                    `⚠️ Warning: suspicious activity detected (score ${abuseScore}%). Repeated violations may lead to a ban.`
                    );
            }
        }

        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            addAbuseScore(5, 'Right-click attempt', 'User right-clicked');
            showToast('Right-click is prohibited', 'warning');
            return false;
        });

        function detectDevTools() {
            const t = 160;
            if (window.outerWidth - window.innerWidth > t || window.outerHeight - window.innerHeight > t) {
                addAbuseScore(10, 'Developer tools detected', 'DevTools opened');
                showToast('Developer tools detected', 'error');
            }
        }
        setInterval(detectDevTools, 2000);

        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                addAbuseScore(10, 'View source attempt', 'Tried to view page source');
                showToast('Viewing source is forbidden', 'error');
                return false;
            }
        });

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
                    background: ${type === 'error' ? '#7f1a1a' : type === 'warning' ? '#78350f' : '#1e293b'};
                    color: #fff; padding: 0.6rem 1.2rem; border-radius: 9999px;
                    font-size: 0.85rem; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
                    max-width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.06);
                    animation: slide-up 0.25s ease;
                `;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s'; }, 3000);
            setTimeout(() => toast.remove(), 3500);
        }

        // ─── DOWNLOAD / COPY GLOBALS ───
        window.downloadImage = function(id) {
            const url = imgStore[id];
            if (!url) return;
            const a = document.createElement('a');
            a.download = 'vrythos_image.png';
            a.href = url;
            a.click();
        };
        window.copyImageToClipboard = async function(id) {
            const url = imgStore[id];
            if (!url) return;
            try {
                const blob = await (await fetch(url)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                showToast('Image copied to clipboard!', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };
        window.downloadVideo = function(id) {
            const url = videoStore[id];
            if (!url) return;
            const a = document.createElement('a');
            a.download = 'vrythos_video.mp4';
            a.href = url;
            a.click();
        };
        window.copyVideoToClipboard = async function(id) {
            const url = videoStore[id];
            if (!url) return;
            try {
                const blob = await (await fetch(url)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                showToast('Video copied to clipboard!', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };

        // ─── DATA LOADERS ───
        async function loadAllData() {
            modules = await apiGet('/api/modules');
            tournaments = await apiGet('/api/tournaments');
        }
        async function loadUsers() { return await apiGet('/api/users'); }
        async function updateUser(email, updates) { return await apiPut(`/api/users/${email}`, updates); }
        async function deleteUser(email) { return await apiDelete(`/api/users/${email}`); }
        async function loadUserApiKeys(email) {
            const all = await apiGet('/api/userApiKeys');
            const entry = all.find(e => e.email === email);
            return entry ? entry.keys : [];
        }
        async function saveUserApiKeys(email, keys) {
            await apiPost('/api/userApiKeys', { email, keys });
        }
        async function getImageQuota(email) {
            const all = await apiGet('/api/imageQuotas');
            return all.find(q => q.email === email) || { email, count: 0, windowStart: Date.now() };
        }
        async function setImageQuota(q) { await apiPost('/api/imageQuotas', q); }
        async function getChatUsage(email, moduleId, date) {
            const all = await apiGet('/api/chatUsage');
            return all.find(u => u.email === email && u.moduleId === moduleId && u.date === date) || { email, moduleId,
                date, count: 0 };
        }
        async function setChatUsage(u) { await apiPost('/api/chatUsage', u); }
        async function addBugReport(bug) { return await apiPost('/api/bugs', bug); }
        async function joinTournament(id) { return await apiPost('/api/join-tournament', { email: currentUser.email,
                tournamentId: id }); }

        // ─── IMAGE GENERATION ───
        async function generateImageWithCloudflare(prompt) {
            try {
                const res = await fetch('/api/generate/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                if (data.success) return data.image;
            } catch (_) { /* fall through */ }
            return null;
        }
        async function generateImageWithPollinations(prompt) {
            try {
                const res = await fetch('/api/fallback/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                if (data.success) return data.image;
            } catch (_) { /* fall through */ }
            return null;
        }

        async function generateImageAndShow(prompt) {
            addAIMessage('🖌️ Generating image…', false);
            let imgData = await generateImageWithCloudflare(prompt);
            if (!imgData) imgData = await generateImageWithPollinations(prompt);
            if (imgData && imgData.startsWith('data:image')) {
                const id = 'img_' + (++imgStoreCounter);
                imgStore[id] = imgData;
                const html = `
                        <img src="${imgData}" style="max-width:100%; border-radius:12px;" />
                        <div class="btn-row">
                            <button onclick="downloadImage('${id}')">⬇️ Download</button>
                            <button onclick="copyImageToClipboard('${id}')">📋 Copy</button>
                        </div>
                    `;
                addAIMessage(html, true);
            } else {
                addAIMessage('❌ Image generation failed. Please try again.');
            }
        }

        async function getRemainingImages() {
            const quota = await getImageQuota(currentUser.email);
            const now = Date.now();
            const win = 5 * 60 * 60 * 1000;
            const base = (now - quota.windowStart >= win) ? 5 : Math.max(0, 5 - quota.count);
            return base + (currentUser.extraImageCredits || 0);
        }
        async function consumeImage() {
            let quota = await getImageQuota(currentUser.email);
            const now = Date.now();
            const win = 5 * 60 * 60 * 1000;
            if (now - quota.windowStart >= win) quota = { email: currentUser.email, count: 0, windowStart: now };
            if (await getRemainingImages() <= 0) return false;
            quota.count++;
            await setImageQuota(quota);
            updateImageDisplay();
            return true;
        }

        // ─── VIDEO GENERATION ───
        async function generateVideo(prompt, duration) {
            addAIMessage('🎬 Generating video… (may take 30–60s)', false);
            try {
                const res = await apiPost('/api/generate/video', {
                    email: currentUser.email,
                    prompt,
                    duration: duration || DEFAULT_VIDEO_DURATION
                });
                if (res.success) {
                    const id = 'vid_' + (++videoStoreCounter);
                    videoStore[id] = res.video;
                    const html = `
                            <video controls autoplay loop style="max-width:100%; border-radius:12px; max-height:400px;">
                                <source src="${res.video}" type="video/mp4">
                                Your browser does not support video.
                            </video>
                            <div class="btn-row">
                                <button onclick="downloadVideo('${id}')">⬇️ Download</button>
                                <button onclick="copyVideoToClipboard('${id}')">📋 Copy</button>
                                <span style="font-size:0.7rem;color:var(--text-muted);margin-left:0.5rem;">Remaining: ${res.remaining ?? '?'}</span>
                            </div>
                        `;
                    addAIMessage(html, true);
                } else {
                    addAIMessage('❌ Video failed: ' + (res.error || 'Unknown error'));
                }
            } catch (e) {
                addAIMessage('❌ Video error: ' + e.message);
            }
        }

        function isVideoRequest(text) {
            return /(video|animate|animation|make a video|create a video|generate a video|render|cinematic|short film|motion|sequence|clip|movie)/i
                .test(text);
        }
        function isImageRequest(text) {
            return /(make|create|generate|draw|paint|render).*(image|picture|photo|art|illustration).*of\s+(.+)|(image|picture|photo|art|illustration)\s+(of|with)\s+(.+)/i
                .test(text);
        }

        // ─── CHAT LIMITS ───
        async function getTodayCalls() {
            const today = new Date().toDateString();
            const u = await getChatUsage(currentUser.email, selectedModuleId, today);
            return u.count || 0;
        }
        async function incrementDailyCalls() {
            const today = new Date().toDateString();
            let u = await getChatUsage(currentUser.email, selectedModuleId, today);
            u.count = (u.count || 0) + 1;
            await setChatUsage(u);
            updateSidebarStats();
        }
        async function canMakeChatCall() {
            if (currentUser.banned) return false;
            const used = await getTodayCalls();
            const limit = 50 + (currentUser.extraChatCredits || 0);
            return used < limit;
        }

        // ─── AI ENGINE CALL ───
        async function callChatAPI(module_id, messages, deep) {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module_id, messages, deep_think: deep })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Chat API error');
            return data.reply;
        }

        // ─── ACTIVITY TRACKING ───
        let activityInterval = null;

        function startActivityTracking() {
            if (activityInterval) clearInterval(activityInterval);
            activityInterval = setInterval(async () => {
                if (currentUser) await apiPost('/api/user-activity', { email: currentUser.email });
            }, 5 * 60 * 1000);
        }

        // ─── UI HELPERS ───
        function setProcessing(p) {
            isProcessing = p;
            const inp = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            if (inp) inp.disabled = p;
            if (btn) btn.disabled = p;
            if (inp) inp.placeholder = p ? '⏳ Thinking… please wait' : 'Enter next chat';
            if (!p && inp) inp.focus();
        }

        function addUserMessage(text) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message user-message';
            const initial = (currentUser?.username?.charAt(0) || 'U').toUpperCase();
            div.innerHTML = `
                    <div class="avatar">${escapeHtml(initial)}</div>
                    <div class="bubble">${escapeHtml(text).replace(/\n/g,'<br>')}</div>
                `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addAIMessage(html, isHtml = false) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message ai-message';
            div.innerHTML = `<div class="avatar">⚡</div><div class="bubble">${isHtml ? html : escapeHtml(html).replace(/\n/g,'<br>')}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            if (!isHtml) messagesHistory.push({ role: 'assistant', content: html });
        }

        function showTyping() {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.id = 'typingMsg';
            div.className = 'message ai-message';
            div.innerHTML = `<div class="avatar">⚡</div><div class="bubble">▮ Thinking…</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        // ─── MAIN SEND ───
        async function sendMessage(userText, forceImage = false, forceVideo = false) {
            if (!currentUser || currentUser.banned) { addAIMessage('🚫 Account banned.'); return; }
            if (isProcessing) { addAIMessage('⏳ Please wait for previous message.'); return; }
            setProcessing(true);
            try {
                const willVideo = forceVideo || (liveVideoMode && isVideoRequest(userText));
                const willImage = (forceImage || (liveImageMode && isImageRequest(userText))) && !willVideo;

                if (willVideo) {
                    let prompt = userText;
                    const m = userText.match(/.*(?:make|create|generate|render|animate)\s+(?:a\s+)?(video|animation|clip|short film|cinematic)\s+(?:of|with)\s+(.+)/i);
                    if (m && m[2]) prompt = m[2];
                    addUserMessage(`🎬 ${userText.substring(0,100)}`);
                    await generateVideo(prompt, DEFAULT_VIDEO_DURATION);
                    setProcessing(false);
                    return;
                }

                if (willImage) {
                    addUserMessage(`🎨 ${userText.substring(0,100)}`);
                    let prompt = userText;
                    const m = userText.match(/.*(?:make|create|generate|draw|paint|render)\s+(?:an?\s+)?(image|picture|photo|art|illustration)\s+(?:of|with)\s+(.+)/i);
                    if (m && m[2]) prompt = m[2];
                    await generateImageAndShow(prompt);
                    setProcessing(false);
                    return;
                }

                // Normal chat
                if (!(await canMakeChatCall())) {
                    addAIMessage(
                        `⛔ Daily chat limit reached (${50+(currentUser.extraChatCredits||0)}/day). Request extra via bug report.`
                        );
                    setProcessing(false);
                    return;
                }
                const module = modules.find(m => m.id === selectedModuleId);
                if (!module) { addAIMessage('❌ No AI engine selected. Contact admin.'); setProcessing(false); return; }

                let fullMsg = userText;
                if (attachedFiles.length) {
                    fullMsg += '\n\n[Attached files]\n' + attachedFiles.map(f =>
                        f.isText ? `${f.name}:\n${f.content}` : `${f.name} (binary)`
                    ).join('\n');
                    attachedFiles = [];
                    renderFileBadges();
                }

                addUserMessage(userText);
                messagesHistory.push({ role: 'user', content: fullMsg });
                const typing = showTyping();
                let reply = '';
                try {
                    reply = await callChatAPI(selectedModuleId, messagesHistory.slice(-12), deepThink);
                    await incrementDailyCalls();
                    updateRemainingDisplay();
                    updateSidebarStats();
                    if (reply.includes('quota') || reply.includes('limit')) {
                        await addAbuseScore(5, 'API quota warning', userText);
                    }
                    const lower = userText.toLowerCase();
                    const creatorWords = ['who made you', 'who created you', 'your creator', 'who built you', 'viraj',
                        'bodare'
                    ];
                    if (creatorWords.some(w => lower.includes(w))) {
                        reply =
                            'I am Vrythos, an advanced AI framework built by **Viraj S. Bodare**. I operate through multiple high-performance engines and am designed to be helpful, safe, and honest.';
                    }
                } catch (e) {
                    reply = `⚠️ Service temporarily unavailable. Please try again later. Error: ${e.message}`;
                } finally {
                    if (typing) typing.remove();
                }
                addAIMessage(reply);
            } finally {
                setProcessing(false);
            }
        }

        // ─── UI UPDATES ───
        async function updateRemainingDisplay() {
            const mod = modules.find(m => m.id === selectedModuleId);
            if (mod) {
                const used = await getTodayCalls();
                const left = mod.dailyLimitPerUser - used;
                document.getElementById('moduleRemaining').textContent =
                    `📨 Today: ${left > 0 ? left : 0}/${mod.dailyLimitPerUser} msgs left`;
            } else {
                document.getElementById('moduleRemaining').textContent = '⚠️ No active engine';
            }
        }

        async function updateSidebarStats() {
            const left = 50 + (currentUser.extraChatCredits || 0) - (await getTodayCalls());
            document.getElementById('dailyCallsLeft').textContent = Math.max(0, left);
            document.getElementById('sidebarUsername').textContent = currentUser.username;
            await updateImageDisplay();
            renderTournaments();
        }

        async function updateImageDisplay() {
            const rem = await getRemainingImages();
            document.getElementById('imageUsageDisplay').textContent = `🎨 Images left: ${rem} (base+extra)`;
        }

        function renderFileBadges() {
            const container = document.getElementById('filePreviewArea');
            container.innerHTML = attachedFiles.map((f, idx) =>
                `<span class="file-tag">📄 ${escapeHtml(f.name)} <button data-idx="${idx}" style="background:none;border:none;color:#ef4444;cursor:pointer;">✖</button></span>`
            ).join('');
            container.querySelectorAll('.file-tag button').forEach(btn => {
                btn.onclick = () => {
                    const idx = parseInt(btn.dataset.idx);
                    attachedFiles.splice(idx, 1);
                    renderFileBadges();
                };
            });
        }

        function renderModuleDropdown() {
            const sel = document.getElementById('moduleSelect');
            sel.innerHTML = '';
            if (!modules.length) {
                const opt = document.createElement('option');
                opt.text = '❌ No engines — Admin setup';
                opt.disabled = true;
                sel.appendChild(opt);
                return;
            }
            modules.forEach(mod => {
                const opt = document.createElement('option');
                opt.value = mod.id;
                opt.textContent = `${mod.displayName} (${mod.dailyLimitPerUser}/day)`;
                if (selectedModuleId === mod.id) opt.selected = true;
                sel.appendChild(opt);
            });

                        return;
                    }
                    const passwordHash = await hashPassword(password);
                    await apiPost('/api/users', {
                        email,
                        username,
                        name,
                        passwordHash,
                        profilePic: '',
                        dailyCallsRecord: { date: '', count: 0 },
                        extraChatCredits: 0,
                        extraImageCredits: 0,
                        banned: false,
                        createdAt: Date.now(),
                        totalHoursLive: 0,
                        lastActive: Date.now(),
                        authProvider: 'email'
                    });
                    document.getElementById('authMessage').innerHTML = '✅ Account created! Please login.';
                    document.getElementById('registerForm').classList.add('hidden');
                    document.getElementById('loginForm').classList.remove('hidden');
                } catch (e) {
                    document.getElementById('authMessage').textContent = 'Registration error: ' + e.message;
                }
            };
        }

        // ─── BOOT WITH ERROR HANDLING ───
        (async function boot() {
            try {
                await loadAllData();
                await initAuth();
            } catch (err) {
                console.error('Boot error:', err);
                const root = document.getElementById('app-root');
                root.className = 'error';
                root.innerHTML = `
                        <h2>⚠️ Connection Error</h2>
                        <p>Could not connect to the Vrythos server. Make sure the backend is running and reachable.</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">${escapeHtml(err.message)}</p>
                        <button onclick="location.reload()">🔄 Retry</button>
                    `;
            }
        })();
    </script>
</body>
</html>
