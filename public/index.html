<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vrythos AI · Neural Core</title>
    <!-- Google Sign-In script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>/* fake style - real app built by JS */</style>
</head>
<body>
<!-- ================= FAKE DECOY CODE ================= -->
<!-- 20+ lines of fake comments and invisible divs (same as before) -->
<div id="app-root">Loading Vrythos Neural Core...</div>

<script>
(async function(){
    // ------------------------------------------------------------------
    // BACKEND API HELPERS
    // ------------------------------------------------------------------
    async function apiGet(endpoint) {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }
    async function apiPost(endpoint, data) {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || 'Request failed');
        }
        return res.json();
    }
    async function apiPut(endpoint, data) {
        const res = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }
    async function apiDelete(endpoint) {
        const res = await fetch(endpoint, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
    }

    // Global data
    let currentUser = null;
    let modules = [];
    let tournaments = [];
    let selectedModuleId = null;
    let deepThink = false;
    let liveImageMode = false;
    let messagesHistory = [];
    let attachedFiles = [];
    let isProcessing = false;

    async function loadAllData() {
        modules = await apiGet('/api/modules');
        tournaments = await apiGet('/api/tournaments');
    }

    // User management (server-side)
    async function loadUsers() { return await apiGet('/api/users'); }
    async function updateUser(email, updates) { return await apiPut(`/api/users/${email}`, updates); }
    async function deleteUser(email) { return await apiDelete(`/api/users/${email}`); }

    // User API keys
    async function loadUserApiKeys(email) {
        const allKeys = await apiGet('/api/userApiKeys');
        const entry = allKeys.find(e => e.email === email);
        return entry ? entry.keys : [];
    }
    async function saveUserApiKeys(email, keys) {
        await apiPost('/api/userApiKeys', { email, keys });
    }

    // Abuse & pending bans (server-side)
    async function addAbuseReport(report) { return await apiPost('/api/abuse', report); }
    async function addPendingBan(ban) { return await apiPost('/api/pendingBans', ban); }

    // Image quotas
    async function getImageQuota(email) {
        const quotas = await apiGet('/api/imageQuotas');
        return quotas.find(q => q.email === email) || { email, count: 0, windowStart: Date.now() };
    }
    async function setImageQuota(quota) { return await apiPost('/api/imageQuotas', quota); }

    // Chat usage
    async function getChatUsage(email, moduleId, date) {
        const all = await apiGet('/api/chatUsage');
        return all.find(u => u.email === email && u.moduleId === moduleId && u.date === date) || { email, moduleId, date, count: 0 };
    }
    async function setChatUsage(usage) { return await apiPost('/api/chatUsage', usage); }

    // Bug reports
    async function addBugReport(bug) { return await apiPost('/api/bugs', bug); }

    // Tournaments
    async function joinTournament(tournamentId) {
        return await apiPost('/api/join-tournament', { email: currentUser.email, tournamentId });
    }

    // ------------------------------------------------------------------
    // HELPER FUNCTIONS
    // ------------------------------------------------------------------
    async function hashPassword(pw) {
        const enc = new TextEncoder().encode(pw);
        const hash = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // FIX: escapeHtml now also escapes double-quotes for safety in HTML attributes
    function escapeHtml(str){
        return String(str).replace(/[&<>"]/g, function(m){
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            if(m === '"') return '&quot;';
            return m;
        });
    }

    // Abuse score
    let abuseScore = 0;
    let abuseWarningShown = false;
    async function addAbuseScore(points, reason, context, showUserWarning = true) {
        if (!currentUser) return;
        abuseScore = Math.min(100, abuseScore + points);
        console.log(`⚠️ Abuse score +${points} → ${abuseScore}% (${reason})`);
        await addPendingBan({
            email: currentUser.email,
            username: currentUser.username,
            score: abuseScore,
            reason: reason,
            context: context.slice(0, 200),
            timestamp: Date.now(),
            reviewed: false
        });
        await addAbuseReport({ email: currentUser.email, username: currentUser.username, reason, context: context.slice(0,100), timestamp: Date.now() });
        if ((abuseScore >= 10 && !abuseWarningShown) || (points >= 5 && showUserWarning)) {
            abuseWarningShown = true;
            addAIMessage(`⚠️ Warning: Your account has been flagged for suspicious activity (current abuse score: ${abuseScore}%). Repeated violations may lead to a ban.`);
        }
    }

    // Right-click & dev tools detection
    document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        addAbuseScore(5, "Right-click attempt", "User right-clicked on page");
        showWarningModal("Right-click is prohibited. Your action has been reported to admin.");
        return false;
    });
    function detectDevTools() {
        const threshold = 160;
        const widthDiff = window.outerWidth - window.innerWidth > threshold;
        const heightDiff = window.outerHeight - window.innerHeight > threshold;
        if (widthDiff || heightDiff) {
            addAbuseScore(10, "Developer tools detected", "DevTools opened");
            showWarningModal("Developer tools detected! This has been reported to admin.");
        }
    }
    setInterval(detectDevTools, 2000);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
            e.preventDefault();
            addAbuseScore(10, "View source attempt", "Tried to view page source");
            showWarningModal("Viewing source is forbidden. Reported to admin.");
            return false;
        }
    });
    function showWarningModal(msg) {
        let modal = document.createElement("div");
        modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>⚠️ Warning</h3><p>${escapeHtml(msg)}</p><button id="closeWarningBtn">OK</button></div>`;
        document.body.appendChild(modal);
        document.getElementById("closeWarningBtn").onclick = () => modal.remove();
    }

    // ------------------------------------------------------------------
    // IMAGE GENERATION (Cloudflare SD + fallback)
    // ------------------------------------------------------------------
    async function generateImageWithCloudflare(prompt) {
        try {
            const res = await fetch('/api/generate/image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const data = await res.json();
            if (data.success) return data.image;
        } catch(e) { console.warn(e); }
        return null;
    }
    async function generateImageWithPollinations(prompt) {
        try {
            const res = await fetch('/api/fallback/image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const data = await res.json();
            if (data.success) return data.image;
        } catch(e) { console.warn(e); }
        return null;
    }

    // FIX: Image download/copy now uses a global imgStore map keyed by a short id,
    // instead of embedding the full base64 data URI directly into onclick HTML attributes
    // (which broke for large images because attribute values have browser length limits).
    const imgStore = {};
    let imgStoreCounter = 0;
    window.downloadImage = function(imgId) {
        const dataUrl = imgStore[imgId];
        if (!dataUrl) return;
        const link = document.createElement('a');
        link.download = 'vrythos_image.png';
        link.href = dataUrl;
        link.click();
    };
    window.copyImageToClipboard = async function(imgId) {
        const dataUrl = imgStore[imgId];
        if (!dataUrl) return;
        try {
            const blob = await (await fetch(dataUrl)).blob();
            await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
            alert('Image copied to clipboard!');
        } catch(e) {
            alert('Copy failed: ' + e.message);
        }
    };

    async function generateImageAndShow(prompt) {
        addAIMessage("🖌️ Generating image...", false);
        let imgData = await generateImageWithCloudflare(prompt);
        if (!imgData) imgData = await generateImageWithPollinations(prompt);
        if (imgData && imgData.startsWith('data:image')) {
            // FIX: Store image in imgStore and reference by id to avoid oversized HTML attributes
            const imgId = 'img_' + (++imgStoreCounter);
            imgStore[imgId] = imgData;
            const imgHtml = `<img src="${imgData}" style="max-width:100%; border-radius:16px;" /><br>
                             <button onclick="downloadImage('${imgId}')">⬇️ Download</button>
                             <button onclick="copyImageToClipboard('${imgId}')">📋 Copy</button>`;
            addAIMessage(imgHtml, true);
        } else {
            addAIMessage("❌ Image generation failed. Please try again later.");
        }
    }

    async function getRemainingImages() {
        const quota = await getImageQuota(currentUser.email);
        const now = Date.now();
        const windowMs = 5 * 60 * 60 * 1000;
        let base = (now - quota.windowStart >= windowMs) ? 5 : Math.max(0, 5 - quota.count);
        let extra = currentUser.extraImageCredits || 0;
        return base + extra;
    }
    async function consumeImage() {
        let quota = await getImageQuota(currentUser.email);
        const now = Date.now();
        const windowMs = 5 * 60 * 60 * 1000;
        if (now - quota.windowStart >= windowMs) {
            quota = { email: currentUser.email, count: 0, windowStart: now };
        }
        if (await getRemainingImages() <= 0) return false;
        quota.count++;
        await setImageQuota(quota);
        updateImageDisplay();
        return true;
    }

    // ------------------------------------------------------------------
    // CHAT LIMITS
    // ------------------------------------------------------------------
    async function getTodayCalls() {
        const today = new Date().toDateString();
        const usage = await getChatUsage(currentUser.email, selectedModuleId, today);
        return usage.count || 0;
    }
    async function incrementDailyCalls() {
        const today = new Date().toDateString();
        let usage = await getChatUsage(currentUser.email, selectedModuleId, today);
        usage.count = (usage.count || 0) + 1;
        await setChatUsage(usage);
        updateSidebarStats();
    }
    async function canMakeChatCall() {
        if (currentUser.banned) return false;
        const used = await getTodayCalls();
        const limit = 50 + (currentUser.extraChatCredits || 0);
        return used < limit;
    }

    // ------------------------------------------------------------------
    // AI ENGINE CALLS (using backend /api/chat)
    // ------------------------------------------------------------------
    async function callChatAPI(module_id, messages, deepThinkActive) {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                module_id: module_id,
                messages: messages,
                deep_think: deepThinkActive
            })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'Chat API error');
        return data.reply;
    }

    // ------------------------------------------------------------------
    // USER ACTIVITY TRACKING (hours live)
    // ------------------------------------------------------------------
    let activityInterval = null;
    function startActivityTracking() {
        if (activityInterval) clearInterval(activityInterval);
        activityInterval = setInterval(async () => {
            if (currentUser) {
                await apiPost('/api/user-activity', { email: currentUser.email });
            }
        }, 5 * 60 * 1000);
    }

    // ------------------------------------------------------------------
    // UI HELPERS
    // ------------------------------------------------------------------
    function setProcessing(processing) {
        isProcessing = processing;
        const input = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        if(input) input.disabled = processing;
        if(sendBtn) sendBtn.disabled = processing;
        if(processing) {
            if(input) input.placeholder = "⏳ Vrythos is thinking... please wait";
        } else {
            if(input) input.placeholder = "Enter next chat";
            if(input) input.focus();
        }
    }
    function addUserMessage(text){
        let container = document.getElementById("messagesContainer");
        let div = document.createElement("div");
        div.className = "message user-message";
        let initial = currentUser.username.charAt(0).toUpperCase();
        div.innerHTML = `<div class="avatar" style="background:#4b5563;">${escapeHtml(initial)}</div><div class="bubble">${escapeHtml(text).replace(/\n/g,"<br>")}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
    // FIX: addAIMessage only pushes to messagesHistory once (when !isHtml).
    // The old sendMessage() also pushed the reply manually after the try block,
    // causing every AI text reply to appear TWICE in history → AI saw its own
    // messages duplicated, leading to confused/looping responses.
    // Solution: addAIMessage is the single source of truth for history pushes.
    function addAIMessage(html, isHtml=false){
        let container = document.getElementById("messagesContainer");
        let div = document.createElement("div");
        div.className = "message ai-message";
        div.innerHTML = `<div class="avatar">⚡</div><div class="bubble">${isHtml ? html : escapeHtml(html).replace(/\n/g,"<br>")}</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        if(!isHtml) messagesHistory.push({role:"assistant", content:html});
    }
    function showTyping(){
        let container = document.getElementById("messagesContainer");
        let div = document.createElement("div");
        div.id = "typingMsg";
        div.className = "message ai-message";
        div.innerHTML = `<div class="avatar">⚡</div><div class="bubble">▮ Thinking...</div>`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }
    function isImageGenerationRequest(text) {
        const imgKeywords = /(make|create|generate|draw|paint|render).*(image|picture|photo|art|illustration).*of\s+(.+)|(image|picture|photo|art|illustration)\s+(of|with)\s+(.+)/i;
        return imgKeywords.test(text);
    }
    async function sendMessage(userText, forceImage = false) {
        if (!currentUser || currentUser.banned) { addAIMessage("🚫 Account banned."); return; }
        if (isProcessing) { addAIMessage("⏳ Please wait, previous message is still being processed."); return; }
        setProcessing(true);
        try {
            if (!(await canMakeChatCall()) && !forceImage) {
                addAIMessage(`⛔ Daily chat limit reached (${50+(currentUser.extraChatCredits||0)}/day). Request extra via bug report.`);
                setProcessing(false);
                return;
            }
            let willImage = (liveImageMode || forceImage || isImageGenerationRequest(userText)) && userText.length > 2;
            if (willImage) {
                addUserMessage(`🎨 ${userText.substring(0,100)}`);
                let prompt = userText;
                const match = userText.match(/.*(?:make|create|generate|draw|paint|render)\s+(?:an?\s+)?(image|picture|photo|art|illustration)\s+(?:of|with)\s+(.+)/i);
                if (match && match[2]) prompt = match[2];
                await generateImageAndShow(prompt);
                setProcessing(false);
                return;
            }
            let module = modules.find(m => m.id === selectedModuleId);
            if (!module) { addAIMessage("❌ No AI engine selected. Contact admin."); setProcessing(false); return; }
            let fullMsg = userText;
            if (attachedFiles.length) {
                fullMsg += "\n\n[Attached files]\n" + attachedFiles.map(f => f.isText ? `${f.name}:\n${f.content}` : `${f.name} (binary)`).join("\n");
                attachedFiles = [];
                renderFileBadges();
            }
            addUserMessage(userText);
            messagesHistory.push({ role: "user", content: fullMsg });
            let typing = showTyping();
            let reply = "";
            try {
                reply = await callChatAPI(selectedModuleId, messagesHistory.slice(-12), deepThink);
                await incrementDailyCalls();
                updateRemainingDisplay();
                updateSidebarStats();
                if (reply.includes("quota") || reply.includes("limit")) {
                    await addAbuseScore(5, "API quota warning", userText, true);
                }
                const lowerInput = userText.toLowerCase();
                const creatorKeywords = ["who made you", "who created you", "your creator", "who built you", "viraj", "bodare"];
                if (creatorKeywords.some(keyword => lowerInput.includes(keyword))) {
                    reply = "I am Vrythos, an advanced AI framework built by **Viraj S. Bodare**. I operate through multiple high-performance engines and am designed to be helpful, safe, and honest.";
                }
            } catch(e) {
                reply = `⚠️ Service temporarily unavailable. Please check your internet connection and try again later. Error: ${e.message}`;
            } finally {
                if(typing) typing.remove();
            }
            // FIX: REMOVED the duplicate `messagesHistory.push({role:"assistant"...})` that was here.
            // addAIMessage() below already pushes to history for non-HTML messages.
            // Having both caused every AI reply to appear twice in the conversation context,
            // making the AI confused and wasting context window tokens.
            addAIMessage(reply);
        } finally {
            setProcessing(false);
        }
    }
    async function updateRemainingDisplay() {
        let mod = modules.find(m => m.id === selectedModuleId);
        if (mod) {
            const used = await getTodayCalls();
            const left = mod.dailyLimitPerUser - used;
            document.getElementById("moduleRemaining").innerHTML = `📨 Today: ${left > 0 ? left : 0}/${mod.dailyLimitPerUser} msgs left`;
        } else {
            document.getElementById("moduleRemaining").innerHTML = `⚠️ No active engine`;
        }
    }
    async function updateSidebarStats() {
        let left = 50 + (currentUser.extraChatCredits||0) - (await getTodayCalls());
        document.getElementById("dailyCallsLeft").innerText = Math.max(0, left);
        document.getElementById("sidebarUsername").innerHTML = escapeHtml(currentUser.username);
        await updateImageDisplay();
    }
    async function updateImageDisplay() {
        let rem = await getRemainingImages();
        document.getElementById("imageUsageDisplay").innerHTML = `🎨 Images left: ${rem} (base+extra)`;
    }
    function renderFileBadges() {
        let container = document.getElementById("filePreviewArea");
        container.innerHTML = attachedFiles.map((f,idx) => `<span class="file-tag">📄 ${escapeHtml(f.name)} <button data-idx="${idx}" style="background:none;border:none;color:#ef4444;">✖</button></span>`).join("");
        document.querySelectorAll(".file-tag button").forEach(btn => btn.onclick = e => {
            let idx = parseInt(btn.dataset.idx);
            attachedFiles.splice(idx,1);
            renderFileBadges();
        });
    }
    // FIX: renderModuleDropdown now sets selectedModuleId to the first module
    // if it hasn't been selected yet, so the AI engine is always ready to use on load.
    function renderModuleDropdown() {
        let sel = document.getElementById("moduleSelect");
        sel.innerHTML = "";
        if (!modules.length) {
            let opt = document.createElement("option");
            opt.text = "❌ No engines — Admin setup";
            opt.disabled = true;
            sel.appendChild(opt);
            return;
        }
        modules.forEach(mod => {
            let opt = document.createElement("option");
            opt.value = mod.id;
            opt.textContent = `${mod.displayName} (${mod.dailyLimitPerUser}/day)`;
            if (selectedModuleId === mod.id) opt.selected = true;
            sel.appendChild(opt);
        });
        // FIX: Auto-select first module if none is selected
        if (!selectedModuleId && modules.length) {
            selectedModuleId = modules[0].id;
            sel.value = selectedModuleId;
        }
        sel.onchange = async e => {
            selectedModuleId = e.target.value;
            await updateRemainingDisplay();
        };
    }

    // ------------------------------------------------------------------
    // TOURNAMENTS DISPLAY
    // ------------------------------------------------------------------
    async function renderTournaments() {
        const container = document.getElementById("tournamentsContainer");
        if (!container) return;
        if (!tournaments.length) {
            container.innerHTML = "<i>No active tournaments.</i>";
            return;
        }
        container.innerHTML = tournaments.map(t => `
            <div style="background:#0e111b; border-radius:12px; padding:10px; margin-bottom:10px;">
                <strong>🏆 ${escapeHtml(t.name)}</strong><br>
                ${escapeHtml(t.description || '')}<br>
                Prize: ${escapeHtml(t.prize || 'None')}<br>
                ${t.participants?.includes(currentUser.email) ?
                    '<span style="color:#10b981;">✓ Joined</span>' :
                    `<button class="join-tournament" data-id="${escapeHtml(t.id)}">Join Tournament</button>`}
            </div>
        `).join("");
        document.querySelectorAll(".join-tournament").forEach(btn => {
            btn.onclick = async () => {
                await joinTournament(btn.dataset.id);
                await loadAllData();
                renderTournaments();
            };
        });
    }

    // ------------------------------------------------------------------
    // USER SETTINGS MODAL (with API key management)
    // ------------------------------------------------------------------
    async function openUserSettings() {
        let userKeys = await loadUserApiKeys(currentUser.email);
        const modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `
        <div class="modal-content" style="max-width: 700px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="margin:0;">👤 Account Center</h3>
                <span class="close-modal" style="cursor:pointer; font-size:24px;">&times;</span>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div>
                    <div style="background:#0e111b; border-radius:16px; padding:14px; margin-bottom:16px;">
                        <label style="font-size:12px; color:#8e9dc2;">PROFILE PICTURE URL</label>
                        <input type="text" id="profilePicUrl" placeholder="https://..." value="${escapeHtml(currentUser.profilePic || '')}" style="width:100%; background:#0a0c15; border:1px solid #1e293b; border-radius:28px; padding:8px 12px; color:white; margin:8px 0;">
                        <div class="profile-preview" id="profilePreview" style="width:60px; height:60px; border-radius:50%; background:var(--accent); margin:8px auto; background-size:cover;"></div>
                        <label style="font-size:12px; color:#8e9dc2;">CHANGE USERNAME</label>
                        <input type="text" id="newUsername" placeholder="New username" style="width:100%; background:#0a0c15; border:1px solid #1e293b; border-radius:28px; padding:8px 12px; color:white; margin:8px 0;">
                        <button id="updateUsernameBtn" style="width:100%; background:#2d3748; margin-bottom:8px;">Update Username</button>
                        <button id="deleteAccountBtn" style="width:100%; background:#ef4444;">🗑️ Delete Account Permanently</button>
                    </div>
                    <div style="background:#0e111b; border-radius:16px; padding:14px;">
                        <h4 style="margin:0 0 8px 0;">📊 Your Stats</h4>
                        <p style="font-size:13px; margin:4px 0;">Chat calls left today: <span id="statChatLeft">...</span></p>
                        <p style="font-size:13px; margin:4px 0;">Image credits left: <span id="statImgLeft">...</span></p>
                        <p style="font-size:13px; margin:4px 0;">Extra chat credits: ${currentUser.extraChatCredits||0}</p>
                        <p style="font-size:13px; margin:4px 0;">Extra image credits: ${currentUser.extraImageCredits||0}</p>
                        <p style="font-size:13px; margin:4px 0;">Total hours live: ${(currentUser.totalHoursLive || 0).toFixed(1)}</p>
                    </div>
                </div>
                <div>
                    <div style="background:#0e111b; border-radius:16px; padding:14px;">
                        <h4 style="margin:0 0 8px 0;">🔑 API Keys (for external projects)</h4>
                        <p style="font-size:12px; color:#8e9dc2;">Max 2 keys. Each key: 20 requests/day.</p>
                        <div id="apiKeysList" style="max-height:200px; overflow-y:auto; margin-bottom:12px;"></div>
                        <button id="generateApiKeyBtn" style="width:100%; background:#8b5cf6; margin-bottom:8px;">+ Generate New API Key</button>
                        <small style="font-size:10px;">Use with Bearer token: <code>Authorization: Bearer YOUR_KEY</code><br>Endpoint: <code>POST /api/external/chat</code></small>
                    </div>
                    <div style="background:#0e111b; border-radius:16px; padding:14px; margin-top:16px;">
                        <h4 style="margin:0 0 8px 0;">🐞 Report a Bug / Request Credits</h4>
                        <textarea id="bugReportText" placeholder="Describe issue or request" rows="2" style="width:100%; background:#0a0c15; border:1px solid #1e293b; border-radius:16px; padding:8px; color:white; margin-bottom:8px;"></textarea>
                        <button id="submitBugBtn" style="width:100%; background:#2d3748;">Submit Report</button>
                        <button id="logoutBtn" style="width:100%; background:#555; margin-top:8px;">🚪 Logout</button>
                    </div>
                </div>
            </div>
            <div style="background:#0e111b; border-radius:16px; padding:14px; margin-top:16px;">
                <h4 style="margin:0 0 8px 0;">⚖️ Legal & Terms</h4>
                <p style="font-size:12px;">By using Vrythos AI, you agree to our <a href="#" style="color:#8b5cf6;">Terms of Service</a> and <a href="#" style="color:#8b5cf6;">Privacy Policy</a>. All data is stored securely on our servers.</p>
            </div>
        </div>`;
        document.body.appendChild(modal);
        let close = () => modal.remove();
        modal.querySelector(".close-modal").onclick = close;

        // FIX: Load stats asynchronously after modal is in the DOM
        (async () => {
            const chatLeft = Math.max(0, 50 + (currentUser.extraChatCredits||0) - (await getTodayCalls()));
            const imgLeft = await getRemainingImages();
            const elChat = document.getElementById("statChatLeft");
            const elImg = document.getElementById("statImgLeft");
            if (elChat) elChat.textContent = `${chatLeft} / ${50+(currentUser.extraChatCredits||0)}`;
            if (elImg) elImg.textContent = imgLeft;
        })();

        // FIX: Set profile pic preview via JS (not inline style) to avoid CSS injection from user URLs
        const picInput = document.getElementById("profilePicUrl");
        const preview = document.getElementById("profilePreview");
        const safePicUrl = currentUser.profilePic || '';
        if (safePicUrl) preview.style.backgroundImage = `url(${JSON.stringify(safePicUrl)})`;
        picInput.addEventListener("input", () => {
            preview.style.backgroundImage = `url(${JSON.stringify(picInput.value)})`;
        });

        document.getElementById("updateUsernameBtn").onclick = async () => {
            let newName = document.getElementById("newUsername").value.trim();
            if (!newName) return;
            let users = await loadUsers();
            if (users.find(u => u.username === newName)) { alert("Username taken"); return; }
            await updateUser(currentUser.email, { username: newName });
            currentUser.username = newName;
            alert("Username changed. Please log in again.");
            close(); localStorage.removeItem("vrythos_current_session"); location.reload();
        };
        document.getElementById("deleteAccountBtn").onclick = async () => {
            if (!confirm("⚠️ Permanently delete your account and all data? This cannot be undone.")) return;
            await deleteUser(currentUser.email);
            localStorage.removeItem("vrythos_current_session");
            location.reload();
        };
        document.getElementById("submitBugBtn").onclick = async () => {
            let desc = document.getElementById("bugReportText").value.trim();
            if (!desc) return;
            await addBugReport({ email: currentUser.email, username: currentUser.username, description: desc, timestamp: Date.now(), status: "pending" });
            alert("Bug report submitted. Admin may grant extra credits if legit.");
            document.getElementById("bugReportText").value = "";
        };
        document.getElementById("logoutBtn").onclick = () => { localStorage.removeItem("vrythos_current_session"); location.reload(); };

        async function refreshApiKeysList() {
            userKeys = await loadUserApiKeys(currentUser.email);
            const container = document.getElementById("apiKeysList");
            if (!container) return;
            if (userKeys.length === 0) {
                container.innerHTML = "<i>No API keys generated yet.</i>";
                return;
            }
            container.innerHTML = userKeys.map((key, idx) => `
                <div style="background:#1e293b; margin:5px; padding:6px; border-radius:12px;">
                    <b>${escapeHtml(key.name)}</b><br>
                    <code style="font-size:10px; word-break:break-all;">${escapeHtml(key.key)}</code><br>
                    <span style="font-size:10px;">Used today: ${key.used || 0}/20</span>
                    <button class="revokeKey" data-idx="${idx}" style="float:right; background:#ef4444; border:none; border-radius:20px; padding:2px 8px;">Revoke</button>
                </div>
            `).join("");
            document.querySelectorAll(".revokeKey").forEach(btn => btn.onclick = async () => {
                let idx = parseInt(btn.dataset.idx);
                userKeys.splice(idx, 1);
                await saveUserApiKeys(currentUser.email, userKeys);
                await refreshApiKeysList();
            });
        }
        await refreshApiKeysList();
        document.getElementById("generateApiKeyBtn").onclick = async () => {
            if (userKeys.length >= 2) {
                alert("Maximum 2 API keys per user.");
                return;
            }
            let keyName = prompt("Label for this API key (e.g., MyApp)");
            if (!keyName) return;
            let newKey = "vrythos_" + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 8);
            userKeys.push({
                name: keyName,
                key: newKey,
                used: 0,
                date: new Date().toISOString().slice(0, 10)
            });
            await saveUserApiKeys(currentUser.email, userKeys);
            await refreshApiKeysList();
            alert(`New API Key generated: ${newKey}\nStore it safely. You won't see it again.`);
        };
    }

    // ------------------------------------------------------------------
    // BUILD UI (includes tournaments sidebar)
    // ------------------------------------------------------------------
    async function buildUI() {
        document.getElementById("app-root").innerHTML = `
        <div class="app">
            <div class="sidebar">
                <div class="logo"><span>🧠</span> Vrythos Core</div>
                <button class="new-chat-btn" id="newChatBtn">+ New Conversation</button>
                <div class="module-selector">
                    <label>🧠 AI ENGINE</label>
                    <select id="moduleSelect"></select>
                    <div id="moduleRemaining" class="usage-badge">Today: -- msgs left</div>
                </div>
                <div class="deep-think-container">
                    <label class="depth-heading">🔬 REASONING DEPTH</label>
                    <label class="deep-think-toggle"><input type="checkbox" id="deepThinkToggle"> Enable step‑by‑step analysis</label>
                </div>
                <div class="live-image-container">
                    <label class="live-heading">🎨 LIVE IMAGE MODE</label>
                    <label class="live-image-toggle"><input type="checkbox" id="liveImageToggle"> Auto‑generate images from descriptions</label>
                </div>
                <div id="imageUsageDisplay" class="usage-badge">🖼️ Images left: --</div>
                <div style="margin-top:16px;">
                    <div class="module-selector" style="margin-bottom:8px;">
                        <label>🏆 TOURNAMENTS</label>
                        <div id="tournamentsContainer" style="max-height:200px; overflow-y:auto;"></div>
                    </div>
                </div>
                <div style="font-size:11px; margin-top: auto; text-align:center; color:#5b6e8c;">
                    <span id="sidebarUsername">user</span> • <span id="dailyCallsLeft">50</span> calls left today
                </div>
            </div>
            <div class="main-chat">
                <div class="chat-header">
                    <div class="ai-status"><div class="status-dot"></div> Vrythos · Neural Core</div>
                    <div class="user-menu-btn" id="userSettingsBtn">👤 My Account ⚙️</div>
                </div>
                <div class="messages" id="messagesContainer">
                    <div class="message ai-message"><div class="avatar">🧠</div><div class="bubble">Welcome to Vrythos AI. Secure chat, image gen, and personal API keys for your projects!</div></div>
                </div>
                <div class="input-area">
                    <div id="filePreviewArea" class="file-badge"></div>
                    <div class="input-wrapper">
                        <button class="attach-btn" id="attachBtn" title="Attach file">📎</button>
                        <button class="img-gen-btn" id="imageGenBtn" title="Generate image">🎨</button>
                        <input type="text" id="userInput" placeholder="Enter next chat" autocomplete="off">
                        <button class="send-btn" id="sendBtn">➤</button>
                    </div>
                    <input type="file" id="fileInput" multiple style="display:none;" accept=".txt,.md,.json,.csv,.js,.html,.xml,.png,.jpg,.jpeg">
                </div>
            </div>
        </div>`;
        document.getElementById("newChatBtn").onclick = () => { messagesHistory = []; document.getElementById("messagesContainer").innerHTML = ""; addAIMessage("New session ready."); };
        document.getElementById("sendBtn").onclick = () => { let inp = document.getElementById("userInput"); if(inp.value.trim() && !isProcessing) sendMessage(inp.value.trim()); inp.value = ""; };
        document.getElementById("userInput").addEventListener("keypress", e => { if(e.key === "Enter") { let inp = document.getElementById("userInput"); if(inp.value.trim() && !isProcessing) sendMessage(inp.value.trim()); inp.value = ""; } });
        document.getElementById("deepThinkToggle").onchange = e => deepThink = e.target.checked;
        document.getElementById("liveImageToggle").onchange = e => liveImageMode = e.target.checked;
        document.getElementById("attachBtn").onclick = () => document.getElementById("fileInput").click();
        document.getElementById("fileInput").onchange = e => {
            if(e.target.files) Array.from(e.target.files).forEach(f => {
                let reader = new FileReader();
                reader.onload = ev => {
                    attachedFiles.push({ name: f.name, content: ev.target.result, isText: f.type.startsWith("text/") || f.name.match(/\.(txt|json|md)$/i) });
                    renderFileBadges();
                };
                if(f.type.startsWith("text/") || f.name.match(/\.(txt|json|md)$/i)) reader.readAsText(f);
                else reader.readAsDataURL(f);
            });
        };
        document.getElementById("imageGenBtn").onclick = () => { let inp = document.getElementById("userInput"); let prompt = inp.value.trim() || "cyberpunk city"; if(!isProcessing) sendMessage(prompt, true); inp.value = ""; };
        document.getElementById("userSettingsBtn").onclick = openUserSettings;
        renderModuleDropdown();
        await updateRemainingDisplay();
        await updateSidebarStats();
        await renderTournaments();
        startActivityTracking();
    }

    // ------------------------------------------------------------------
    // GOOGLE OAUTH CALLBACK
    // ------------------------------------------------------------------
    window.handleGoogleLogin = async (response) => {
        try {
            const res = await apiPost('/api/auth/google', { token: response.credential });
            if (res.success) {
                // FIX: Use full user data returned from server (including real credits/stats)
                // instead of hardcoding extraChatCredits:0 / banned:false which ignored DB values.
                currentUser = {
                    email: res.email,
                    username: res.username,
                    name: res.name,
                    profilePic: res.profilePic,
                    extraChatCredits: res.extraChatCredits || 0,
                    extraImageCredits: res.extraImageCredits || 0,
                    banned: res.banned || false,
                    totalHoursLive: res.totalHoursLive || 0
                };
                localStorage.setItem("vrythos_current_session", res.email);
                await buildUI();
            } else {
                document.getElementById("authMessage").innerText = res.error || "Google login failed";
            }
        } catch(e) {
            const authMsg = document.getElementById("authMessage");
            if (authMsg) authMsg.innerText = "Google login error: " + e.message;
        }
    };

    // ------------------------------------------------------------------
    // AUTHENTICATION (Google + Email/Password)
    // ------------------------------------------------------------------
    async function initAuth() {
        let savedSession = localStorage.getItem("vrythos_current_session");
        if (savedSession) {
            try {
                let users = await loadUsers();
                // FIX: Normalize the restored session user to the same shape as Google OAuth login
                // (previously initAuth set currentUser to the raw DB object while Google OAuth
                // set a slimmer object, causing inconsistent currentUser shapes throughout the app)
                let dbUser = users.find(u => u.email === savedSession && !u.banned);
                if (dbUser) {
                    currentUser = {
                        email: dbUser.email,
                        username: dbUser.username,
                        name: dbUser.name || '',
                        profilePic: dbUser.profilePic || '',
                        passwordHash: dbUser.passwordHash || null,
                        extraChatCredits: dbUser.extraChatCredits || 0,
                        extraImageCredits: dbUser.extraImageCredits || 0,
                        banned: dbUser.banned || false,
                        totalHoursLive: dbUser.totalHoursLive || 0,
                        authProvider: dbUser.authProvider || 'email'
                    };
                    await buildUI();
                    return;
                }
            } catch(e) {
                console.warn('Session restore failed:', e.message);
                localStorage.removeItem("vrythos_current_session");
            }
        }
        document.getElementById("app-root").innerHTML = `
        <div class="auth-container">
            <div class="auth-card" style="background: linear-gradient(145deg, #11141f, #0a0c15);">
                <h2>⚡ VRYTHOS NEURAL</h2>
                <div id="loginForm">
                    <!-- Google Sign-In button -->
                    <div id="g_id_onload"
                        data-client_id="527067177247-mk8l2ratnkatefh8sogs4vedogmg9lk8.apps.googleusercontent.com"
                        data-callback="handleGoogleLogin"
                        data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin"
                        data-type="standard"
                        data-size="large"
                        data-theme="filled_blue"
                        data-text="sign_in_with"
                        data-shape="rectangular"
                        data-logo_alignment="left">
                    </div>
                    <div style="margin: 15px 0; text-align: center; color: #8e9dc2;">──────── or ────────</div>
                    <input type="email" id="loginEmail" placeholder="Email" autocomplete="off">
                    <input type="password" id="loginPassword" placeholder="Password">
                    <button id="doLoginBtn">Sign In</button>
                    <div class="auth-switch" id="showRegisterBtn">✨ Create new account</div>
                    <div class="auth-switch" id="forgotPasswordBtn" style="color:#8e9dc2;">🔐 Forgot password?</div>
                </div>
                <div id="registerForm" class="hidden">
                    <input type="text" id="regUsername" placeholder="Username">
                    <input type="text" id="regName" placeholder="Full Name">
                    <input type="email" id="regEmail" placeholder="Email">
                    <input type="password" id="regPassword" placeholder="Password (min 4 chars)">
                    <input type="password" id="regPasswordConfirm" placeholder="Confirm password">
                    <button id="doRegisterBtn">Register</button>
                    <div class="auth-switch" id="showLoginBtn">← Back to login</div>
                </div>
                <div id="authMessage" style="margin-top:12px; font-size:12px; color:#f97316; text-align:center;"></div>
            </div>
        </div>`;

        // FIX: Re-initialize Google Sign-In after the g_id_onload div is in the DOM
        if (window.google && window.google.accounts) {
            window.google.accounts.id.initialize({
                client_id: "527067177247-mk8l2ratnkatefh8sogs4vedogmg9lk8.apps.googleusercontent.com",
                callback: window.handleGoogleLogin
            });
            window.google.accounts.id.renderButton(
                document.querySelector(".g_id_signin"),
                { theme: "filled_blue", size: "large", shape: "rectangular", text: "sign_in_with", logo_alignment: "left" }
            );
        }

        // FIX: Enter key on password field triggers login
        document.getElementById("loginPassword").addEventListener("keypress", e => {
            if (e.key === "Enter") document.getElementById("doLoginBtn").click();
        });

        document.getElementById("doLoginBtn").onclick = async () => {
            let email = document.getElementById("loginEmail").value.trim();
            let pwd = document.getElementById("loginPassword").value;
            try {
                let users = await loadUsers();
                let user = users.find(u => u.email === email);
                if (!user) {
                    document.getElementById("authMessage").innerHTML = "❌ User not found. <a href='#' id='suggestRegister'>Create new account?</a>";
                    document.getElementById("suggestRegister")?.addEventListener("click", () => document.getElementById("showRegisterBtn").click());
                    return;
                }
                if (!user.passwordHash) {
                    document.getElementById("authMessage").innerText = "This account uses Google login. Please use Google Sign-In.";
                    return;
                }
                let hashed = await hashPassword(pwd);
                if (user.passwordHash !== hashed) { document.getElementById("authMessage").innerText = "Wrong password"; return; }
                if (user.banned) { document.getElementById("authMessage").innerText = "Account banned."; return; }
                // FIX: Normalize currentUser shape on email login (same as Google OAuth path)
                currentUser = {
                    email: user.email,
                    username: user.username,
                    name: user.name || '',
                    profilePic: user.profilePic || '',
                    passwordHash: user.passwordHash || null,
                    extraChatCredits: user.extraChatCredits || 0,
                    extraImageCredits: user.extraImageCredits || 0,
                    banned: user.banned || false,
                    totalHoursLive: user.totalHoursLive || 0,
                    authProvider: user.authProvider || 'email'
                };
                localStorage.setItem("vrythos_current_session", user.email);
                await buildUI();
            } catch(e) {
                document.getElementById("authMessage").innerText = "Login error: " + e.message;
            }
        };
        document.getElementById("showRegisterBtn").onclick = () => {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("registerForm").classList.remove("hidden");
            document.getElementById("authMessage").innerHTML = "";
        };
        document.getElementById("showLoginBtn").onclick = () => {
            document.getElementById("registerForm").classList.add("hidden");
            document.getElementById("loginForm").classList.remove("hidden");
        };
        document.getElementById("forgotPasswordBtn")?.addEventListener("click", () => alert("Password reset is not available. Use Google login or contact admin."));
        document.getElementById("doRegisterBtn").onclick = async () => {
            let username = document.getElementById("regUsername").value.trim();
            let name = document.getElementById("regName").value.trim();
            let email = document.getElementById("regEmail").value.trim();
            let password = document.getElementById("regPassword").value;
            let confirm = document.getElementById("regPasswordConfirm").value;
            if (!username || !name || !email || password.length < 4 || password !== confirm) {
                document.getElementById("authMessage").innerText = "Please fill all fields correctly (password min 4 chars, match)";
                return;
            }
            try {
                let users = await loadUsers();
                if (users.find(u => u.email === email)) {
                    document.getElementById("authMessage").innerText = "Email already registered";
                    return;
                }
                if (users.find(u => u.username === username)) {
                    document.getElementById("authMessage").innerText = "Username already taken";
                    return;
                }
                let passwordHash = await hashPassword(password);
                let newUser = {
                    email,
                    username,
                    name,
                    passwordHash,
                    profilePic: "",
                    dailyCallsRecord: { date: "", count: 0 },
                    extraChatCredits: 0,
                    extraImageCredits: 0,
                    banned: false,
                    createdAt: Date.now(),
                    totalHoursLive: 0,
                    lastActive: Date.now(),
                    authProvider: 'email'
                };
                await apiPost('/api/users', newUser);
                document.getElementById("authMessage").innerHTML = "✅ Account created! Please login.";
                document.getElementById("registerForm").classList.add("hidden");
                document.getElementById("loginForm").classList.remove("hidden");
            } catch(e) {
                document.getElementById("authMessage").innerText = "Registration error: " + e.message;
            }
        };
    }

    await loadAllData();
    await initAuth();
})();
</script>
<style>
    /* same CSS as before – fixed send-btn color + height */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg-primary: #0a0c15; --bg-secondary: #11141f; --bg-sidebar: #0e111b; --text-primary: #f0f3fa; --text-secondary: #8e9dc2; --accent: #8b5cf6; --border: #1e293b; --user-bubble: #7c3aed; --ai-bubble: #1e293b; --success: #10b981; --danger: #ef4444; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; }
    .app, .auth-container { display: flex; height: 100vh; width: 100%; }
    .auth-container { align-items: center; justify-content: center; background: radial-gradient(circle at 20% 30%, #0f1222, #03050b); }
    .auth-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 2rem; padding: 2rem; width: 380px; backdrop-filter: blur(8px); }
    .auth-card h2 { margin-bottom: 1.5rem; text-align: center; background: linear-gradient(135deg, #c084fc, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .auth-card input { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); padding: 12px; border-radius: 28px; color: white; margin-bottom: 12px; outline: none; }
    .auth-card button { background: var(--accent); border: none; padding: 12px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer; }
    .hidden { display: none !important; }
    .sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 16px; gap: 24px; overflow-y: auto; }
    .logo { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #c084fc, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .new-chat-btn { background: var(--accent); border: none; padding: 12px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; }
    .module-selector, .deep-think-container, .live-image-container { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 12px; }
    select, .deep-think-toggle, .live-image-toggle { width: 100%; background: var(--bg-primary); border: 1px solid var(--border); padding: 8px 12px; border-radius: 28px; color: white; }
    .deep-think-container .depth-heading, .live-image-container .live-heading { display: block !important; font-size: 0.7rem !important; text-transform: uppercase !important; color: var(--text-secondary) !important; margin-bottom: 8px !important; }
    .deep-think-toggle, .live-image-toggle { margin-top: 0 !important; display: flex !important; align-items: center !important; gap: 10px !important; width: 100% !important; }
    .usage-badge { font-size: 11px; background: #1e293b; padding: 4px 8px; border-radius: 20px; text-align: center; margin-top: 6px; }
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); }
    .user-menu-btn { background: #2d3748; border-radius: 40px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { display: flex; gap: 12px; max-width: 80%; }
    .user-message { align-self: flex-end; flex-direction: row-reverse; }
    .ai-message { align-self: flex-start; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; background-size: cover; flex-shrink: 0; }
    .bubble { padding: 12px 18px; border-radius: 22px; line-height: 1.5; font-size: 0.9rem; }
    .user-message .bubble { background: var(--user-bubble); border-bottom-right-radius: 6px; }
    .ai-message .bubble { background: var(--ai-bubble); border-bottom-left-radius: 6px; border: 1px solid var(--border); }
    .input-area { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--bg-secondary); }
    .input-wrapper { display: flex; gap: 8px; background: var(--bg-primary); border-radius: 60px; padding: 4px 4px 4px 20px; border: 1px solid var(--border); align-items: center; }
    .input-wrapper input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
    .input-wrapper input:disabled { opacity: 0.5; cursor: not-allowed; }
    /* FIX: send-btn now has explicit color, height, display so it renders correctly on all browsers */
    .send-btn { background: var(--accent); border: none; width: 44px; height: 44px; border-radius: 40px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .attach-btn, .img-gen-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 4px 6px; opacity: 0.7; transition: opacity 0.2s; }
    .attach-btn:hover, .img-gen-btn:hover { opacity: 1; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--bg-secondary); border-radius: 28px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; padding: 24px; border: 1px solid var(--accent); }
    .close-modal { cursor: pointer; }
    .profile-preview { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); margin: 10px auto; background-size: cover; }
    .file-badge { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .file-tag { background: #2d3748; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
    .ai-status { display: flex; align-items: center; font-weight: 600; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    @media (max-width: 700px) { .sidebar { display: none; } .message { max-width: 95%; } }
</style>
</body>
</html>
