<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Vrythos AI · Neural Core</title>
    <!-- Google Sign‑In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ────────────── Reset & Variables ────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0b10;
            --bg-secondary: #14161f;
            --bg-card: #1a1d2b;
            --bg-elevated: #252a3f;
            --border-subtle: #2a2f45;
            --text-primary: #f0f3fa;
            --text-secondary: #a8b2d4;
            --text-muted: #5e6e94;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --accent-hover: #7c3aed;
            --shadow-card: 0 12px 48px rgba(0, 0, 0, 0.6);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: 0.2s ease;
        }
        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: var(--radius-full);
        }

        /* ────────────── Auth ────────────── */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background: radial-gradient(ellipse at 20% 30%, #181c2a, #07080e 70%);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2.25rem 1.75rem;
            box-shadow: var(--shadow-card);
        }
        .auth-card h2 {
            font-size: 1.7rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1.75rem;
        }
        .auth-card input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.85rem 1.25rem;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            margin-bottom: 0.9rem;
        }
        .auth-card input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .auth-card button {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-full);
            padding: 0.9rem;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .auth-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
        }
        .auth-switch {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-switch:hover {
            color: var(--accent);
        }
        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.25rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        .hidden {
            display: none !important;
        }
        #authMessage {
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: center;
            color: #f87171;
            min-height: 1.5rem;
        }
        .g_id_signin {
            display: flex;
            justify-content: center;
        }

        /* ────────────── App Layout ────────────── */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* ────────────── Sidebar ────────────── */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 1.25rem 1rem;
            gap: 1.25rem;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .sidebar .logo span {
            font-size: 1.6rem;
        }
        .sidebar .new-chat-btn {
            background: var(--accent);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-full);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.25);
        }
        .sidebar .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 92, 246, 0.35);
        }
        .sidebar .section {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1rem 1rem 0.75rem;
            border: 1px solid var(--border-subtle);
        }
        .sidebar .section-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.6rem;
            display: block;
        }
        .sidebar .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.3rem 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar .toggle-row:hover {
            color: var(--text-primary);
        }
        .sidebar .toggle-row input[type="checkbox"] {
            appearance: none;
            width: 36px;
            height: 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .sidebar .toggle-row input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: var(--transition);
        }
        .sidebar .toggle-row input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .sidebar .toggle-row input[type="checkbox"]:checked::after {
            left: 18px;
            background: #fff;
        }
        .sidebar .footer-stats {
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar .footer-stats strong {
            color: var(--text-secondary);
        }
        .sidebar .module-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-full);
            text-align: center;
            border: 1px solid var(--border-subtle);
            margin-top: 0.5rem;
        }

        /* ────────────── Main Chat ────────────── */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            min-width: 0;
        }
        .chat-header {
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .chat-header .ai-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .chat-header .ai-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .chat-header .user-menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.45rem 1.1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .chat-header .user-menu-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ────────────── Messages ────────────── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.5rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .message {
            display: flex;
            gap: 0.7rem;
            max-width: 85%;
            animation: msg-in 0.25s ease;
        }
        @keyframes msg-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.ai-message {
            align-self: flex-start;
        }
        .message .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
        }
        .message.user-message .avatar {
            background: #374151;
            box-shadow: none;
        }
        .message .bubble {
            padding: 0.65rem 1.1rem;
            border-radius: var(--radius-md);
            line-height: 1.6;
            font-size: 0.9rem;
            word-break: break-word;
            position: relative;
            max-width: 100%;
            overflow: visible;
        }
        .message.user-message .bubble {
            background: var(--accent);
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        .message.ai-message .bubble {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 4px;
        }
        .message .bubble img,
        .message .bubble video {
            border-radius: var(--radius-sm);
            max-width: 100%;
        }
        .message .bubble .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }
        .message .bubble .btn-row button {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.2rem 0.9rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .message .bubble .btn-row button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .message .bubble .btn-row button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* Code block styling */
        .message .bubble .code-block-wrapper {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 1px solid var(--border-subtle);
            position: relative;
        }
        .message .bubble .code-block-wrapper .code-lang {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            display: block;
        }
        .message .bubble .code-block-wrapper pre {
            margin: 0;
            overflow-x: auto;
        }
        .message .bubble .code-block-wrapper pre code {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }
        .message .bubble .code-block-wrapper .code-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .message .bubble .code-block-wrapper .code-actions button {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.2rem 0.7rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .message .bubble .code-block-wrapper .code-actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .message .bubble .code-block-wrapper .code-actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        /* Full output button */
        .message .bubble .message-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            justify-content: flex-end;
        }
        .message .bubble .message-actions button {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.15rem 0.6rem;
            font-size: 0.6rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .message .bubble .message-actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ────────────── Input Area ────────────── */
        .input-area {
            padding: 0.9rem 1.5rem 1.2rem;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }
        .input-area .file-badge {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .input-area .file-badge .file-tag {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.2rem 0.8rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .input-area .file-badge .file-tag button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .input-wrapper {
            display: flex;
            align-items: stretch;
            gap: 0.4rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            transition: var(--transition);
            min-height: 44px;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.6rem 0;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 200px;
            line-height: 1.5;
            font-family: var(--font);
        }
        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }
        .input-wrapper textarea:disabled {
            opacity: 0.5;
        }
        .input-wrapper .tool-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.15rem;
            cursor: pointer;
            padding: 0.4rem 0.3rem;
            transition: var(--transition);
            flex-shrink: 0;
            align-self: center;
        }
        .input-wrapper .tool-btn:hover {
            color: var(--text-primary);
        }
        .input-wrapper .send-btn {
            background: var(--accent);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
        }
        .input-wrapper .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }
        .input-wrapper .send-btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .input-area .char-counter {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.3rem;
            padding-right: 0.5rem;
        }

        /* ────────────── Modal ────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1.5rem;
            animation: fade-in 0.2s ease;
        }
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            max-width: 720px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.75rem 1.5rem;
            box-shadow: var(--shadow-card);
            animation: slide-up 0.25s ease;
        }
        @keyframes slide-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .modal-content .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .modal-content .modal-header .close {
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            line-height: 1;
        }
        .modal-content .modal-header .close:hover {
            color: var(--text-primary);
        }
        .modal-content .modal-body {
            max-height: 60vh;
            overflow-y: auto;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 1rem;
            border: 1px solid var(--border-subtle);
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }
        .modal-content .modal-actions button {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.4rem 1.2rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }
        .modal-content .modal-actions button:hover {
            border-color: var(--accent);
        }
        .modal-content .modal-actions button.primary {
            background: var(--accent);
            border: none;
        }
        .modal-content .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }
        .modal-content .card-sm {
            background: var(--bg-primary);
            border-radius: var(--radius-md);
            padding: 1rem 1.1rem;
            border: 1px solid var(--border-subtle);
        }
        .modal-content .card-sm h4 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .modal-content .card-sm label {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.5rem;
        }
        .modal-content .card-sm input,
        .modal-content .card-sm textarea {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.5rem 1rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            margin-top: 0.2rem;
        }
        .modal-content .card-sm input:focus,
        .modal-content .card-sm textarea:focus {
            border-color: var(--accent);
        }
        .modal-content .card-sm textarea {
            border-radius: var(--radius-md);
            resize: vertical;
            min-height: 60px;
        }
        .modal-content .card-sm .btn-sm {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;

    </style>
</head>
<body>

    <!-- ─── APP ROOT ─── -->
    <div id="app-root" class="loading">⏳ Loading Vrythos Neural Core…</div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  BACKEND API HELPERS
        // ═══════════════════════════════════════════════════════════════
        async function apiGet(endpoint) {
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiPost(endpoint, data) {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error || 'Request failed');
            }
            return res.json();
        }
        async function apiPut(endpoint, data) {
            const res = await fetch(endpoint, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiDelete(endpoint) {
            const res = await fetch(endpoint, { method: 'DELETE' });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        // ─── GLOBALS ───
        let currentUser = null;
        let modules = [];
        let tournaments = [];
        let deepThink = false;
        let liveImageMode = false;
        let liveVideoMode = false;
        let bestCodingMode = false;          // NEW
        let messagesHistory = [];
        let attachedFiles = [];
        let isProcessing = false;
        const DEFAULT_VIDEO_DURATION = 5;
        const imgStore = {};
        let imgStoreCounter = 0;
        const videoStore = {};
        let videoStoreCounter = 0;
        let abuseScore = 0;
        let abuseWarningShown = false;
        let usedModuleIds = [];
        let messageIdCounter = 0;
        const messageContentStore = {};

        // ─── HELPERS ───
        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        async function hashPassword(pw) {
            const enc = new TextEncoder().encode(pw);
            const hash = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ─── ABUSE DETECTION ───
        async function addAbuseScore(points, reason, context) {
            if (!currentUser) return;
            abuseScore = Math.min(100, abuseScore + points);
            console.warn(`⚠️ Abuse +${points} → ${abuseScore}% (${reason})`);
            try {
                await apiPost('/api/pendingBans', {
                    email: currentUser.email,
                    username: currentUser.username,
                    score: abuseScore,
                    reason,
                    context: (context || '').slice(0, 200),
                    timestamp: Date.now(),
                    reviewed: false
                });
                await apiPost('/api/abuse', {
                    email: currentUser.email,
                    username: currentUser.username,
                    reason,
                    context: (context || '').slice(0, 100),
                    timestamp: Date.now()
                });
            } catch (_) { /* ignore */ }
            if ((abuseScore >= 10 && !abuseWarningShown) || points >= 5) {
                abuseWarningShown = true;
                addAIMessage(
                    `⚠️ Warning: suspicious activity detected (score ${abuseScore}%). Repeated violations may lead to a ban.`
                );
            }
        }

        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            addAbuseScore(5, 'Right-click attempt', 'User right-clicked');
            showToast('Right-click is prohibited', 'warning');
            return false;
        });

        function detectDevTools() {
            const t = 160;
            if (window.outerWidth - window.innerWidth > t || window.outerHeight - window.innerHeight > t) {
                addAbuseScore(10, 'Developer tools detected', 'DevTools opened');
                showToast('Developer tools detected', 'error');
            }
        }
        setInterval(detectDevTools, 2000);

        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                addAbuseScore(10, 'View source attempt', 'Tried to view page source');
                showToast('Viewing source is forbidden', 'error');
                return false;
            }
        });

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
                    background: ${type === 'error' ? '#7f1a1a' : type === 'warning' ? '#78350f' : '#1e293b'};
                    color: #fff; padding: 0.6rem 1.2rem; border-radius: 9999px;
                    font-size: 0.85rem; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
                    max-width: 90%; text-align: center; border: 1px solid rgba(255,255,255,0.06);
                    animation: slide-up 0.25s ease;
                `;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s'; }, 3000);
            setTimeout(() => toast.remove(), 3500);
        }

        // ─── DOWNLOAD / COPY GLOBALS ───
        window.downloadImage = function(id) {
            const url = imgStore[id];
            if (!url) return;
            const a = document.createElement('a');
            a.download = 'vrythos_image.png';
            a.href = url;
            a.click();
        };
        window.copyImageToClipboard = async function(id) {
            const url = imgStore[id];
            if (!url) return;
            try {
                const blob = await (await fetch(url)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                showToast('Image copied to clipboard!', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };
        window.downloadVideo = function(id) {
            const url = videoStore[id];
            if (!url) return;
            const a = document.createElement('a');
            a.download = 'vrythos_video.mp4';
            a.href = url;
            a.click();
        };
        window.copyVideoToClipboard = async function(id) {
            const url = videoStore[id];
            if (!url) return;
            try {
                const blob = await (await fetch(url)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                showToast('Video copied to clipboard!', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };

        // ─── DATA LOADERS ───
        async function loadAllData() {
            modules = await apiGet('/api/modules');
            tournaments = await apiGet('/api/tournaments');
            usedModuleIds = [];
        }
        async function loadUsers() { return await apiGet('/api/users'); }
        async function updateUser(email, updates) { return await apiPut(`/api/users/${email}`, updates); }
        async function deleteUser(email) { return await apiDelete(`/api/users/${email}`); }
        async function loadUserApiKeys(email) {
            const all = await apiGet('/api/userApiKeys');
            const entry = all.find(e => e.email === email);
            return entry ? entry.keys : [];
        }
        async function saveUserApiKeys(email, keys) {
            await apiPost('/api/userApiKeys', { email, keys });
        }
        async function getImageQuota(email) {
            const all = await apiGet('/api/imageQuotas');
            return all.find(q => q.email === email) || { email, count: 0, windowStart: Date.now() };
        }
        async function setImageQuota(q) { await apiPost('/api/imageQuotas', q); }
        async function addBugReport(bug) { return await apiPost('/api/bugs', bug); }
        async function joinTournament(id) { return await apiPost('/api/join-tournament', { email: currentUser.email,
                tournamentId: id }); }

        // ─── IMAGE GENERATION ───
        async function generateImageWithCloudflare(prompt) {
            try {
                const res = await fetch('/api/generate/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                if (data.success) return data.image;
            } catch (_) { /* fall through */ }
            return null;
        }
        async function generateImageWithPollinations(prompt) {
            try {
                const res = await fetch('/api/fallback/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                if (data.success) return data.image;
            } catch (_) { /* fall through */ }
            return null;
        }

        async function generateImageAndShow(prompt) {
            addAIMessage('🖌️ Generating image…', false);
            let imgData = await generateImageWithCloudflare(prompt);
            if (!imgData) imgData = await generateImageWithPollinations(prompt);
            if (imgData && imgData.startsWith('data:image')) {
                const id = 'img_' + (++imgStoreCounter);
                imgStore[id] = imgData;
                const html = `
                        <img src="${imgData}" style="max-width:100%; border-radius:12px;" />
                        <div class="btn-row">
                            <button onclick="downloadImage('${id}')">⬇️ Download</button>
                            <button onclick="copyImageToClipboard('${id}')">📋 Copy</button>
                        </div>
                    `;
                addAIMessage(html, true);
            } else {
                addAIMessage('❌ Image generation failed. Please try again.');
            }
        }

        // ─── VIDEO GENERATION ───
        async function generateVideo(prompt, duration) {
            addAIMessage('🎬 Generating video… (may take 30–60s)', false);
            try {
                const res = await apiPost('/api/generate/video', {
                    email: currentUser.email,
                    prompt,
                    duration: duration || DEFAULT_VIDEO_DURATION
                });
                if (res.success) {
                    const id = 'vid_' + (++videoStoreCounter);
                    videoStore[id] = res.video;
                    const html = `
                            <video controls autoplay loop style="max-width:100%; border-radius:12px; max-height:400px;">
                                <source src="${res.video}" type="video/mp4">
                                Your browser does not support video.
                            </video>
                            <div class="btn-row">
                                <button onclick="downloadVideo('${id}')">⬇️ Download</button>
                                <button onclick="copyVideoToClipboard('${id}')">📋 Copy</button>
                            </div>
                        `;
                    addAIMessage(html, true);
                } else {
                    addAIMessage('❌ Video failed: ' + (res.error || 'Unknown error'));
                }
            } catch (e) {
                addAIMessage('❌ Video error: ' + e.message);
            }
        }

        function isVideoRequest(text) {
            return /(video|animate|animation|make a video|create a video|generate a video|render|cinematic|short film|motion|sequence|clip|movie)/i
                .test(text);
        }
        function isImageRequest(text) {
            return /(make|create|generate|draw|paint|render).*(image|picture|photo|art|illustration).*of\s+(.+)|(image|picture|photo|art|illustration)\s+(of|with)\s+(.+)/i
                .test(text);
        }

        // ─── AI ENGINE CALL WITH RANDOM MODULE & FALLBACK ───
        async function callChatWithFallback(messages, deep) {
            let attempts = 0;
            let lastError = null;
            const maxAttempts = Math.min(modules.length, 3);
            const shuffled = [...modules].sort(() => Math.random() - 0.5);
            for (const mod of shuffled) {
                if (attempts >= maxAttempts) break;
                attempts++;
                try {
                    const reply = await callChatAPI(mod.id, messages, deep);
                    updateModuleStatus(mod.displayName);
                    return reply;
                } catch (err) {
                    lastError = err;
                    console.warn(`Module ${mod.displayName} failed: ${err.message}`);
                }
            }
            throw new Error(lastError || 'All AI engines unavailable');
        }

        async function callChatAPI(module_id, messages, deep) {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module_id, messages, deep_think: deep })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Chat API error');
            return data.reply;
        }

        function updateModuleStatus(name) {
            const el = document.getElementById('moduleStatus');
            if (el) el.textContent = `⚡ ${name}`;
        }

        // ─── CODE PROCESSING & DEBUGGING ───
        function processCodeInText(text) {
            const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
            let match;
            let lastIndex = 0;
            let parts = [];
            let hasCode = false;
            while ((match = codeBlockRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
                }
                const language = match[1] || 'txt';
                const code = match[2];
                parts.push({ type: 'code', language, code });
                hasCode = true;
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < text.length) {
                parts.push({ type: 'text', content: text.substring(lastIndex) });
            }
            if (!hasCode) return null;
            return parts;
        }

        let codeStore = {};

        function buildCodeHtml(parts) {
            let html = '';
            for (const part of parts) {
                if (part.type === 'text') {
                    html += escapeHtml(part.content).replace(/\n/g, '<br>');
                } else {
                    const codeId = 'code_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                    const lang = part.language || 'txt';
                    const code = part.code;
                    codeStore[codeId] = { language: lang, code: code };
                    html += `
                        <div class="code-block-wrapper" data-codeid="${codeId}">
                            <span class="code-lang">${escapeHtml(lang)}</span>
                            <pre><code class="language-${lang}">${escapeHtml(code)}</code></pre>
                            <div class="code-actions">
                                <button onclick="downloadCode('${codeId}')">📥 Download</button>
                                <button onclick="copyCode('${codeId}')">📋 Copy</button>
                                <button onclick="debugCode('${codeId}')">🔍 Debug</button>
                            </div>
                        </div>
                    `;
                }
            }
            return html;
        }

        window.downloadCode = function(id) {
            const data = codeStore[id];
            if (!data) return;
            const blob = new Blob([data.code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const extMap = {
                'html': 'html',
                'css': 'css',
                'js': 'js',
                'javascript': 'js',
                'python': 'py',
                'py': 'py',
                'java': 'java',
                'c': 'c',
                'cpp': 'cpp',
                'c++': 'cpp',
                'go': 'go',
                'rust': 'rs',
                'php': 'php',
                'ruby': 'rb',
                'rb': 'rb',
                'swift': 'swift',
                'ts': 'ts',
                'typescript': 'ts',
                'json': 'json',
                'xml': 'xml',
                'sh': 'sh',
                'bash': 'sh',
                'txt': 'txt'
            };
            const ext = extMap[data.language] || 'txt';
            a.download = `code.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.copyCode = async function(id) {
            const data = codeStore[id];
            if (!data) return;
            try {
                await navigator.clipboard.writeText(data.code);
                showToast('Code copied!', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };

        window.debugCode = async function(id) {
            const data = codeStore[id];
            if (!data) return;
            const code = data.code;
            const lang = data.language;
            const btn = document.querySelector(`.code-block-wrapper[data-codeid="${id}"] .code-actions button:last-child`);
            if (btn) btn.disabled = true;
            const originalText = btn ? btn.textContent : '🔍 Debug';
            if (btn) btn.textContent = '⏳ Debugging…';
            try {
                const debugPrompt =
                    `Please review the following ${lang} code for errors, bugs, or improvements. Provide the fixed version with explanations. Code:\n\`\`\`${lang}\n${code}\n\`\`\``;
                messagesHistory.push({ role: 'user', content: debugPrompt });
                const debugReply = await callChatWithFallback(messagesHistory.slice(-12), deepThink);
                addAIMessage(debugReply);
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            } catch (err) {
                showToast('Debug failed: ' + err.message, 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = originalText;
                }
            }
        };

        // ─── FULL OUTPUT MODAL ───
        function showFullOutput(content) {
            // Escape content for display as plain text
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal-content" style="max-width: 800px;">
                    <div class="modal-header">
                        <h3>📄 Full Output</h3>
                        <span class="close" id="fullOutputClose">&times;</span>
                    </div>
                    <div class="modal-body" id="fullOutputBody">${escapeHtml(content)}</div>
                    <div class="modal-actions">
                        <button class="primary" id="fullOutputCopyBtn">📋 Copy Full Text</button>
                        <button id="fullOutputCloseBtn">Close</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            const close = () => modal.remove();
            modal.querySelector('#fullOutputClose').onclick = close;
            modal.querySelector('#fullOutputCloseBtn').onclick = close;
            modal.querySelector('#fullOutputCopyBtn').onclick = async () => {
                try {
                    await navigator.clipboard.writeText(content);
                    showToast('Full output copied!', 'info');
                } catch (_) { showToast('Copy failed', 'error'); }
            };
            modal.addEventListener('click', e => { if (e.target === modal) close(); });
        }

        // ─── ADD AI MESSAGE ───
        function addAIMessage(content, isHtml = false) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message ai-message';

            let bubbleContent = '';
            let rawContent = content; // keep raw for modal

            if (isHtml) {
                bubbleContent = content;
            } else {
                // Process code blocks
                const parts = processCodeInText(content);
                if (parts) {
                    bubbleContent = buildCodeHtml(parts);
                } else {
                    bubbleContent = escapeHtml(content).replace(/\n/g, '<br>');
                }
            }

            // Generate a unique ID for this message
            const msgId = 'msg_' + (++messageIdCounter);
            messageContentStore[msgId] = rawContent;

            div.innerHTML = `
                <div class="avatar">⚡</div>
                <div class="bubble">
                    ${bubbleContent}
                    <div class="message-actions">
                        <button onclick="showFullOutput('${escapeHtml(rawContent)}')">📄 View Full</button>
                    </div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            // Store message ID for potential later use
            div.dataset.msgId = msgId;

            if (!isHtml && !content.startsWith('🖌️') && !content.startsWith('🎬')) {
                messagesHistory.push({ role: 'assistant', content: content });
            }
        }

        // ─── BEST CODING MODE (CHAIN 4 ENGINES) ───
        async function handleBestCoding(userText, attachedFilesText) {
            // Get up to 4 modules (use the order they appear in the list)
            let selected = modules.slice(0, 4);
            if (selected.length === 0) {
                addAIMessage('❌ No AI engines available. Please add at least one engine in the admin panel.');
                return;
            }

            // Build initial user message with attachments
            let initialContent = userText;
            if (attachedFilesText) {
                initialContent += '\n\n' + attachedFilesText;
            }

            // We'll store the latest reply
            let currentReply = null;
            let currentMessages = [{ role: 'user', content: initialContent }];

            // Show a progress indicator (we'll update the same typing element)
            const typing = showTyping();
            const typingBubble = typing.querySelector('.bubble');

            // Loop through each module
            for (let i = 0; i < selected.length; i++) {
                const mod = selected[i];
                const stepNum = i + 1;
                const total = selected.length;
                typingBubble.textContent = `🔄 Refining with ${mod.displayName} (${stepNum}/${total})…`;

                try {
                    // For the first step, use the original messages.
                    // For subsequent steps, we pass the previous output with a refinement instruction.
                    let messagesToSend;
                    if (i === 0) {
                        // First step: use the full conversation history (last 12 messages)
                        // to maintain context, but we also include the user's current query.
                        // We'll just use the currentMessages (which contains the user query)
                        messagesToSend = currentMessages;
                    } else {
                        // Construct a refinement prompt: include original user query and previous output.
                        const refinementPrompt =
                            `Original user request: "${userText}"\n\nPrevious output:\n${currentReply}\n\nPlease review, fix any bugs, improve the code, add more features, and make it more professional. Also fix any errors. Provide the final improved version.`;
                        messagesToSend = [{ role: 'user', content: refinementPrompt }];
                    }

                    // Call the API for this module
                    const reply = await callChatAPI(mod.id, messagesToSend, deepThink);
                    currentReply = reply;

                    // Update module status
                    updateModuleStatus(mod.displayName);

                } catch (err) {
                    // If a module fails, we can still continue with the previous reply
                    console.warn(`Module ${mod.displayName} failed: ${err.message}`);
                    // If we have no reply yet, we can't continue
                    if (currentReply === null) {
                        typing.remove();
                        addAIMessage(`❌ First engine (${mod.displayName}) failed: ${err.message}. No fallback available.`);
                        setProcessing(false);
                        return;
                    }
                    // Otherwise, we keep the previous reply and move to next module
                    // But we should inform the user
                    addAIMessage(`⚠️ Engine ${mod.displayName} failed, continuing with previous refinement.`);
                }
            }

            // Remove typing indicator
            typing.remove();

            // Display final output
            if (currentReply) {
                addAIMessage(currentReply);
                // Also update the chat history with the final answer (already done inside addAIMessage)
            } else {
                addAIMessage('❌ Best coding chain failed to produce any output.');
            }
        }

        // ─── MAIN SEND ───
        async function sendMessage(userText, forceImage = false, forceVideo = false) {
            if (!currentUser || currentUser.banned) { addAIMessage('🚫 Account banned.'); return; }
            if (isProcessing) { addAIMessage('⏳ Please wait for previous message.'); return; }
            setProcessing(true);
            try {
                const willVideo = forceVideo || (liveVideoMode && isVideoRequest(userText));
                const willImage = (forceImage || (liveImageMode && isImageRequest(userText))) && !willVideo;

                if (willVideo) {
                    let prompt = userText;
                    const m = userText.match(/.*(?:make|create|generate|render|animate)\s+(?:a\s+)?(video|animation|clip|short film|cinematic)\s+(?:of|with)\s+(.+)/i);
                    if (m && m[2]) prompt = m[2];
                    addUserMessage(`🎬 ${userText.substring(0,100)}`);
                    await generateVideo(prompt, DEFAULT_VIDEO_DURATION);
                    setProcessing(false);
                    return;
                }

                if (willImage) {
                    addUserMessage(`🎨 ${userText.substring(0,100)}`);
                    let prompt = userText;
                    const m = userText.match(/.*(?:make|create|generate|draw|paint|render)\s+(?:an?\s+)?(image|picture|photo|art|illustration)\s+(?:of|with)\s+(.+)/i);
                    if (m && m[2]) prompt = m[2];
                    await generateImageAndShow(prompt);
                    setProcessing(false);
                    return;
                }

                // ─── BEST CODING MODE CHECK ───
                if (bestCodingMode && modules.length > 0) {
                    // Prepare attached files text
                    let filesText = '';
                    if (attachedFiles.length) {
                        filesText = attachedFiles.map(f =>
                            f.isText ? `${f.name}:\n${f.content}` : `${f.name} (binary)`
                        ).join('\n');
                        attachedFiles = [];
                        renderFileBadges();
                    }

                    addUserMessage(userText);
                    await handleBestCoding(userText, filesText);
                    setProcessing(false);
                    return;
                }

                // ─── NORMAL CHAT ───
                let modifiedText = userText;
                const codeKeywords = ['code', 'html', 'css', 'javascript', 'python', 'java', 'c++', 'c#', 'php', 'ruby', 'go',
                    'rust', 'swift', 'typescript', 'js', 'py', 'cpp'
                ];
                if (codeKeywords.some(kw => userText.toLowerCase().includes(kw))) {
                    modifiedText +=
                        "\n\n(Please format any code you provide with triple backticks and language specifier, e.g., ```html ... ```)";
                }

                addUserMessage(userText);
                let fullMsg = modifiedText;
                if (attachedFiles.length) {
                    fullMsg += '\n\n[Attached files]\n' + attachedFiles.map(f =>
                        f.isText ? `${f.name}:\n${f.content}` : `${f.name} (binary)`
                    ).join('\n');
                    attachedFiles = [];
                    renderFileBadges();
                }

                const typing = showTyping();
                let reply = '';
                try {
                    reply = await callChatWithFallback(messagesHistory.slice(-12), deepThink);
                } catch (e) {
                    reply = `⚠️ All AI engines are currently unavailable. Please try again later. Error: ${e.message}`;
                } finally {
                    if (typing) typing.remove();
                }
                addAIMessage(reply);
            } finally {
                setProcessing(false);
            }
        }

            });

            document.getElementById('deepThinkToggle').onchange = e => deepThink = e.target.checked;
            document.getElementById('liveImageToggle').onchange = e => liveImageMode = e.target.checked;
            document.getElementById('liveVideoToggle').onchange = e => liveVideoMode = e.target.checked;
            document.getElementById('bestCodingToggle').onchange = e => bestCodingMode = e.target.checked;

            document.getElementById('attachBtn').onclick = () => document.getElementById('fileInput').click();
            document.getElementById('fileInput').onchange = e => {
                if (e.target.files) {
                    Array.from(e.target.files).forEach(f => {
                        const reader = new FileReader();
                        reader.onload = ev => {
                            attachedFiles.push({
                                name: f.name,
                                content: ev.target.result,
                                isText: f.type.startsWith('text/') || f.name.match(/\.(txt|json|md)$/i)
                            });
                            renderFileBadges();
                        };
                        if (f.type.startsWith('text/') || f.name.match(/\.(txt|json|md)$/i)) reader.readAsText(f);
                        else reader.readAsDataURL(f);
                    });
                }
            };

            document.getElementById('imageGenBtn').onclick = () => {
                const prompt = textarea.value.trim() || 'cyberpunk city';
                if (!isProcessing) sendMessage(prompt, true);
                textarea.value = '';
                textarea.style.height = 'auto';
                charCounter.textContent = '0 characters';
            };

            document.getElementById('videoGenBtn').onclick = () => {
                const prompt = textarea.value.trim() || 'A cinematic scene with vibrant colors';
                if (!isProcessing) sendMessage(prompt, false, true);
                textarea.value = '';
                textarea.style.height = 'auto';
                charCounter.textContent = '0 characters';
            };

            document.getElementById('userSettingsBtn').onclick = openUserSettings;

            // Hamburger
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            document.getElementById('hamburgerBtn').onclick = () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            };
            overlay.onclick = () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            };

            updateSidebarUser();
            await renderTournaments();
            startActivityTracking();

            // Close sidebar on resize to desktop
            window.addEventListener('resize', () => {
                if (window.innerWidth > 820) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('active');
                }
            });
        }

        // ─── GOOGLE OAUTH ───
        window.handleGoogleLogin = async (response) => {
            try {
                const res = await apiPost('/api/auth/google', { token: response.credential });
                if (res.success) {
                    currentUser = {
                        email: res.email,
                        username: res.username,
                        name: res.name,
                        profilePic: res.profilePic,
                        extraChatCredits: res.extraChatCredits || 0,
                        extraImageCredits: res.extraImageCredits || 0,
                        banned: res.banned || false,
                        totalHoursLive: res.totalHoursLive || 0
                    };
                    localStorage.setItem('vrythos_current_session', res.email);
                    await buildUI();
                } else {
                    document.getElementById('authMessage').textContent = res.error || 'Google login failed';
                }
            } catch (e) {
                const el = document.getElementById('authMessage');
                if (el) el.textContent = 'Google login error: ' + e.message;
            }
        };

        // ─── AUTH ───
        async function initAuth() {
            const saved = localStorage.getItem('vrythos_current_session');
            if (saved) {
                try {
                    const users = await loadUsers();
                    const dbUser = users.find(u => u.email === saved && !u.banned);
                    if (dbUser) {
                        currentUser = {
                            email: dbUser.email,
                            username: dbUser.username,
                            name: dbUser.name || '',
                            profilePic: dbUser.profilePic || '',
                            passwordHash: dbUser.passwordHash || null,
                            extraChatCredits: dbUser.extraChatCredits || 0,
                            extraImageCredits: dbUser.extraImageCredits || 0,
                            banned: dbUser.banned || false,
                            totalHoursLive: dbUser.totalHoursLive || 0,
                            authProvider: dbUser.authProvider || 'email'
                        };
                        await loadAllData();
                        await buildUI();
                        return;
                    }
                } catch (_) {
                    localStorage.removeItem('vrythos_current_session');
                }
            }

            // Show auth
            document.getElementById('app-root').innerHTML = `
                    <div class="auth-container">
                        <div class="auth-card">
                            <h2>⚡ VRYTHOS</h2>
                            <div class="subtitle">Neural · Secure · Creative</div>
                            <div id="loginForm">
                                <div id="g_id_onload"
                                    data-client_id="527067177247-mk8l2ratnkatefh8sogs4vedogmg9lk8.apps.googleusercontent.com"
                                    data-callback="handleGoogleLogin"
                                    data-auto_prompt="false">
                                </div>
                                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
                                <div class="divider">or</div>
                                <input type="email" id="loginEmail" placeholder="Email" autocomplete="off" />
                                <input type="password" id="loginPassword" placeholder="Password" />
                                <button id="doLoginBtn">Sign In</button>
                                <div class="auth-switch" id="showRegisterBtn">✨ Create new account</div>
                                <div class="auth-switch" style="color:var(--text-muted);font-size:0.75rem;" id="forgotPasswordBtn">🔐 Forgot password?</div>
                            </div>
                            <div id="registerForm" class="hidden">
                                <input type="text" id="regUsername" placeholder="Username" />
                                <input type="text" id="regName" placeholder="Full Name" />
                                <input type="email" id="regEmail" placeholder="Email" />
                                <input type="password" id="regPassword" placeholder="Password (min 4 chars)" />
                                <input type="password" id="regPasswordConfirm" placeholder="Confirm password" />
                                <button id="doRegisterBtn">Register</button>
                                <div class="auth-switch" id="showLoginBtn">← Back to login</div>
                            </div>
                            <div id="authMessage"></div>
                        </div>
                    </div>
                `;

            // Google init
            if (window.google && window.google.accounts) {
                window.google.accounts.id.initialize({
                    client_id: '527067177247-mk8l2ratnkatefh8sogs4vedogmg9lk8.apps.googleusercontent.com',
                    callback: window.handleGoogleLogin
                });
                window.google.accounts.id.renderButton(
                    document.querySelector('.g_id_signin'), { theme: 'filled_blue', size: 'large', shape: 'rectangular',
                        text: 'sign_in_with', logo_alignment: 'left' }
                );
            }

            document.getElementById('loginPassword').addEventListener('keypress', e => {
                if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
            });

            document.getElementById('doLoginBtn').onclick = async () => {
                const email = document.getElementById('loginEmail').value.trim();
                const pwd = document.getElementById('loginPassword').value;
                try {
                    const users = await loadUsers();
                    const user = users.find(u => u.email === email);
                    if (!user) {
                        document.getElementById('authMessage').innerHTML =
                            '❌ User not found. <a href="#" id="suggestRegister" style="color:var(--accent);">Create new account?</a>';
                        document.getElementById('suggestRegister')?.addEventListener('click', () => document
                            .getElementById('showRegisterBtn').click());
                        return;
                    }
                    if (!user.passwordHash) {
                        document.getElementById('authMessage').textContent =
                            'This account uses Google login. Please use Google Sign-In.';
                        return;
                    }
                    if (await hashPassword(pwd) !== user.passwordHash) {
                        document.getElementById('authMessage').textContent = 'Wrong password';
                        return;
                    }
                    if (user.banned) { document.getElementById('authMessage').textContent = 'Account banned.'; return; }
                    currentUser = {
                        email: user.email,
                        username: user.username,
                        name: user.name || '',
                        profilePic: user.profilePic || '',
                        passwordHash: user.passwordHash || null,
                        extraChatCredits: user.extraChatCredits || 0,
                        extraImageCredits: user.extraImageCredits || 0,
                        banned: user.banned || false,
                        totalHoursLive: user.totalHoursLive || 0,
                        authProvider: user.authProvider || 'email'
                    };
                    localStorage.setItem('vrythos_current_session', user.email);
                    await loadAllData();
                    await buildUI();
                } catch (e) {
                    document.getElementById('authMessage').textContent = 'Login error: ' + e.message;
                }
            };

            document.getElementById('showRegisterBtn').onclick = () => {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('authMessage').textContent = '';
            };
            document.getElementById('showLoginBtn').onclick = () => {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
            };
            document.getElementById('forgotPasswordBtn').onclick = () => {
                showToast('Password reset not available. Use Google login or contact admin.', 'warning');
            };

            document.getElementById('doRegisterBtn').onclick = async () => {
                const username = document.getElementById('regUsername').value.trim();
                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirm = document.getElementById('regPasswordConfirm').value;
                if (!username || !name || !email || password.length < 4 || password !== confirm) {
                    document.getElementById('authMessage').textContent =
                        'Please fill all fields correctly (password min 4 chars, match)';
                    return;
                }
                try {
                    const users = await loadUsers();
                    if (users.find(u => u.email === email)) {
                        document.getElementById('authMessage').textContent = 'Email already registered';
                        return;
                    }
                    if (users.find(u => u.username === username)) {
                        document.getElementById('authMessage').textContent = 'Username already taken';
                        return;
                    }
                    const passwordHash = await hashPassword(password);
                    await apiPost('/api/users', {
                        email,
                        username,
                        name,
                        passwordHash,
                        profilePic: '',
                        dailyCallsRecord: { date: '', count: 0 },
                        extraChatCredits: 0,
                        extraImageCredits: 0,
                        banned: false,
                        createdAt: Date.now(),
                        totalHoursLive: 0,
                        lastActive: Date.now(),
                        authProvider: 'email'
                    });
                    document.getElementById('authMessage').innerHTML = '✅ Account created! Please login.';
                    document.getElementById('registerForm').classList.add('hidden');
                    document.getElementById('loginForm').classList.remove('hidden');
                } catch (e) {
                    document.getElementById('authMessage').textContent = 'Registration error: ' + e.message;
                }
            };
        }

        // ─── BOOT ───
        (async function boot() {
            try {
                await loadAllData();
                await initAuth();
            } catch (err) {
                console.error('Boot error:', err);
                const root = document.getElementById('app-root');
                root.className = 'error';
                root.innerHTML = `
                        <h2>⚠️ Connection Error</h2>
                        <p>Could not connect to the Vrythos server. Make sure the backend is running and reachable.</p>
                        <p style="font-size:0.85rem;color:var(--text-muted);">${escapeHtml(err.message)}</p>
                        <button onclick="location.reload()">🔄 Retry</button>
                    `;
            }
        })();
    </script>
</body>
</html>
