<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Vrythos AI · Neural Core</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <style>
        /* ================================================================
           RESET & ROOT VARIABLES (Claude-inspired warm dark palette)
           ================================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #1a1917;
            --bg-secondary: #22211e;
            --bg-card: #2a2926;
            --bg-elevated: #34322e;
            --bg-hover: #3d3b36;
            --border-subtle: #3a3833;
            --border-strong: #4a4740;
            --text-primary: #f5f4ef;
            --text-secondary: #b8b5ad;
            --text-muted: #78766f;
            --accent: #a78bfa;
            --accent-hover: #8b5cf6;
            --accent-soft: rgba(167, 139, 250, 0.15);
            --accent-glow: rgba(167, 139, 250, 0.25);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-full: 9999px;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-serif: 'Fraunces', Georgia, serif;
            --transition: 0.15s ease;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: var(--radius-full);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* ================================================================
           AUTH / LOGIN SCREEN (Claude-inspired minimal premium)
           ================================================================ */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 1.5rem;
            background: var(--bg-primary);
            position: relative;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(167, 139, 250, 0.08), transparent 60%);
            pointer-events: none;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            animation: auth-fade 0.4s ease;
        }
        @keyframes auth-fade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-logo {
            font-family: var(--font-serif);
            font-size: 2.4rem;
            font-weight: 500;
            text-align: center;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .auth-logo::before {
            content: '◆';
            color: var(--accent);
            font-size: 1.6rem;
        }
        .auth-heading {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 500;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }
        .auth-subheading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .auth-form-group {
            margin-bottom: 0.75rem;
        }
        .auth-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            font-family: var(--font-sans);
            min-height: 48px;
        }
        .auth-input:focus {
            border-color: var(--accent);
            background: var(--bg-secondary);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .auth-input::placeholder {
            color: var(--text-muted);
        }
        .auth-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1917;
            cursor: pointer;
            transition: var(--transition);
            min-height: 48px;
            font-family: var(--font-sans);
            margin-top: 0.5rem;
        }
        .auth-btn:hover {
            background: var(--accent-hover);
            color: #f5f4ef;
        }
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.25rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }
        .auth-switch {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-switch:hover {
            color: var(--text-primary);
        }
        .auth-switch strong {
            color: var(--accent);
            font-weight: 500;
            margin-left: 0.25rem;
        }
        .auth-forgot {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 0.75rem;
            transition: var(--transition);
        }
        .auth-forgot:hover {
            color: var(--text-secondary);
        }
        .auth-footer {
            position: relative;
            z-index: 1;
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
        .auth-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 0.5rem;
            transition: var(--transition);
        }
        .auth-footer a:hover {
            color: var(--text-primary);
        }
        .hidden {
            display: none !important;
        }
        #authMessage {
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: center;
            color: var(--danger);
            min-height: 1.5rem;
        }
        #authMessage a {
            color: var(--accent);
        }
        .g_id_signin {
            display: flex;
            justify-content: center;
            min-height: 44px;
            margin-bottom: 0.5rem;
        }
        .g_id_signin > div {
            width: 100% !important;
            max-width: 100% !important;
        }

        /* ================================================================
           APP LAYOUT
           ================================================================ */
        .app {
            display: flex;
            height: 100dvh;
            width: 100%;
            background: var(--bg-primary);
            overflow: hidden;
        }

        /* ================================================================
           SIDEBAR (Claude-inspired clean)
           ================================================================ */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            padding: 1rem 0.75rem;
            gap: 0.5rem;
            overflow-y: auto;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            padding: 0.5rem 0.75rem 0.75rem;
        }
        .sidebar .logo::before {
            content: '◆';
            color: var(--accent);
            font-size: 1rem;
        }
        .sidebar .new-chat-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            padding: 0.7rem 1rem;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
            font-family: var(--font-sans);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar .new-chat-btn:hover {
            background: var(--bg-card);
            border-color: var(--border-strong);
        }
        .sidebar .section {
            padding: 0.5rem 0.75rem;
        }
        .sidebar .section-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.6rem;
            display: block;
        }
        .sidebar .module-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-full);
            text-align: center;
            border: 1px solid var(--border-subtle);
            display: inline-block;
        }
        .sidebar .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            min-height: 44px;
        }
        .sidebar .toggle-row:hover {
            color: var(--text-primary);
        }
        .sidebar .toggle-row input[type="checkbox"] {
            appearance: none;
            width: 32px;
            height: 18px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .sidebar .toggle-row input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: var(--transition);
        }
        .sidebar .toggle-row input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .sidebar .toggle-row input[type="checkbox"]:checked::after {
            left: 16px;
            background: var(--bg-primary);
        }
        .sidebar .footer-stats {
            margin-top: auto;
            padding: 0.75rem;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ================================================================
           MAIN CHAT
           ================================================================ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            min-width: 0;
            height: 100dvh;
        }
        .chat-header {
            padding: 0.85rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
            flex-shrink: 0;
            min-height: 60px;
        }
        .chat-header .ai-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .chat-header .ai-status::before {
            content: '◆';
            color: var(--accent);
            font-size: 0.85rem;
        }
        .chat-header .model-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.35rem 0.75rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
        }
        .chat-header .model-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }
        .chat-header .user-menu-btn {
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.45rem 0.9rem;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 40px;
            font-family: var(--font-sans);
        }
        .chat-header .user-menu-btn:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        /* ================================================================
           MESSAGES
           ================================================================ */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .message {
            display: flex;
            gap: 0.85rem;
            max-width: 85%;
            animation: msg-in 0.25s ease;
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.ai-message {
            align-self: flex-start;
        }
        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            flex-shrink: 0;
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }
        .message.ai-message .avatar {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent);
            font-family: var(--font-serif);
        }
        .message.user-message .avatar {
            background: var(--bg-elevated);
        }
        .message .bubble {
            padding: 0.85rem 1.15rem;
            border-radius: var(--radius-lg);
            line-height: 1.65;
            font-size: 0.94rem;
            word-break: break-word;
            position: relative;
            max-width: 100%;
            overflow: visible;
        }
        .message.user-message .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-bottom-right-radius: 6px;
        }
        .message.ai-message .bubble {
            background: transparent;
            color: var(--text-primary);
            padding-left: 0.4rem;
        }
        .message .bubble img,
        .message .bubble video {
            border-radius: var(--radius-md);
            max-width: 100%;
            height: auto;
        }
        .message .bubble .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.7rem;
        }
        .message .bubble .btn-row button {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.3rem 0.9rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            min-height: 34px;
            font-family: var(--font-sans);
        }
        .message .bubble .btn-row button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .message .bubble .code-block-wrapper {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 0.85rem;
            margin: 0.6rem 0;
            border: 1px solid var(--border-subtle);
            position: relative;
        }
        .message .bubble .code-block-wrapper .code-lang {
            font-size: 0.62rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
            letter-spacing: 0.06em;
            font-weight: 600;
        }
        .message .bubble .code-block-wrapper pre {
            margin: 0;
            overflow-x: auto;
        }
        .message .bubble .code-block-wrapper pre code {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.82rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
        }
        .message .bubble .code-block-wrapper .code-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }
        .message .bubble .code-block-wrapper .code-actions button {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0.25rem 0.75rem;
            font-size: 0.68rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            min-height: 32px;
            font-family: var(--font-sans);
        }
        .message .bubble .code-block-wrapper .code-actions button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        .msg-actions-bar {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.5rem;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .message:hover .msg-actions-bar {
            opacity: 1;
        }
        .msg-actions-bar button {
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-muted);
            padding: 0.2rem 0.6rem;
            font-size: 0.66rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 26px;
            font-family: var(--font-sans);
        }
        .msg-actions-bar button:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        /* ===== Typing animation cursor ===== */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1.05em;
            background: var(--accent);
            margin-left: 3px;
            vertical-align: text-bottom;
            border-radius: 1px;
            animation: cursor-blink 0.9s steps(1) infinite;
        }
        @keyframes cursor-blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* ================================================================
           WELCOME SCREEN
           ================================================================ */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2rem 1rem;
            text-align: center;
            gap: 1.5rem;
            animation: fade-in 0.4s ease;
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .welcome-screen .welcome-logo {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .welcome-screen .welcome-logo::before {
            content: '◆';
            color: var(--accent);
            font-size: 1.6rem;
        }
        .welcome-screen p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.75rem;
            max-width: 720px;
            width: 100%;
            margin-top: 1.5rem;
        }
        .suggestion-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1rem 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .suggestion-card:hover {
            border-color: var(--accent);
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .suggestion-card strong {
            display: block;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        /* ================================================================
           INPUT AREA
           ================================================================ */
        .input-area {
            padding: 0.75rem 1.5rem calc(1rem + var(--safe-bottom));
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-primary);
            flex-shrink: 0;
            position: relative;
        }
        .input-area .file-badge {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .input-area .file-badge .file-tag {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 0.25rem 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-height: 32px;
            color: var(--text-secondary);
        }
        .input-area .file-badge .file-tag button {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem;
            min-height: 24px;
        }
        .active-tools {
            display: none;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }
        .active-tool-pill {
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            border-radius: var(--radius-full);
            padding: 0.25rem 0.75rem;
            font-size: 0.72rem;
            color: var(--accent);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .input-wrapper {
            display: flex;
            align-items: flex-end;

<body>

    <div id="app-root" class="loading">Loading Vrythos…</div>

    <script>
        /* ================================================================
           API HELPERS
           ================================================================ */
        async function apiGet(endpoint) {
            const res = await fetch(endpoint);
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiPost(endpoint, data) {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || 'Request failed');
            }
            return res.json();
        }
        async function apiPut(endpoint, data) {
            const res = await fetch(endpoint, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }
        async function apiDelete(endpoint) {
            const res = await fetch(endpoint, { method: 'DELETE' });
            if (!res.ok) throw new Error(await res.text());
            return res.json();
        }

        /* ================================================================
           GLOBAL STATE
           ================================================================ */
        let currentUser = null;
        let modules = [];
        let tournaments = [];
        let deepThink = false;
        let liveImageMode = false;
        let liveVideoMode = false;
        let bestCodingMode = false;
        let messagesHistory = [];
        let attachedFiles = [];
        let isProcessing = false;
        const DEFAULT_VIDEO_DURATION = 5;
        const imgStore = {};
        let imgStoreCounter = 0;
        const videoStore = {};
        let videoStoreCounter = 0;
        let abuseScore = 0;
        let abuseWarningShown = false;
        let usedModuleIds = [];
        let messageIdCounter = 0;
        const messageContentStore = {};

        /* ================================================================
           UTILITIES
           ================================================================ */
        function escapeHtml(str) {
            return String(str).replace(/[&<>"]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        async function hashPassword(pw) {
            const enc = new TextEncoder().encode(pw);
            const hash = await crypto.subtle.digest('SHA-256', enc);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            const bg = type === 'error' ? '#7f1a1a' : type === 'warning' ? '#78350f' : '#2a2926';
            toast.style.cssText = `position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: ${bg}; color: #f5f4ef; padding: 0.65rem 1.25rem; border-radius: 9999px; font-size: 0.82rem; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-width: 90%; text-align: center; border: 1px solid #3a3833; animation: slide-up 0.25s ease; min-height: 44px; display: flex; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif;`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; }, 2800);
            setTimeout(() => toast.remove(), 3200);
        }

        /* ================================================================
           ABUSE DETECTION
           ================================================================ */
        async function addAbuseScore(points, reason, context) {
            if (!currentUser) return;
            abuseScore = Math.min(100, abuseScore + points);
            try {
                await apiPost('/api/pendingBans', {
                    email: currentUser.email, username: currentUser.username, score: abuseScore, reason,
                    context: (context || '').slice(0, 200), timestamp: Date.now(), reviewed: false
                });
                await apiPost('/api/abuse', {
                    email: currentUser.email, username: currentUser.username, reason,
                    context: (context || '').slice(0, 100), timestamp: Date.now()
                });
            } catch (_) {}
            if ((abuseScore >= 10 && !abuseWarningShown) || points >= 5) {
                abuseWarningShown = true;
                addAIMessage(`Warning: suspicious activity detected (score ${abuseScore}%). Repeated violations may lead to a ban.`);
            }
        }
        document.addEventListener('contextmenu', e => {
            e.preventDefault();
            addAbuseScore(5, 'Right-click attempt', 'User right-clicked');
            showToast('Right-click is prohibited', 'warning');
            return false;
        });
        function detectDevTools() {
            const t = 160;
            if (window.outerWidth - window.innerWidth > t || window.outerHeight - window.innerHeight > t) {
                addAbuseScore(10, 'Developer tools detected', 'DevTools opened');
                showToast('Developer tools detected', 'error');
            }
        }
        setInterval(detectDevTools, 2000);
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                addAbuseScore(10, 'View source attempt', 'Tried to view page source');
                showToast('Viewing source is forbidden', 'error');
                return false;
            }
        });

        /* ================================================================
           DOWNLOAD / COPY GLOBALS
           ================================================================ */
        window.downloadImage = function(id) {
            const url = imgStore[id];
            if (!url) return;
            const a = document.createElement('a');
            a.download = 'vrythos_image.png';
            a.href = url;
            a.click();
        };
        window.copyImageToClipboard = async function(id) {
            const url = imgStore[id];
            if (!url) return;
            try {
                const blob = await (await fetch(url)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                showToast('Image copied', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };
        window.downloadVideo = function(id) {
            const url = videoStore[id];
            if (!url) return;
            const a = document.createElement('a');
            a.download = 'vrythos_video.mp4';
            a.href = url;
            a.click();
        };
        window.copyVideoToClipboard = async function(id) {
            const url = videoStore[id];
            if (!url) return;
            try {
                const blob = await (await fetch(url)).blob();
                await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
                showToast('Video copied', 'info');
            } catch (_) { showToast('Copy failed', 'error'); }
        };

        /* ================================================================
           DATA LOADERS
           ================================================================ */
        async function loadAllData() {
            modules = await apiGet('/api/modules');
            tournaments = await apiGet('/api/tournaments');
            usedModuleIds = [];
        }

        async function updateUser(email, updates) { return await apiPut(`/api/users/${email}`, updates); }

        /* ================================================================
           AI CALL WITH FALLBACK
           ================================================================ */
        async function callChatWithFallback(messages, deep) {
            let attempts = 0;
            let lastError = null;
            const maxAttempts = Math.min(modules.length, 3);
            const shuffled = [...modules].sort(() => Math.random() - 0.5);
            for (const mod of shuffled) {
                if (attempts >= maxAttempts) break;
                attempts++;
                try {
                    const reply = await callChatAPI(mod.id, messages, deep);
                    updateModuleStatus(mod.displayName);
                    return reply;
                } catch (err) {
                    lastError = err;
                    console.warn(`Module ${mod.displayName} failed: ${err.message}`);
                }
            }
            throw new Error(lastError ? lastError.message : 'All AI engines unavailable');
        }

        async function callChatAPI(module_id, messages, deep) {
            const res = await fetch('/api/chat', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module_id, messages, deep_think: deep })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Chat API error');
            return data.reply;
        }

        /* ================================================================
           CODE PROCESSING
           ================================================================ */
        function processCodeInText(text) {
            const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
            let match;
            let lastIndex = 0;
            let parts = [];
            let hasCode = false;
            while ((match = codeBlockRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
                }
                parts.push({ type: 'code', language: match[1] || 'txt', code: match[2] });
                hasCode = true;
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < text.length) parts.push({ type: 'text', content: text.substring(lastIndex) });
            if (!hasCode) return null;
            return parts;
        }

        let codeStore = {};

        function buildCodeHtml(parts) {
            let html = '';
            for (const part of parts) {
                if (part.type === 'text') {
                    html += escapeHtml(part.content).replace(/\n/g, '<br>');
                } else {
                    const codeId = 'code_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                    const lang = part.language || 'txt';
                    const code = part.code;
                    codeStore[codeId] = { language: lang, code: code };
                    html += `<div class="code-block-wrapper" data-codeid="${codeId}"><span class="code-lang">${escapeHtml(lang)}</span><pre><code class="language-${lang}">${escapeHtml(code)}</code></pre><div class="code-actions"><button onclick="downloadCode('${codeId}')">Download</button><button onclick="copyCode('${codeId}')">Copy</button><button onclick="debugCode('${codeId}')">Debug</button></div></div>`;
                }
            }
            return html;
        }

        window.downloadCode = function(id) {
            const data = codeStore[id];
            if (!data) return;
            const blob = new Blob([data.code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const extMap = { html: 'html', css: 'css', js: 'js', javascript: 'js', python: 'py', py: 'py', java: 'java', c: 'c', cpp: 'cpp', 'c++': 'cpp', go: 'go', rust: 'rs', php: 'php', ruby: 'rb', rb: 'rb', swift: 'swift', ts: 'ts', typescript: 'ts', json: 'json', xml: 'xml', sh: 'sh', bash: 'sh', txt: 'txt' };
            a.download = `code.${extMap[data.language] || 'txt'}`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.copyCode = async function(id) {

        /* ================================================================
           TYPING HELPER — reveals text word-by-word at 7 words/second
           ================================================================ */
        const MS_PER_WORD = 1000 / 7;   // ~142.86 ms → 7 words/second

        async function typeInto(text, targetEl, isAborted) {
            const tokens = text.split(/(\s+)/);
            let buffer = '';

            for (let i = 0; i < tokens.length; i++) {
                const token = tokens[i];

                if (isAborted && isAborted()) {
                    for (let j = i; j < tokens.length; j++) buffer += tokens[j];
                    targetEl.innerHTML = escapeHtml(buffer).replace(/\n/g, '<br>');
                    const c = document.getElementById('messagesContainer');
                    if (c) c.scrollTop = c.scrollHeight;
                    return;
                }

                buffer += token;
                targetEl.innerHTML = escapeHtml(buffer).replace(/\n/g, '<br>');
                const c = document.getElementById('messagesContainer');
                if (c) c.scrollTop = c.scrollHeight;

                if (token.trim()) {
                    await new Promise(r => setTimeout(r, MS_PER_WORD));
                } else if (token.includes('\n')) {
                    await new Promise(r => setTimeout(r, 25));
                }
            }
        }

        /* ================================================================
           AI MESSAGE — STREAMING version (typing animation)
           ================================================================ */
        let currentTypingAbort = null;

        async function streamAIMessage(content) {
            if (currentTypingAbort) {
                currentTypingAbort();
                currentTypingAbort = null;
            }

            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.className = 'message ai-message';
            const msgId = 'msg_' + (++messageIdCounter);
            messageContentStore[msgId] = content;

            const parts = processCodeInText(content);

            div.innerHTML = `<div class="avatar">◆</div><div class="bubble"><span class="typing-content"></span><span class="typing-cursor"></span><div class="msg-actions-bar" style="display:none;"><button data-copy="${msgId}">Copy</button><button data-regen="${msgId}">Regenerate</button><button data-full="${msgId}">Full</button></div></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            messagesHistory.push({ role: 'assistant', content: content });

            div.querySelector(`[data-copy="${msgId}"]`).onclick = async () => {
                try { await navigator.clipboard.writeText(messageContentStore[msgId] || ''); showToast('Copied', 'info'); }
                catch (_) { showToast('Copy failed', 'error'); }
            };
            div.querySelector(`[data-regen="${msgId}"]`).onclick = async () => {
                if (isProcessing || !currentUser) return;
                const lastUser = [...messagesHistory].reverse().find(m => m.role === 'user');
                if (!lastUser) return;
                showToast('Regenerating…', 'info');
                setProcessing(true);
                try {
                    const reply = await callChatWithFallback(messagesHistory.slice(-12), deepThink);
                    addAIMessage(reply, false, true);
                } catch (e) {
                    addAIMessage('Regenerate failed: ' + e.message, false, false);
                } finally {
                    setProcessing(false);
                }
            };
            div.querySelector(`[data-full="${msgId}"]`).onclick = () => showFullOutput(messageContentStore[msgId] || '');

            const typingContent = div.querySelector('.typing-content');
            const cursorEl = div.querySelector('.typing-cursor');
            let aborted = false;
            currentTypingAbort = () => { aborted = true; };
            const isAborted = () => aborted;

            try {
                if (parts) {
                    for (let i = 0; i < parts.length; i++) {
                        const part = parts[i];
                        if (part.type === 'text') {
                            await typeInto(part.content, typingContent, isAborted);
                        } else {
                            typingContent.innerHTML += buildCodeHtml([part]);
                            container.scrollTop = container.scrollHeight;
                            await new Promise(r => setTimeout(r, 60));
                        }
                        if (aborted) {
                            for (let j = i + 1; j < parts.length; j++) {
                                const p = parts[j];
                                if (p.type === 'text') typingContent.innerHTML += escapeHtml(p.content).replace(/\n/g, '<br>');
                                else typingContent.innerHTML += buildCodeHtml([p]);
                            }
                            container.scrollTop = container.scrollHeight;
                            break;
                        }
                    }
                } else {
                    await typeInto(content, typingContent, isAborted);
                }
            } finally {
                if (cursorEl.parentNode) cursorEl.remove();
                div.querySelector('.msg-actions-bar').style.display = 'flex';
                container.scrollTop = container.scrollHeight;
                if (!aborted) currentTypingAbort = null;
            }
        }

            } else {

        /* ================================================================
           BEST CODING MODE
           ================================================================ */
        async function handleBestCoding(userText, attachedFilesText) {
            const availableModules = [...modules];
            if (availableModules.length === 0) {
                addAIMessage('No AI engines available. Please add at least one engine in the admin panel.', false, false);
                return;
            }

            let initialContent = userText;
            if (attachedFilesText) initialContent += '\n\n' + attachedFilesText;

            let currentReply = null;
            let usedModuleIds = [];
            let step = 0;
            const maxSteps = Math.min(4, availableModules.length);
            let attempts = 0;
            const maxAttempts = availableModules.length * 2;

            const typing = showTyping();
            const typingBubble = typing.querySelector('.bubble');

            while (step < maxSteps && attempts < maxAttempts) {
                attempts++;
                let moduleFoundForStep = false;
                for (let i = 0; i < availableModules.length; i++) {
                    const mod = availableModules[i];
                    if (usedModuleIds.includes(mod.id)) continue;
                    typingBubble.textContent = `Step ${step+1}/${maxSteps} with ${mod.displayName}…`;
                    try {
                        let reply;
                        if (step === 0) {
                            reply = await callChatAPI(mod.id, [{ role: 'user', content: initialContent }], deepThink);
                        } else {
                            const refinementPrompt = `Original user request: "${userText}"\n\nPrevious output:\n${currentReply}\n\nPlease review, fix any bugs, improve the code, add more features, and make it more professional. Also fix any errors. Provide the final improved version.`;
                            reply = await callChatAPI(mod.id, [{ role: 'user', content: refinementPrompt }], deepThink);
                        }
                        currentReply = reply;
                        usedModuleIds.push(mod.id);
                        step++;
                        moduleFoundForStep = true;
                        updateModuleStatus(mod.displayName);
                        break;
                    } catch (err) {
                        usedModuleIds.push(mod.id);
                    }
                }
                if (!moduleFoundForStep) break;
            }

            typing.remove();
            if (currentReply) addAIMessage(currentReply, false, true);
            else addAIMessage('Best coding chain failed to produce any output.', false, false);
        }

        /* ================================================================
           SEND MESSAGE
           ================================================================ */
        async function sendMessage(userText, forceImage = false, forceVideo = false) {
            if (!currentUser || currentUser.banned) { addAIMessage('Account banned.', false, false); return; }
            if (isProcessing) { addAIMessage('Please wait for previous message.', false, false); return; }
            setProcessing(true);
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();
            try {
                const willVideo = forceVideo || (liveVideoMode && isVideoRequest(userText));
                const willImage = (forceImage || (liveImageMode && isImageRequest(userText))) && !willVideo;

                if (willVideo) {
                    let prompt = userText;
                    const m = userText.match(/.*(?:make|create|generate|render|animate)\s+(?:a\s+)?(video|animation|clip|short film|cinematic)\s+(?:of|with)\s+(.+)/i);
                    if (m && m[2]) prompt = m[2];
                    addUserMessage(userText);
                    await generateVideo(prompt, DEFAULT_VIDEO_DURATION);
                    setProcessing(false);
                    return;
                }

                if (willImage) {
                    addUserMessage(userText);
                    let prompt = userText;
                    const m = userText.match(/.*(?:make|create|generate|draw|paint|render)\s+(?:an?\s+)?(image|picture|photo|art|illustration)\s+(?:of|with)\s+(.+)/i);
                    if (m && m[2]) prompt = m[2];
                    await generateImageAndShow(prompt);
                    setProcessing(false);
                    return;
                }

                if (bestCodingMode && modules.length > 0) {
                    let filesText = '';
                    if (attachedFiles.length) {
                        filesText = attachedFiles.map(f => f.isText ? `${f.name}:\n${f.content}` : `${f.name} (binary)`).join('\n');
                        attachedFiles = [];
                        renderFileBadges();
                    }
                    addUserMessage(userText);
                    await handleBestCoding(userText, filesText);
                    setProcessing(false);
                    return;
                }

                let modifiedText = userText;
                const codeKeywords = ['code','html','css','javascript','python','java','c++','c#','php','ruby','go','rust','swift','typescript','js','py','cpp'];
                if (codeKeywords.some(kw => userText.toLowerCase().includes(kw))) {
                    modifiedText += "\n\n(Please format any code you provide with triple backticks and language specifier, e.g., ```html ... ```)";
                }

                addUserMessage(userText);
                let fullMsg = modifiedText;
                if (attachedFiles.length) {
                    fullMsg += '\n\n[Attached files]\n' + attachedFiles.map(f => f.isText ? `${f.name}:\n${f.content}` : `${f.name} (binary)`).join('\n');
                    attachedFiles = [];
                    renderFileBadges();
                }

                const typing = showTyping();
                let reply = '';
                try {
                    reply = await callChatWithFallback(messagesHistory.slice(-12), deepThink);
                } catch (e) {
                    reply = `All AI engines are currently unavailable. Please try again later. Error: ${e.message}`;
                } finally {
                    if (typing) typing.remove();
                }
                addAIMessage(reply, false, true);
            } finally {
                setProcessing(false);
            }
        }

        /* ================================================================
           FILE BADGES
           ================================================================ */
        function renderFileBadges() {

                        <div id="registerForm" class="hidden">
                            <div class="auth-form-group">
                                <input type="text" class="auth-input" id="regUsername" placeholder="Username" />
                            </div>
                            <div class="auth-form-group">
                                <input type="text" class="auth-input" id="regName" placeholder="Full name" />
                            </div>
                            <div class="auth-form-group">
                                <input type="email" class="auth-input" id="regEmail" placeholder="Email address" />
                            </div>
                            <div class="auth-form-group">
                                <input type="password" class="auth-input" id="regPassword" placeholder="Password (min 4 characters)" />
                            </div>
                            <div class="auth-form-group">
                                <input type="password" class="auth-input" id="regPasswordConfirm" placeholder="Confirm password" />
                            </div>
                            <button class="auth-btn" id="doRegisterBtn">Create account</button>
                            <div class="auth-switch" id="showLoginBtn">← Back to sign in</div>
                        </div>

                        <div id="authMessage"></div>
                    </div>
                    <div class="auth-footer">
                        <a href="#">Terms</a>·<a href="#">Privacy</a>·<a href="#">Help</a>
                        <div style="margin-top:0.5rem;">© Vrythos AI</div>
                    </div>
                </div>
            `;

            if (window.google && window.google.accounts) {
                window.google.accounts.id.initialize({
                    client_id: '527067177247-mk8l2ratnkatefh8sogs4vedogmg9lk8.apps.googleusercontent.com',
                    callback: window.handleGoogleLogin
                });
                window.google.accounts.id.renderButton(
                    document.querySelector('.g_id_signin'),
                    { theme: 'filled_black', size: 'large', shape: 'rectangular', text: 'sign_in_with', logo_alignment: 'center' }
                );
            }

            document.getElementById('loginPassword').addEventListener('keypress', e => {
                if (e.key === 'Enter') document.getElementById('doLoginBtn').click();
            });

            document.getElementById('doLoginBtn').onclick = async () => {
                const email = document.getElementById('loginEmail').value.trim();
                const pwd = document.getElementById('loginPassword').value;
                const msgEl = document.getElementById('authMessage');
                msgEl.textContent = '';
                try {
                    const users = await loadUsers();
                    const user = users.find(u => u.email === email);
                    if (!user) {
                        msgEl.innerHTML = 'User not found. <a href="#" id="suggestRegister">Create new account?</a>';
                        document.getElementById('suggestRegister')?.addEventListener('click', () => document.getElementById('showRegisterBtn').click());
                        return;
                    }
                    if (!user.passwordHash) {
                        msgEl.textContent = 'This account uses Google login. Please use Google Sign-In.';
                        return;
                    }
                    if (await hashPassword(pwd) !== user.passwordHash) {
                        msgEl.textContent = 'Incorrect password';
                        return;
                    }
                    if (user.banned) { msgEl.textContent = 'Account banned.'; return; }
                    currentUser = {
                        email: user.email, username: user.username, name: user.name || '',
                        profilePic: user.profilePic || '', passwordHash: user.passwordHash || null,
                        extraChatCredits: user.extraChatCredits || 0, extraImageCredits: user.extraImageCredits || 0,
                        banned: user.banned || false, totalHoursLive: user.totalHoursLive || 0,
                        authProvider: user.authProvider || 'email'
                    };
                    localStorage.setItem('vrythos_current_session', user.email);
                    await loadAllData();
                    await buildUI();
                } catch (e) {
                    msgEl.textContent = 'Login error: ' + e.message;
                }
            };

            document.getElementById('showRegisterBtn').onclick = () => {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('authHeading').textContent = 'Create your account';
                document.getElementById('authSubheading').textContent = 'Start using Vrythos AI in seconds';
                document.getElementById('authMessage').textContent = '';
            };
            document.getElementById('showLoginBtn').onclick = () => {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authHeading').textContent = 'Welcome back';
                document.getElementById('authSubheading').textContent = 'Sign in to continue to your AI assistant';
                document.getElementById('authMessage').textContent = '';
            };
            document.getElementById('forgotPasswordBtn').onclick = () => {
                showToast('Password reset not available. Use Google login or contact admin.', 'warning');
            };

            document.getElementById('doRegisterBtn').onclick = async () => {
                const username = document.getElementById('regUsername').value.trim();
                const name = document.getElementById('regName').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirm = document.getElementById('regPasswordConfirm').value;
                const msgEl = document.getElementById('authMessage');
                if (!username || !name || !email || password.length < 4 || password !== confirm) {
                    msgEl.textContent = 'Please fill all fields correctly (password min 4 characters, must match)';
                    return;
                }
                try {
                    const users = await loadUsers();
                    if (users.find(u => u.email === email)) {
                        msgEl.textContent = 'Email already registered';
                        return;
                    }
                    if (users.find(u => u.username === username)) {
                        msgEl.textContent = 'Username already taken';
                        return;
                    }
                    const passwordHash = await hashPassword(password);
                    await apiPost('/api/users', {
                        email, username, name, passwordHash, profilePic: '',
                        dailyCallsRecord: { date: '', count: 0 }, extraChatCredits: 0, extraImageCredits: 0,
                        banned: false, createdAt: Date.now(), totalHoursLive: 0, lastActive: Date.now(),
                        authProvider: 'email'
                    });
                    msgEl.style.color = 'var(--success)';
                    msgEl.innerHTML = 'Account created. Please sign in.';
                    document.getElementById('registerForm').classList.add('hidden');
                    document.getElementById('loginForm').classList.remove('hidden');
                    document.getElementById('authHeading').textContent = 'Welcome back';
                    document.getElementById('authSubheading').textContent = 'Sign in to continue to your AI assistant';
                } catch (e) {
                    msgEl.style.color = 'var(--danger)';
                    msgEl.textContent = 'Registration error: ' + e.message;
                }
            };
        }

        /* ================================================================
           BOOT
           ================================================================ */
        (async function boot() {
            try {
                await loadAllData();
                await initAuth();
            } catch (err) {
                console.error('Boot error:', err);
                const root = document.getElementById('app-root');
                root.className = 'error';
                root.innerHTML = `<h2>Connection Error</h2><p>Could not connect to the Vrythos server. Make sure the backend is running and reachable.</p><p style="font-size:0.85rem;color:var(--text-muted);">${escapeHtml(err.message)}</p><button onclick="location.reload()">Retry</button>`;
            }
        })();
    </script>
</body>
</html>
