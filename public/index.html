<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg-primary:#1a1917;--bg-secondary:#22211e;--bg-card:#2a2926;--bg-elevated:#34322e;--bg-hover:#3d3b36;--border-subtle:#3a3833;--border-strong:#4a4740;--text-primary:#f5f4ef;--text-secondary:#b8b5ad;--text-muted:#78766f;--accent:#a78bfa;--accent-hover:#8b5cf6;--accent-soft:rgba(167,139,250,0.15);--danger:#ef4444;--success:#10b981;--shadow-card:0 8px 32px rgba(0,0,0,0.4);--radius-lg:20px;--radius-md:12px;--radius-sm:8px;--radius-full:9999px;--font-sans:'Inter',system-ui,-apple-system,sans-serif;--font-serif:'Fraunces',Georgia,serif;--transition:0.15s ease;--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;font-family:var(--font-sans);background:var(--bg-primary);color:var(--text-primary);overflow:hidden;font-size:16px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:var(--radius-full)}::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
.auth-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:1.5rem;background:var(--bg-primary);position:relative}
.auth-card{width:100%;max-width:400px;position:relative;z-index:1}
.auth-logo{font-family:var(--font-serif);font-size:2.2rem;font-weight:500;text-align:center;letter-spacing:-.02em;color:var(--text-primary);margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.auth-logo::before{content:'◆';color:var(--accent);font-size:1.4rem}
.auth-heading{font-family:var(--font-serif);font-size:1.4rem;font-weight:500;text-align:center;color:var(--text-primary);margin-bottom:.4rem;letter-spacing:-.01em}
.auth-subheading{text-align:center;color:var(--text-secondary);font-size:.85rem;margin-bottom:1.5rem}
.auth-form-group{margin-bottom:.75rem}
.auth-input{width:100%;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.85rem 1rem;font-size:.95rem;color:var(--text-primary);outline:none;transition:var(--transition);font-family:var(--font-sans);min-height:48px}
.auth-input:focus{border-color:var(--accent);background:var(--bg-secondary);box-shadow:0 0 0 3px var(--accent-soft)}
.auth-input::placeholder{color:var(--text-muted)}
.auth-btn{width:100%;background:var(--accent);border:none;border-radius:var(--radius-md);padding:.9rem 1rem;font-weight:600;font-size:.95rem;color:#1a1917;cursor:pointer;transition:var(--transition);min-height:48px;font-family:var(--font-sans);margin-top:.5rem}
.auth-btn:hover{background:var(--accent-hover);color:#f5f4ef}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-divider{display:flex;align-items:center;gap:1rem;margin:1rem 0;color:var(--text-muted);font-size:.75rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border-subtle)}
.auth-switch{text-align:center;margin-top:1rem;font-size:.85rem;color:var(--text-secondary);cursor:pointer;transition:var(--transition);min-height:44px;display:flex;align-items:center;justify-content:center}
.auth-switch:hover{color:var(--text-primary)}
.auth-switch strong{color:var(--accent);font-weight:500;margin-left:.25rem}
.hidden{display:none!important}
#authMessage{margin-top:.75rem;font-size:.82rem;text-align:center;color:var(--danger);min-height:1.25rem}
#authMessage a{color:var(--accent)}
.g_id_signin{display:flex;justify-content:center;min-height:44px;margin-bottom:.5rem}
.g_id_signin>div{width:100%!important;max-width:100%!important}
.recaptcha-wrap{display:flex;justify-content:center;margin:.75rem 0;transform:scale(.9);transform-origin:center}
.app{display:flex;height:100dvh;width:100%;background:var(--bg-primary);overflow:hidden}
.sidebar{width:260px;min-width:260px;background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:1rem .75rem;gap:.5rem;overflow-y:auto;flex-shrink:0;transition:transform .3s ease;z-index:100}
.sidebar .logo{display:flex;align-items:center;gap:.5rem;font-family:var(--font-serif);font-size:1.4rem;font-weight:500;letter-spacing:-.02em;color:var(--text-primary);padding:.5rem .75rem .75rem}
.sidebar .logo::before{content:'◆';color:var(--accent);font-size:1rem}
.sidebar .new-chat-btn{background:transparent;border:1px solid var(--border-subtle);padding:.7rem 1rem;border-radius:var(--radius-md);color:var(--text-primary);font-weight:500;font-size:.88rem;cursor:pointer;transition:var(--transition);min-height:44px;font-family:var(--font-sans);text-align:left;display:flex;align-items:center;gap:.5rem}
.sidebar .new-chat-btn:hover{background:var(--bg-card);border-color:var(--border-strong)}
.sidebar .section{padding:.5rem .75rem}
.sidebar .section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600;margin-bottom:.6rem;display:block}
.sidebar .module-status{font-size:.75rem;color:var(--text-secondary);background:var(--bg-card);padding:.4rem .8rem;border-radius:var(--radius-full);text-align:center;border:1px solid var(--border-subtle);display:inline-block}
.sidebar .toggle-row{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;font-size:.82rem;color:var(--text-secondary);cursor:pointer;transition:var(--transition);min-height:44px}
.sidebar .toggle-row:hover{color:var(--text-primary)}
.sidebar .toggle-row input[type="checkbox"]{appearance:none;width:32px;height:18px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-full);cursor:pointer;position:relative;transition:var(--transition);flex-shrink:0}
.sidebar .toggle-row input[type="checkbox"]::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--text-muted);border-radius:50%;transition:var(--transition)}
.sidebar .toggle-row input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
.sidebar .toggle-row input[type="checkbox"]:checked::after{left:16px;background:var(--bg-primary)}
.sidebar .footer-stats{margin-top:auto;padding:.75rem;border-top:1px solid var(--border-subtle);font-size:.75rem;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.guest-banner{background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(167,139,250,.04));border:1px solid var(--accent);border-radius:var(--radius-md);padding:.85rem;margin:.5rem .75rem}
.guest-banner .gb-label{font-size:.68rem;color:var(--accent);font-weight:700;letter-spacing:.06em;margin-bottom:.4rem;text-transform:uppercase}
.guest-banner .gb-text{font-size:.78rem;color:var(--text-secondary);line-height:1.45}
.guest-banner .gb-counter{margin-top:.6rem;font-size:.72rem;color:var(--text-muted)}
.guest-banner .gb-counter strong{color:var(--accent)}
.main-chat{flex:1;display:flex;flex-direction:column;background:var(--bg-primary);min-width:0;height:100dvh}
.chat-header{padding:.85rem 1.5rem;border-bottom:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center;background:var(--bg-primary);flex-shrink:0;min-height:60px}
.chat-header .ai-status{display:flex;align-items:center;gap:.6rem;font-family:var(--font-serif);font-weight:500;font-size:1.05rem;color:var(--text-primary);letter-spacing:-.01em}
.chat-header .ai-status::before{content:'◆';color:var(--accent);font-size:.85rem}
.chat-header .model-badge{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:.35rem .75rem;font-size:.72rem;color:var(--text-secondary);display:inline-flex;align-items:center;gap:.35rem;font-weight:500}
.chat-header .model-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.chat-header .model-badge.guest-badge{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chat-header .user-menu-btn{background:transparent;border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:.45rem .9rem;font-size:.78rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:.5rem;min-height:40px;font-family:var(--font-sans)}
.chat-header .user-menu-btn:hover{border-color:var(--border-strong);color:var(--text-primary)}
.chat-header .user-menu-btn.login-highlight{background:var(--accent);color:#1a1917;border-color:var(--accent);font-weight:600}
.chat-header .user-menu-btn.login-highlight:hover{background:var(--accent-hover);color:#fff}
.messages{flex:1;overflow-y:auto;padding:2rem 1.5rem 1rem;display:flex;flex-direction:column;gap:1.25rem}
.message{display:flex;gap:.85rem;max-width:85%;animation:msg-in .25s ease}
@keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.user-message{align-self:flex-end;flex-direction:row-reverse}
.message.ai-message{align-self:flex-start}
.message .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;flex-shrink:0;color:var(--text-primary);border:1px solid var(--border-subtle)}
.message.ai-message .avatar{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-family:var(--font-serif)}
.message.user-message .avatar{background:var(--bg-elevated)}
.message .bubble{padding:.85rem 1.15rem;border-radius:var(--radius-lg);line-height:1.65;font-size:.94rem;word-break:break-word;position:relative;max-width:100%;overflow:visible}
.message.user-message .bubble{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-subtle);border-bottom-right-radius:6px}
.message.ai-message .bubble{background:transparent;color:var(--text-primary);padding-left:.4rem}
.message .bubble img,.message .bubble video{border-radius:var(--radius-md);max-width:100%;height:auto}
.message .bubble .btn-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.message .bubble .btn-row button{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:.3rem .9rem;font-size:.72rem;color:var(--text-secondary);cursor:pointer;transition:var(--transition);min-height:34px;font-family:var(--font-sans)}
.message .bubble .btn-row button:hover{border-color:var(--accent);color:var(--text-primary)}
.message .bubble .code-block-wrapper{background:var(--bg-card);border-radius:var(--radius-md);padding:.85rem;margin:.6rem 0;border:1px solid var(--border-subtle);position:relative}
.message .bubble .code-block-wrapper .code-lang{font-size:.62rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:.5rem;display:block;letter-spacing:.06em;font-weight:600}
.message .bubble .code-block-wrapper pre{margin:0;overflow-x:auto}
.message .bubble .code-block-wrapper pre code{font-family:'Fira Code','Courier New',monospace;font-size:.82rem;color:var(--text-secondary);white-space:pre-wrap}
.message .bubble .code-block-wrapper .code-actions{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.message .bubble .code-block-wrapper .code-actions button{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:.25rem .75rem;font-size:.68rem;color:var(--text-secondary);cursor:pointer;transition:var(--transition);min-height:32px;font-family:var(--font-sans)}
.message .bubble .code-block-wrapper .code-actions button:hover{border-color:var(--accent);color:var(--text-primary)}
.msg-actions-bar{display:flex;gap:.3rem;margin-top:.5rem;opacity:0;transition:opacity .15s}
.message:hover .msg-actions-bar{opacity:1}
.msg-actions-bar button{background:transparent;border:1px solid var(--border-subtle);border-radius:var(--radius-full);color:var(--text-muted);padding:.2rem .6rem;font-size:.66rem;cursor:pointer;transition:var(--transition);min-height:26px;font-family:var(--font-sans)}
.msg-actions-bar button:hover{border-color:var(--accent);color:var(--text-primary)}
.live-image-container{margin-top:.5rem;display:inline-block;max-width:100%;animation:fade-in .3s ease}
.live-image-frame{position:relative;display:inline-block;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--border-subtle),0 8px 32px rgba(0,0,0,0.3);background:linear-gradient(135deg,#1a1917,#2a2926);isolation:isolate}
.live-image{display:block;max-width:100%;border-radius:14px;animation:paintReveal 3s cubic-bezier(.22,.61,.36,1) forwards;transform-origin:center;will-change:filter,transform,opacity}
@keyframes paintReveal{0%{filter:blur(32px) saturate(.1) brightness(.6) contrast(1.4);transform:scale(1.08);opacity:.15}15%{filter:blur(24px) saturate(.3) brightness(.75) contrast(1.3);transform:scale(1.06);opacity:.45}35%{filter:blur(14px) saturate(.8) brightness(.9) contrast(1.15);transform:scale(1.04);opacity:.75}60%{filter:blur(6px) saturate(1.3) brightness(1.05) contrast(1.05);transform:scale(1.02);opacity:.95}80%{filter:blur(2px) saturate(1.5) brightness(1.1) contrast(1);transform:scale(1.005);opacity:1}100%{filter:blur(0) saturate(1.05) brightness(1) contrast(1);transform:scale(1);opacity:1}}
.live-scanline{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 0%,rgba(167,139,250,0) 42%,rgba(167,139,250,.5) 50%,rgba(167,139,250,0) 58%,transparent 100%);animation:scanSweep 2.4s ease-in-out forwards;mix-blend-mode:screen;opacity:0}
@keyframes scanSweep{0%{transform:translateY(-100%);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(100%);opacity:0}}
.live-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(167,139,250,.35) 0%,rgba(167,139,250,.1) 40%,transparent 70%);animation:glowPulse 3s ease-out forwards;mix-blend-mode:screen}
@keyframes glowPulse{0%{opacity:1}60%{opacity:.4}100%{opacity:0}}
.typing-cursor{display:inline-block;width:2px;height:1.05em;background:var(--accent);margin-left:3px;vertical-align:text-bottom;border-radius:1px;animation:cursor-blink .9s steps(1) infinite}
@keyframes cursor-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:2rem 1rem;text-align:center;gap:1.5rem;animation:fade-in .4s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.welcome-screen .welcome-logo{font-family:var(--font-serif);font-size:2.8rem;font-weight:500;letter-spacing:-.02em;color:var(--text-primary);margin-bottom:.3rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.welcome-screen .welcome-logo::before{content:'◆';color:var(--accent);font-size:1.6rem}
.welcome-screen p{color:var(--text-secondary);font-size:.95rem}
.suggestion-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem;max-width:720px;width:100%;margin-top:1.5rem}
.suggestion-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:1rem 1.1rem;cursor:pointer;transition:var(--transition);text-align:left;font-size:.82rem;color:var(--text-secondary);line-height:1.5}
.suggestion-card:hover{border-color:var(--accent);background:var(--bg-card);color:var(--text-primary)}
.suggestion-card strong{display:block;color:var(--text-primary);font-size:.85rem;margin-bottom:.35rem;font-weight:500}
.input-area{padding:.75rem 1.5rem calc(1rem + var(--safe-bottom));border-top:1px solid var(--border-subtle);background:var(--bg-primary);flex-shrink:0;position:relative}
.input-area .file-badge{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem}
.input-area .file-badge .file-tag{background:var(--bg-card);border:1px solid var(--border-subtle);padding:.25rem .85rem;border-radius:var(--radius-full);font-size:.72rem;display:flex;align-items:center;gap:.4rem;min-height:32px;color:var(--text-secondary)}
.input-area .file-badge .file-tag button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.8rem;padding:.2rem;min-height:24px}
.active-tools{display:none;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.active-tool-pill{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-full);padding:.25rem .75rem;font-size:.72rem;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:.35rem}
.input-wrapper{display:flex;align-items:flex-end;gap:.4rem;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:.5rem;transition:var(--transition);min-height:52px}
.input-wrapper:focus-within{border-color:var(--border-strong);background:var(--bg-card)}
.input-wrapper textarea{flex:1;background:transparent;border:none;padding:.55rem .5rem;color:var(--text-primary);font-size:.95rem;outline:none;resize:none;min-height:40px;max-height:200px;line-height:1.5;font-family:var(--font-sans)}
.input-wrapper textarea::placeholder{color:var(--text-muted)}
.input-wrapper textarea:disabled{opacity:.5;cursor:not-allowed}
.input-wrapper .plus-btn{background:transparent;border:1px solid var(--border-subtle);border-radius:50%;color:var(--text-secondary);width:38px;min-width:38px;height:38px;cursor:pointer;font-size:1.3rem;transition:var(--transition);flex-shrink:0;display:flex;align-items:center;justify-content:center;align-self:flex-end;font-family:var(--font-sans);line-height:1}
.input-wrapper .plus-btn:hover{background:var(--bg-elevated);color:var(--text-primary);border-color:var(--border-strong)}
.input-wrapper .plus-btn.open{transform:rotate(45deg);background:var(--accent);border-color:var(--accent);color:#1a1917}
.input-wrapper .plus-btn:disabled{opacity:.4;cursor:not-allowed}
.input-wrapper .send-btn{background:var(--accent);border:none;width:38px;min-width:38px;height:38px;border-radius:50%;color:#1a1917;font-size:1rem;cursor:pointer;transition:var(--transition);flex-shrink:0;display:flex;align-items:center;justify-content:center;align-self:flex-end;font-weight:700}
.input-wrapper .send-btn:hover{background:var(--accent-hover);color:var(--text-primary)}
.input-wrapper .send-btn:disabled{opacity:.4;cursor:not-allowed}
.input-area .char-counter{font-size:.65rem;color:var(--text-muted);text-align:right;margin-top:.4rem;padding-right:.5rem}
.tool-menu{position:absolute;bottom:calc(100% - 8px);left:1.5rem;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:.5rem;display:none;flex-direction:column;gap:1px;box-shadow:var(--shadow-card);z-index:60;min-width:260px;animation:slide-up .15s ease}
.tool-menu.open{display:flex}
@keyframes slide-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tool-menu-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:.4rem .65rem .3rem;font-weight:600}
.tool-toggle{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);min-height:44px}
.tool-toggle:hover{background:var(--bg-elevated)}
.tool-toggle .tool-emoji{font-size:1rem;width:22px;text-align:center}
.tool-toggle .tool-name{flex:1;font-size:.85rem;color:var(--text-primary);font-weight:500}
.tool-toggle .toggle-switch{width:32px;height:18px;background:var(--bg-primary);border:1px solid var(--border-strong);border-radius:var(--radius-full);position:relative;transition:var(--transition);flex-shrink:0}
.tool-toggle .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--text-muted);border-radius:50%;transition:var(--transition)}
.tool-toggle.active .toggle-switch{background:var(--accent);border-color:var(--accent)}
.tool-toggle.active .toggle-switch::after{left:16px;background:var(--bg-primary)}
.tool-toggle.active .tool-name{color:var(--accent)}
.tool-toggle.locked{opacity:.55}
.tool-toggle.locked .toggle-switch{background:var(--bg-primary)!important;border-color:var(--border-strong)!important}
.tool-toggle.locked .toggle-switch::after{left:2px!important;background:var(--text-muted)!important}
.tool-menu-sep{height:1px;background:var(--border-subtle);margin:.4rem .4rem}
.tool-action{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);min-height:44px;background:transparent;border:none;color:var(--text-primary);font-size:.85rem;text-align:left;font-family:var(--font-sans);width:100%;font-weight:500}
.tool-action:hover{background:var(--bg-elevated)}
.tool-action.danger{color:var(--danger)}
.tool-action.danger:hover{background:rgba(239,68,68,.1)}
.tool-action.locked{opacity:.55}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:1.5rem;animation:fade-in .2s ease;overflow-y:auto}
.modal-content{background:var(--bg-secondary);border:1px solid var(--border-strong);border-radius:var(--radius-lg);max-width:440px;width:100%;max-height:90dvh;overflow-y:auto;padding:1.75rem 1.5rem;box-shadow:var(--shadow-card);animation:slide-up .25s ease;position:relative}
.modal-content .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.modal-content .modal-header h3{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;color:var(--text-primary)}
.modal-content .modal-header .close{font-size:1.6rem;cursor:pointer;color:var(--text-muted);transition:var(--transition);line-height:1;padding:.2rem .4rem}
.modal-content .modal-header .close:hover{color:var(--text-primary)}
.modal-content .modal-body{max-height:60dvh;overflow-y:auto;background:var(--bg-primary);border-radius:var(--radius-md);padding:1rem;border:1px solid var(--border-subtle);white-space:pre-wrap;word-break:break-word;font-size:.85rem;line-height:1.6;color:var(--text-secondary)}
.modal-content .modal-actions{display:flex;gap:.8rem;margin-top:1rem;justify-content:flex-end;flex-wrap:wrap}
.modal-content .modal-actions button{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.5rem 1.2rem;color:var(--text-primary);cursor:pointer;transition:var(--transition);font-size:.82rem;min-height:44px;font-family:var(--font-sans)}
.modal-content .modal-actions button:hover{border-color:var(--border-strong)}
.modal-content .modal-actions button.primary{background:var(--accent);border:none;color:#1a1917;font-weight:600}
.modal-content .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}
.modal-content .card-sm{background:var(--bg-primary);border-radius:var(--radius-md);padding:1rem 1.1rem;border:1px solid var(--border-subtle)}
.modal-content .card-sm h4{font-size:.82rem;font-weight:600;color:var(--text-secondary);margin-bottom:.5rem}
.modal-content .card-sm label{font-size:.72rem;color:var(--text-muted);display:block;margin-top:.5rem}
.modal-content .card-sm input,.modal-content .card-sm textarea{width:100%;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.6rem .9rem;color:var(--text-primary);font-size:.85rem;outline:none;transition:var(--transition);margin-top:.2rem;min-height:44px;font-family:var(--font-sans)}
.modal-content .card-sm input:focus,.modal-content .card-sm textarea:focus{border-color:var(--accent)}
.modal-content .card-sm textarea{resize:vertical;min-height:60px}
.modal-content .card-sm .btn-sm{width:100%;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:.6rem;color:var(--text-primary);font-weight:500;cursor:pointer;transition:var(--transition);margin-top:.5rem;font-size:.8rem;min-height:44px;font-family:var(--font-sans)}
.modal-content .card-sm .btn-sm:hover{border-color:var(--border-strong)}
.modal-content .card-sm .btn-sm.primary{background:var(--accent);border:none;color:#1a1917;font-weight:600}
.modal-content .card-sm .btn-sm.danger{background:#7f1a1a;border:none;color:#fff}
.modal-content .card-sm .btn-sm.success{background:#065f46;border:none;color:#fff}
.modal-content .key-list{max-height:150px;overflow-y:auto;margin:.5rem 0}
.modal-content .key-list .key-item{background:var(--bg-secondary);border-radius:var(--radius-sm);padding:.5rem .75rem;margin-bottom:.3rem;display:flex;justify-content:space-between;align-items:center;font-size:.75rem;border:1px solid var(--border-subtle);flex-wrap:wrap;gap:.3rem}
.modal-content .key-list .key-item code{color:var(--text-secondary);font-size:.7rem;word-break:break-all;font-family:monospace}
.modal-content .key-list .key-item .revoke{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.8rem;padding:.2rem .5rem}
.modal-content .free-key-box{background:var(--bg-secondary);border-radius:var(--radius-sm);padding:.65rem .85rem;margin-top:.4rem;font-size:.75rem;border:1px solid var(--border-subtle);word-break:break-all}
.modal-content .free-key-box code{color:var(--accent);font-family:monospace}
.profile-preview{width:56px;height:56px;border-radius:50%;background:var(--accent);margin:.5rem auto;background-size:cover;background-position:center;border:2px solid var(--border-subtle)}
.mobile-hamburger{display:none;background:none;border:none;color:var(--text-primary);font-size:1.4rem;cursor:pointer;padding:.2rem .4rem;min-height:44px;min-width:44px;align-items:center;justify-content:center}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.sidebar-overlay.active{display:block}
@media (max-width:820px){.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:100;transform:translateX(-100%);width:260px;border-right:1px solid var(--border-subtle);box-shadow:4px 0 40px rgba(0,0,0,.6)}.sidebar.open{transform:translateX(0)}.mobile-hamburger{display:flex!important}.modal-content .grid-2{grid-template-columns:1fr}.message{max-width:95%}.chat-header .user-menu-btn{font-size:.7rem;padding:.3rem .7rem}.suggestion-grid{grid-template-columns:1fr}}
@media (max-width:480px){.chat-header{padding:.6rem 1rem}.messages{padding:1.25rem .9rem .5rem}.input-area{padding:.6rem .9rem calc(.75rem + var(--safe-bottom))}.input-wrapper{padding:.4rem;min-height:46px}.input-wrapper textarea{font-size:.9rem;padding:.4rem;min-height:38px}.input-wrapper .send-btn{width:36px;min-width:36px;height:36px;font-size:.9rem}.input-wrapper .plus-btn{width:36px;min-width:36px;height:36px;font-size:1.15rem}.message .bubble{font-size:.9rem;padding:.7rem .95rem}.welcome-screen .welcome-logo{font-size:2.2rem}.tool-menu{left:.75rem;right:.75rem;min-width:unset}.auth-logo{font-size:1.8rem}.auth-heading{font-size:1.2rem}}
#app-root.loading{display:flex;align-items:center;justify-content:center;height:100dvh;font-size:1rem;color:var(--text-secondary);background:var(--bg-primary);font-family:var(--font-serif)}
#app-root.error{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;color:var(--danger);padding:2rem;text-align:center;background:var(--bg-primary)}
#app-root.error h2{font-size:1.5rem;margin-bottom:.5rem;font-family:var(--font-serif);font-weight:500}
#app-root.error p{max-width:500px;color:var(--text-secondary)}
#app-root.error button{margin-top:1.5rem;background:var(--accent);border:none;padding:.6rem 1.5rem;border-radius:var(--radius-md);color:#1a1917;font-weight:600;cursor:pointer;min-height:44px;font-family:var(--font-sans)}
</style>
</head>
<body>

<div id="app-root" class="loading">Loading Vrythos…</div>

<script>
// ========== API HELPERS ==========
async function apiGet(endpoint){const res=await fetch(endpoint);if(!res.ok)throw new Error(await res.text());return res.json()}
async function apiPost(endpoint,data){const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.error||'Request failed')}return res.json()}
async function apiPut(endpoint,data){const res=await fetch(endpoint,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!res.ok)throw new Error(await res.text());return res.json()}
async function apiDelete(endpoint){const res=await fetch(endpoint,{method:'DELETE'});if(!res.ok)throw new Error(await res.text());return res.json()}

// ========== STATE ==========
let currentUser = null;
let isGuest = true;
const GUEST_CHAT_LIMIT = 10;
let guestChatCount = parseInt(localStorage.getItem('vrythos_guest_chats') || '0');
let modules = [];
let tournaments = [];
let deepThink = false;
let liveImageMode = false;
let liveVideoMode = false;
let bestCodingMode = false;
let messagesHistory = [];
let attachedFiles = [];
let isProcessing = false;
const DEFAULT_VIDEO_DURATION = 5;
const imgStore = {};
let imgStoreCounter = 0;
const videoStore = {};
let videoStoreCounter = 0;
let abuseScore = 0;
let abuseWarningShown = false;
let messageIdCounter = 0;
const messageContentStore = {};
let currentChatId = null;
let recaptchaWidgets = { login: null, register: null };

// ========== UTILITIES ==========
function escapeHtml(str){const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(str).replace(/[&<>"']/g,m=>map[m])}
function smartScroll(el){if(!el)return;const threshold=120;if(el.scrollHeight-el.scrollTop-el.clientHeight<threshold)el.scrollTop=el.scrollHeight}
async function hashPassword(pw){const enc=new TextEncoder().encode(pw);const h=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function showToast(msg,type='info'){const t=document.createElement('div');const bg=type==='error'?'#7f1a1a':type==='warning'?'#78350f':'#2a2926';t.style.cssText=`position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:${bg};color:#f5f4ef;padding:.65rem 1.25rem;border-radius:9999px;font-size:.82rem;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:90%;text-align:center;border:1px solid #3a3833;min-height:44px;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s'},2800);setTimeout(()=>t.remove(),3200)}

function updateGuestCounter(){
  const remaining = Math.max(0, GUEST_CHAT_LIMIT - guestChatCount);
  const sidebarEl = document.getElementById('guestCounter');
  const headerEl = document.getElementById('guestHeaderCounter');
  if (sidebarEl) sidebarEl.textContent = remaining;
  if (headerEl) headerEl.textContent = remaining;
}

function promptLogin(feature){
  showToast(`🔐 Login required to use ${feature}`, 'warning');
  setTimeout(() => showAuthModal('login'), 350);
}

// ========== ABUSE (only for logged-in users) ==========
async function addAbuseScore(points,reason,context){
  if(isGuest||!currentUser)return;
  abuseScore=Math.min(100,abuseScore+points);
  try{
    await apiPost('/api/pendingBans',{email:currentUser.email,username:currentUser.username,score:abuseScore,reason,context:(context||'').slice(0,200),timestamp:Date.now(),reviewed:false});
    await apiPost('/api/abuse',{email:currentUser.email,username:currentUser.username,reason,context:(context||'').slice(0,100),timestamp:Date.now()});
  }catch(_){}
  if((abuseScore>=10&&!abuseWarningShown)||points>=5){
    abuseWarningShown=true;
    addAIMessage(`Warning: suspicious activity detected (score ${abuseScore}%). Repeated violations may lead to a ban.`,false,false,true);
  }
}
document.addEventListener('contextmenu',e=>{if(isGuest)return;e.preventDefault();addAbuseScore(5,'Right-click attempt','User right-clicked');showToast('Right-click is prohibited','warning');return false});
function detectDevTools(){if(isGuest)return;const t=160;if(window.outerWidth-window.innerWidth>t||window.outerHeight-window.innerHeight>t){addAbuseScore(10,'Developer tools detected','DevTools opened');showToast('Developer tools detected','error')}}
setInterval(detectDevTools,2000);
document.addEventListener('keydown',e=>{if(isGuest)return;if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&e.key==='I')||(e.ctrlKey&&e.key==='U')){e.preventDefault();addAbuseScore(10,'View source attempt','Tried to view page source');showToast('Viewing source is forbidden','error');return false}});

// Persistent outside-click handler for tool menu (registered ONCE)
document.addEventListener('click', e => {
  const tm = document.getElementById('toolMenu');
  const pb = document.getElementById('plusBtn');
  if (tm && pb && !tm.contains(e.target) && e.target !== pb) {
    tm.classList.remove('open');
    pb.classList.remove('open');
  }
});

// ========== DOWNLOAD/COPY ==========
window.downloadImage=function(id){const u=imgStore[id];if(!u)return;const a=document.createElement('a');a.download='vrythos_image.png';a.href=u;a.click()};
window.copyImageToClipboard=async function(id){const u=imgStore[id];if(!u)return;try{const b=await(await fetch(u)).blob();await navigator.clipboard.write([new ClipboardItem({[b.type]:b})]);showToast('Image copied','info')}catch(_){showToast('Copy failed','error')}};
window.downloadVideo=function(id){const u=videoStore[id];if(!u)return;const a=document.createElement('a');a.download='vrythos_video.mp4';a.href=u;a.click()};
window.copyVideoToClipboard=async function(id){const u=videoStore[id];if(!u)return;try{const b=await(await fetch(u)).blob();await navigator.clipboard.write([new ClipboardItem({[b.type]:b})]);showToast('Video copied','info')}catch(_){showToast('Copy failed','error')}};

// ========== LOADERS ==========
async function loadAllData(){modules=await apiGet('/api/modules');tournaments=await apiGet('/api/tournaments')}
async function loadUsers(){return await apiGet('/api/users')}
async function updateUser(email,updates){return await apiPut(`/api/users/${email}`,updates)}
async function deleteUser(email){return await apiDelete(`/api/users/${email}`)}
async function loadUserApiKeys(email){const all=await apiGet('/api/userApiKeys');const entry=all.find(e=>e.email===email);return entry?entry.keys:[]}
async function saveUserApiKeys(email,keys){await apiPost('/api/userApiKeys',{email,keys})}
async function addBugReport(bug){return await apiPost('/api/bugs',bug)}
async function joinTournament(id){return await apiPost('/api/join-tournament',{email:currentUser.email,tournamentId:id})}

// ========== IMAGE (blocked for guest at call site) ==========
async function generateImageWithCloudflare(prompt){try{const r=await fetch('/api/generate/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await r.json();if(d.success)return d.image}catch(_){}return null}
async function generateImageWithPollinations(prompt){try{const r=await fetch('/api/fallback/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await r.json();if(d.success)return d.image}catch(_){}return null}
async function generateImageAndShow(prompt,live=false){
  addAIMessage(live?'🎨 Painting image… bringing your vision to life':'Generating image…',false,false,true);
  let imgData=await generateImageWithCloudflare(prompt);
  if(!imgData)imgData=await generateImageWithPollinations(prompt);
  if(imgData&&imgData.startsWith('data:image')){
    const id='img_'+(++imgStoreCounter);
    imgStore[id]=imgData;
    if(live){
      addAIMessage(`<div class="live-image-container"><div class="live-image-frame"><img src="${imgData}" class="live-image" alt="Generated image" /><div class="live-scanline"></div><div class="live-glow"></div></div></div><div class="btn-row"><button onclick="downloadImage('${id}')">⬇️ Download</button><button onclick="copyImageToClipboard('${id}')">📋 Copy</button></div>`,true,false);
    }else{
      addAIMessage(`<img src="${imgData}" style="max-width:100%;border-radius:12px;" /><div class="btn-row"><button onclick="downloadImage('${id}')">Download</button><button onclick="copyImageToClipboard('${id}')">Copy</button></div>`,true,false);
    }
  }else{
    addAIMessage('Image generation failed. Please try again.',false,false,true);
  }
}

// ========== VIDEO (blocked for guest at call site) ==========
async function generateVideo(prompt,duration){
  addAIMessage('Generating video… (may take 30–60s)',false,false,true);
  try{
    const r=await apiPost('/api/generate/video',{email:currentUser.email,prompt,duration:duration||DEFAULT_VIDEO_DURATION});
    if(r.success){
      const id='vid_'+(++videoStoreCounter);
      videoStore[id]=r.video;
      addAIMessage(`<video controls autoplay loop style="max-width:100%;border-radius:12px;max-height:400px;"><source src="${r.video}" type="video/mp4">Your browser does not support video.</video><div class="btn-row"><button onclick="downloadVideo('${id}')">Download</button><button onclick="copyVideoToClipboard('${id}')">Copy</button></div>`,true,false);
    }else{
      addAIMessage('Video failed: '+(r.error||'Unknown error'),false,false,true);
    }
  }catch(e){addAIMessage('Video error: '+e.message,false,false,true)}
}
function isVideoRequest(t){return /(video|animate|animation|make a video|create a video|generate a video|render|cinematic|short film|motion|sequence|clip|movie)/i.test(t)}
function isImageRequest(t){return /(make|create|generate|draw|paint|render).*(image|picture|photo|art|illustration).*of\s+(.+)|(image|picture|photo|art|illustration)\s+(of|with)\s+(.+)/i.test(t)}

// ========== AI CALL ==========
async function callChatWithFallback(messages,deep){
  let attempts=0;let lastError=null;
  const maxAttempts=Math.min(modules.length,3);
  const shuffled=[...modules].sort(()=>Math.random()-0.5);
  for(const mod of shuffled){
    if(attempts>=maxAttempts)break;attempts++;
    try{const r=await callChatAPI(mod.id,messages,deep);updateModuleStatus(mod.displayName);return r}
    catch(err){lastError=err;console.warn(`Module ${mod.displayName} failed: ${err.message}`)}
  }
  throw new Error(lastError?lastError.message:'All AI engines unavailable');
}
async function callChatAPI(module_id,messages,deep){
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module_id,messages,deep_think:deep})});
  const data=await res.json();
  if(!data.success)throw new Error(data.error||'Chat API error');
  return data.reply;
}
function updateModuleStatus(name){
  const el=document.getElementById('moduleStatus');if(el)el.textContent=name;
  const b=document.getElementById('modelBadge');if(b)b.innerHTML=`<span class="dot"></span> ${escapeHtml(name)}`;
}

// ========== CODE ==========
function processCodeInText(text){
  const re=/```(\w+)?\n([\s\S]*?)```/g;
  let m,last=0,parts=[],has=false;
  while((m=re.exec(text))!==null){
    if(m.index>last)parts.push({type:'text',content:text.substring(last,m.index)});
    parts.push({type:'code',language:m[1]||'txt',code:m[2]});
    has=true;last=m.index+m[0].length;
  }
  if(last<text.length)parts.push({type:'text',content:text.substring(last)});
  return has?parts:null;
}
let codeStore={};
function buildCodeHtml(parts){
  let html='';
  for(const p of parts){
    if(p.type==='text')html+=escapeHtml(p.content).replace(/\n/g,'<br>');
    else{
      const id='code_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
      codeStore[id]={language:p.language||'txt',code:p.code};
      if(isGuest){
        html+=`<div class="code-block-wrapper"><span class="code-lang">${escapeHtml(p.language||'txt')}</span><pre><code>${escapeHtml(p.code)}</code></pre></div>`;
      }else{
        html+=`<div class="code-block-wrapper" data-codeid="${id}"><span class="code-lang">${escapeHtml(p.language||'txt')}</span><pre><code>${escapeHtml(p.code)}</code></pre><div class="code-actions"><button onclick="previewCode('${id}')">👁️ Preview</button><button onclick="downloadCode('${id}')">Download</button><button onclick="copyCode('${id}')">Copy</button><button onclick="debugCode('${id}')">Debug</button></div></div>`;
      }
    }
  }
  return html;
}
window.previewCode=function(id){
  if(isGuest){promptLogin('code preview');return}
  const d=codeStore[id];if(!d)return;
  const modal=document.createElement('div');modal.className='modal-overlay';
  modal.innerHTML=`<div class="modal-content" style="max-width:900px;"><div class="modal-header"><h3>Code Preview (${escapeHtml(d.language)})</h3><span class="close" id="previewClose">&times;</span></div><div class="modal-body" style="max-height:70dvh;">${escapeHtml(d.code)}</div><div class="modal-actions"><button class="primary" id="previewCopy">Copy Code</button><button id="previewCloseBtn">Close</button></div></div>`;
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  modal.querySelector('#previewClose').onclick=close;
  modal.querySelector('#previewCloseBtn').onclick=close;
  modal.querySelector('#previewCopy').onclick=async()=>{try{await navigator.clipboard.writeText(d.code);showToast('Copied','info')}catch(_){showToast('Copy failed','error')}};
  modal.addEventListener('click',e=>{if(e.target===modal)close()});
};
window.downloadCode=function(id){
  if(isGuest){promptLogin('code download');return}
  const d=codeStore[id];if(!d)return;
  const blob=new Blob([d.code],{type:'text/plain'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const ext={html:'html',css:'css',js:'js',javascript:'js',python:'py',py:'py',java:'java',c:'c',cpp:'cpp','c++':'cpp',go:'go',rust:'rs',php:'php',ruby:'rb',rb:'rb',swift:'swift',ts:'ts',typescript:'ts',json:'json',xml:'xml',sh:'sh',bash:'sh',txt:'txt'};
  a.download=`code.${ext[d.language]||'txt'}`;a.click();URL.revokeObjectURL(url);
};
window.copyCode=async function(id){
  if(isGuest){promptLogin('code copy');return}
  const d=codeStore[id];if(!d)return;
  try{await navigator.clipboard.writeText(d.code);showToast('Code copied','info')}catch(_){showToast('Copy failed','error')}
};
window.debugCode=async function(id){
  if(isGuest){promptLogin('code debugging');return}
  const d=codeStore[id];if(!d)return;
  if(isProcessing){showToast('Please wait for current reply to finish','warning');return}
  const btn=document.querySelector(`.code-block-wrapper[data-codeid="${id}"] .code-actions button:last-child`);
  if(btn)btn.disabled=true;const orig=btn?btn.textContent:'Debug';if(btn)btn.textContent='Debugging…';
  setProcessing(true);
  try{
    messagesHistory.push({role:'user',content:`Please review the following ${d.language} code for errors, bugs, or improvements. Provide the fixed version with explanations. Code:\n\`\`\`${d.language}\n${d.code}\n\`\`\``});
    const r=await callChatWithFallback(messagesHistory.slice(-12),deepThink);
    await addAIMessage(r,false,true);
    if(btn){btn.disabled=false;btn.textContent=orig}
  }catch(err){showToast('Debug failed: '+err.message,'error');if(btn){btn.disabled=false;btn.textContent=orig}}
  finally{setProcessing(false);await saveCurrentChat()}
};

// ========== FULL OUTPUT ==========
function showFullOutput(content){
  if(isGuest){promptLogin('full output view');return}
  const m=document.createElement('div');m.className='modal-overlay';
  m.innerHTML=`<div class="modal-content" style="max-width:800px;"><div class="modal-header"><h3>Full Output</h3><span class="close" id="foClose">&times;</span></div><div class="modal-body">${escapeHtml(content)}</div><div class="modal-actions"><button class="primary" id="foCopy">Copy Full Text</button><button id="foCloseBtn">Close</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('#foClose').onclick=close;m.querySelector('#foCloseBtn').onclick=close;
  m.querySelector('#foCopy').onclick=async()=>{try{await navigator.clipboard.writeText(content);showToast('Full output copied','info')}catch(_){showToast('Copy failed','error')}};
  m.addEventListener('click',e=>{if(e.target===m)close()});
}

// ========== REGENERATE ==========
async function regenerateReply(){
  if(isGuest){promptLogin('regenerate');return}
  if(isProcessing||!currentUser)return;
  while(messagesHistory.length>0&&messagesHistory[messagesHistory.length-1].role==='assistant')messagesHistory.pop();
  if(!messagesHistory.length){showToast('Nothing to regenerate','warning');return}
  // Remove last AI message from DOM so it matches popped history
  const container=document.getElementById('messagesContainer');
  const allAI=container.querySelectorAll('.ai-message');
  if(allAI.length>0)allAI[allAI.length-1].remove();

// ========== TYPING — 4-phase schedule ==========
function getTypingDelay(wordIndex){
  if(wordIndex<21)return 1000/7;
  if(wordIndex<61)return 1000/10;
  if(wordIndex<161)return 1000/10;
  return 1000/20;
}
async function typeInto(text,targetEl,isAborted){
  const tokens=text.split(/(\s+)/);
  let buffer='';let wordCount=0;
  for(let i=0;i<tokens.length;i++){
    if(isAborted&&isAborted()){
      for(let j=i;j<tokens.length;j++)buffer+=tokens[j];
      targetEl.innerHTML=escapeHtml(buffer).replace(/\n/g,'<br>');
      smartScroll(document.getElementById('messagesContainer'));
      return;
    }
    buffer+=tokens[i];
    targetEl.innerHTML=escapeHtml(buffer).replace(/\n/g,'<br>');
    smartScroll(document.getElementById('messagesContainer'));
    if(tokens[i].trim()){
      const delay=getTypingDelay(wordCount);wordCount++;
      await new Promise(r=>setTimeout(r,delay));
    }else if(tokens[i].includes('\n')){
      await new Promise(r=>setTimeout(r,25));
    }
  }
}

// ========== STREAMING AI MESSAGE — fixed to not overwrite earlier parts ==========
let currentTypingAbort=null;
async function streamAIMessage(content){
  if(currentTypingAbort){currentTypingAbort();currentTypingAbort=null}
  const container=document.getElementById('messagesContainer');
  const div=document.createElement('div');div.className='message ai-message';
  const msgId='msg_'+(++messageIdCounter);
  messageContentStore[msgId]=content;
  const parts=processCodeInText(content);
  const actionsHtml = isGuest ? `<div class="msg-actions-bar" style="display:none;"></div>` : `<div class="msg-actions-bar" style="display:none;"><button data-copy="${msgId}">Copy</button><button data-regen="${msgId}">Regenerate</button><button data-full="${msgId}">Full</button></div>`;
  div.innerHTML=`<div class="avatar">◆</div><div class="bubble"><span class="typing-content"></span><span class="typing-cursor"></span>${actionsHtml}</div>`;
  container.appendChild(div);container.scrollTop=container.scrollHeight;
  messagesHistory.push({role:'assistant',content});
  if(!isGuest){
    div.querySelector(`[data-copy="${msgId}"]`).onclick=async()=>{try{await navigator.clipboard.writeText(messageContentStore[msgId]||'');showToast('Copied','info')}catch(_){showToast('Copy failed','error')}};
    div.querySelector(`[data-regen="${msgId}"]`).onclick=regenerateReply;
    div.querySelector(`[data-full="${msgId}"]`).onclick=()=>showFullOutput(messageContentStore[msgId]||'');
  }
  const typingContent=div.querySelector('.typing-content');
  const cursorEl=div.querySelector('.typing-cursor');
  let aborted=false;currentTypingAbort=()=>{aborted=true};
  const isAborted=()=>aborted;
  try{
    if(parts){
      for(let i=0;i<parts.length;i++){
        const p=parts[i];
        if(p.type==='text'){
          const textSpan=document.createElement('span');
          typingContent.appendChild(textSpan);
          await typeInto(p.content,textSpan,isAborted);
        }else{
          const codeWrapper=document.createElement('div');
          codeWrapper.innerHTML=buildCodeHtml([p]);
          while(codeWrapper.firstChild)typingContent.appendChild(codeWrapper.firstChild);
          smartScroll(container);
          await new Promise(r=>setTimeout(r,60));
        }
        if(aborted){
          for(let j=i+1;j<parts.length;j++){
            const q=parts[j];
            if(q.type==='text'){
              const s=document.createElement('span');
              s.innerHTML=escapeHtml(q.content).replace(/\n/g,'<br>');
              typingContent.appendChild(s);
            }else{
              const w=document.createElement('div');
              w.innerHTML=buildCodeHtml([q]);
              while(w.firstChild)typingContent.appendChild(w.firstChild);
            }
          }
          smartScroll(container);break;
        }
      }
    }else{
      await typeInto(content,typingContent,isAborted);
    }
  }finally{
    if(cursorEl.parentNode)cursorEl.remove();
    const bar = div.querySelector('.msg-actions-bar');
    if(bar) bar.style.display='flex';
    smartScroll(container);
    if(!aborted)currentTypingAbort=null;
  }
}
function addAIMessage(content,isHtml=false,stream=false,skipHistory=false){
  if(stream&&!isHtml)return streamAIMessage(content);
  _addAIMessageInstant(content,isHtml,skipHistory);
  return Promise.resolve();
}

// ========== BEST CODING ==========
async function handleBestCoding(userText,attachedFilesText){
  if(isGuest){promptLogin('best coding mode');return}
  const avail=[...modules];
  if(!avail.length){addAIMessage('No AI engines available. Please add at least one engine in the admin panel.',false,false,true);return}
  let initial=userText;if(attachedFilesText)initial+='\n\n'+attachedFilesText;
  let reply=null;let used=[];let step=0;const maxSteps=Math.min(4,avail.length);let attempts=0;const maxA=avail.length*2;
  const typing=showTyping();const bubble=typing.querySelector('.bubble');
  while(step<maxSteps&&attempts<maxA){
    attempts++;let found=false;
    for(const mod of avail){
      if(used.includes(mod.id))continue;
      bubble.textContent=`Step ${step+1}/${maxSteps} with ${mod.displayName}…`;
      try{
        const r=step===0?await callChatAPI(mod.id,[{role:'user',content:initial}],deepThink):await callChatAPI(mod.id,[{role:'user',content:`Original request: "${userText}"\n\nPrevious output:\n${reply}\n\nPlease review, fix bugs, improve the code, add more features, and make it more professional. Provide the final improved version.`}],deepThink);
        reply=r;used.push(mod.id);step++;found=true;updateModuleStatus(mod.displayName);break;
      }catch(err){used.push(mod.id)}
    }
    if(!found)break;
  }
  typing.remove();
  if(reply)await addAIMessage(reply,false,true);
  else addAIMessage('Best coding chain failed to produce any output.',false,false,true);
}

// ========== SEND MESSAGE ==========
async function sendMessage(userText,forceImage=false,forceVideo=false){
  // Guest checks
  if(isGuest){
    if(guestChatCount >= GUEST_CHAT_LIMIT){
      showToast('Guest limit reached. Please login.', 'warning');
      setTimeout(() => showAuthModal('login'), 500);
      return;
    }
    // Force disable all tools for guests
    forceImage = false;
    forceVideo = false;
    bestCodingMode = false;
    liveImageMode = false;
    liveVideoMode = false;
    deepThink = false;
  } else {
    if(!currentUser||currentUser.banned){addAIMessage('Account banned.',false,false,true);return}
  }
  if(isProcessing)return;
  setProcessing(true);
  const welcome=document.getElementById('welcomeScreen');if(welcome)welcome.remove();
  try{
    if(!isGuest){
      const willVideo=forceVideo||(!forceImage&&liveVideoMode&&isVideoRequest(userText));
      const willImage=(forceImage||(liveImageMode&&isImageRequest(userText)))&&!willVideo;
      if(willVideo){
        let prompt=userText;
        const m=userText.match(/.*(?:make|create|generate|render|animate)\s+(?:a\s+)?(video|animation|clip|short film|cinematic)\s+(?:of|with)\s+(.+)/i);
        if(m&&m[2])prompt=m[2];
        addUserMessage(userText);
        await generateVideo(prompt,DEFAULT_VIDEO_DURATION);
        return;
      }
      if(willImage){
        addUserMessage(userText);
        let prompt=userText;
        const m=userText.match(/.*(?:make|create|generate|draw|paint|render)\s+(?:an?\s+)?(image|picture|photo|art|illustration)\s+(?:of|with)\s+(.+)/i);
        if(m&&m[2])prompt=m[2];
        await generateImageAndShow(prompt,liveImageMode||forceImage);
        return;
      }
      if(bestCodingMode&&modules.length>0){
        let filesText='';
        if(attachedFiles.length){
          filesText=attachedFiles.map(f=>f.isText?`${f.name}:\n${f.content}`:`${f.name} (binary)`).join('\n');
          attachedFiles=[];renderFileBadges();
        }
        addUserMessage(userText);
        await handleBestCoding(userText,filesText);
        return;
      }
    }
    let modifiedText=userText;
    const codeKeywords=['code','html','css','javascript','python','java','c++','c#','php','ruby','go','rust','swift','typescript','js','py','cpp'];
    if(codeKeywords.some(kw=>userText.toLowerCase().includes(kw)))modifiedText+="\n\n(Please format any code you provide with triple backticks and language specifier, e.g., ```html ... ```)";
    addUserMessage(userText);
    let fullMsg=modifiedText;
    if(!isGuest && attachedFiles.length){
      fullMsg+='\n\n[Attached files]\n'+attachedFiles.map(f=>f.isText?`${f.name}:\n${f.content}`:`${f.name} (binary)`).join('\n');
      attachedFiles=[];renderFileBadges();
    }
    const typing=showTyping();
    let reply='';let isErr=false;
    try{reply=await callChatWithFallback(messagesHistory.slice(-12),deepThink)}
    catch(e){reply=`All AI engines are currently unavailable. Please try again later. Error: ${e.message}`;isErr=true}
    finally{if(typing)typing.remove()}
    if(isErr)addAIMessage(reply,false,false,true);
    else await addAIMessage(reply,false,true);
  }finally{
    setProcessing(false);
    if(isGuest){
      guestChatCount++;
      localStorage.setItem('vrythos_guest_chats', guestChatCount.toString());
      updateGuestCounter();
      if(guestChatCount >= GUEST_CHAT_LIMIT){
        setTimeout(() => {
          showToast('🎁 Guest limit reached. Login to continue.', 'warning');
          showAuthModal('login');
        }, 1200);
      }
    }else{
      await saveCurrentChat();
    }
  }
}

  async function refreshApiKeys(){
    userKeys=await loadUserApiKeys(currentUser.email);
    const c=document.getElementById('apiKeysList');if(!c)return;
    if(!userKeys.length){c.innerHTML='<i style="color:var(--text-muted);font-size:.75rem;">No keys yet.</i>';return}
    c.innerHTML=userKeys.map((k,i)=>`<div class="key-item"><span><strong>${escapeHtml(k.name)}</strong> <code>${escapeHtml(k.key)}</code> <span style="color:var(--text-muted);">${k.used||0}/20</span></span><button class="revoke" data-idx="${i}">×</button></div>`).join('');
    c.querySelectorAll('.revoke').forEach(btn=>{btn.onclick=async()=>{const i=parseInt(btn.dataset.idx);userKeys.splice(i,1);await saveUserApiKeys(currentUser.email,userKeys);await refreshApiKeys()}});
  }
  await refreshApiKeys();
  document.getElementById('generateApiKeyBtn').onclick=async()=>{
    if(userKeys.length>=2){showToast('Max 2 keys per user.','error');return}
    const name=prompt('Label for this key (e.g., MyApp)');if(!name)return;
    const newKey='vrythos_'+Math.random().toString(36).substring(2,15)+Math.random().toString(36).substring(2,8);
    userKeys.push({name,key:newKey,used:0,date:new Date().toISOString().slice(0,10)});
    await saveUserApiKeys(currentUser.email,userKeys);await refreshApiKeys();
    showToast(`Key generated: ${newKey}`,'info');
  };
  async function refreshFreeKey(){
    try{
      const info=await apiGet(`/api/free-api-key/info?email=${encodeURIComponent(currentUser.email)}`);
      const infoDiv=document.getElementById('freeKeyInfo');
      const displayDiv=document.getElementById('freeKeyDisplay');
      const revokeBtn=document.getElementById('revokeFreeKeyBtn');
      if(info.exists){
        infoDiv.innerHTML=`Active (${info.used}/${info.limit} used today)`;
        document.getElementById('freeKeyValue').textContent=info.key;
        displayDiv.style.display='block';revokeBtn.style.display='block';
      }else{
        infoDiv.innerHTML='No free key yet.';
        displayDiv.style.display='none';revokeBtn.style.display='none';
      }
    }catch(_){}
  }
  await refreshFreeKey();
  document.getElementById('generateFreeKeyBtn').onclick=async()=>{
    try{
      const res=await apiPost('/api/free-api-key/generate',{email:currentUser.email});
      if(res.success){showToast(`Free key generated: ${res.key}`,'info');await refreshFreeKey()}
      else showToast('Failed: '+(res.error||'Unknown'),'error');
    }catch(e){showToast('Error: '+e.message,'error')}
  };
  document.getElementById('revokeFreeKeyBtn').onclick=async()=>{
    if(!confirm('Revoke your free API key?'))return;
    try{await apiPost('/api/free-api-key/revoke',{email:currentUser.email});await refreshFreeKey();showToast('Key revoked.','info')}
    catch(e){showToast('Error: '+e.message,'error')}
  };
}

        <div class="footer-stats"><span id="sidebarUsername">${isGuest ? 'guest' : currentUser.username}</span><span style="color:var(--text-muted);">${isGuest ? 'Guest' : 'Unlimited'}</span></div>

      <div class="main-chat">
        <div class="chat-header">
          <div style="display:flex;align-items:center;gap:.6rem;"><button class="mobile-hamburger" id="hamburgerBtn">☰</button><div class="ai-status">Vrythos</div></div>

            <div class="tool-menu-title">Tools</div>
            <div class="tool-toggle" data-tool="deep"><span class="tool-emoji">🔬</span><span class="tool-name">Deep Think</span><span class="toggle-switch"></span></div>
            <div class="tool-toggle" data-tool="coding"><span class="tool-emoji">⚙️</span><span class="tool-name">Best Coding</span><span class="toggle-switch"></span></div>
            <div class="tool-toggle" data-tool="liveimage"><span class="tool-emoji">🖼️</span><span class="tool-name">Live Image</span><span class="toggle-switch"></span></div>
            <div class="tool-toggle" data-tool="livevideo"><span class="tool-emoji">🎥</span><span class="tool-name">Live Video</span><span class="toggle-switch"></span></div>
            <div class="tool-menu-sep"></div>

  // ========== Wire up UI events ==========
  const ta = document.getElementById('userInput');
  const cc = document.getElementById('charCounter');

    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
      cc.textContent = ta.value.length + ' characters';
    });
    ta.dispatchEvent(new Event('input'));
  }

  // New chat button
  const newChatBtn = document.getElementById('newChatBtn');
  if (newChatBtn) {
    newChatBtn.onclick = async () => {
      if (isProcessing) { showToast('Please wait for the current reply to finish', 'warning'); return; }
      if (!isGuest) await saveCurrentChat();
      messagesHistory = [];
      currentChatId = null;
      renderWelcomeScreen();
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
    };
  }

  // Send button + Enter key
  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) {
    sendBtn.onclick = () => {
      if (isProcessing) return;
      const v = ta.value.trim();
      if (v) sendMessage(v);
      ta.value = ''; ta.style.height = 'auto'; cc.textContent = '0 characters';
    };
  }
  if (ta) {
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        if (isProcessing) { e.preventDefault(); return; }
        e.preventDefault();
        const v = ta.value.trim();
        if (v) sendMessage(v);
        ta.value = ''; ta.style.height = 'auto'; cc.textContent = '0 characters';
      }
    });
  }

  // Guest: intercept sidebar toggle clicks
  if (isGuest) {
    document.querySelectorAll('.sidebar .toggle-row').forEach(row => {
      row.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        promptLogin('this tool');
      }, true);
    });
  } else {
    // Sidebar toggles — bind change handlers
    const dt = document.getElementById('deepThinkToggle');
    const li = document.getElementById('liveImageToggle');
    const lv = document.getElementById('liveVideoToggle');
    const bc = document.getElementById('bestCodingToggle');
    if (dt) dt.onchange = e => { deepThink = e.target.checked; syncToolMenu(); renderActiveTools(); };
    if (li) li.onchange = e => { liveImageMode = e.target.checked; syncToolMenu(); renderActiveTools(); };
    if (lv) lv.onchange = e => { liveVideoMode = e.target.checked; syncToolMenu(); renderActiveTools(); };
    if (bc) bc.onchange = e => { bestCodingMode = e.target.checked; syncToolMenu(); renderActiveTools(); };
  }

  // File input (only for logged-in)
  const fileInput = document.getElementById('fileInput');
  if (fileInput && !isGuest) {
    fileInput.onchange = e => {
      if (e.target.files) {
        Array.from(e.target.files).forEach(f => {
          const reader = new FileReader();
          reader.onload = ev => {
            attachedFiles.push({ name: f.name, content: ev.target.result, isText: f.type.startsWith('text/') || f.name.match(/\.(txt|json|md)$/i) });
            renderFileBadges();
          };
          if (f.type.startsWith('text/') || f.name.match(/\.(txt|json|md)$/i)) reader.readAsText(f);
          else reader.readAsDataURL(f);
        });
      }
    };
  }

  // User settings / Login button
  const userSettingsBtn = document.getElementById('userSettingsBtn');
  if (userSettingsBtn) {
    userSettingsBtn.onclick = () => {
      if (isGuest) showAuthModal('login');
      else openUserSettings();
    };
  }

  // Hamburger + overlay
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  if (hamburgerBtn) hamburgerBtn.onclick = () => { sidebar.classList.toggle('open'); overlay.classList.toggle('active'); };
  if (overlay) overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };

  // Plus button opens tool menu
  const plusBtn = document.getElementById('plusBtn');
  const toolMenu = document.getElementById('toolMenu');
  if (plusBtn && toolMenu) {
    plusBtn.onclick = e => {
      e.stopPropagation();
      toolMenu.classList.toggle('open');
      plusBtn.classList.toggle('open');
    };

    // Tool toggles — locked for guest
    toolMenu.querySelectorAll('.tool-toggle').forEach(row => {
      if (isGuest) {
        row.classList.add('locked');
        row.onclick = e => {
          e.stopPropagation();
          toolMenu.classList.remove('open');
          plusBtn.classList.remove('open');
          promptLogin(row.querySelector('.tool-name').textContent);
        };
      } else {
        row.onclick = () => {
          const tool = row.dataset.tool;
          if (tool === 'deep') { deepThink = !deepThink; document.getElementById('deepThinkToggle').checked = deepThink; }
          else if (tool === 'coding') { bestCodingMode = !bestCodingMode; document.getElementById('bestCodingToggle').checked = bestCodingMode; }
          else if (tool === 'liveimage') { liveImageMode = !liveImageMode; document.getElementById('liveImageToggle').checked = liveImageMode; }
          else if (tool === 'livevideo') { liveVideoMode = !liveVideoMode; document.getElementById('liveVideoToggle').checked = liveVideoMode; }
          syncToolMenu();
          renderActiveTools();
        };
      }
    });

    // Tool actions — locked for guest (except clear)
    toolMenu.querySelectorAll('.tool-action').forEach(btn => {
      if (isGuest && btn.dataset.action !== 'clear') {
        btn.classList.add('locked');
        btn.onclick = e => {
          e.stopPropagation();
          toolMenu.classList.remove('open');
          plusBtn.classList.remove('open');
          promptLogin(btn.textContent.trim());
        };
      } else {
        btn.onclick = () => {
          if (isProcessing && btn.dataset.action !== 'clear') { showToast('Please wait for the current reply to finish', 'warning'); return; }
          toolMenu.classList.remove('open');
          plusBtn.classList.remove('open');
          const action = btn.dataset.action;
          const txt = ta.value.trim();
          if (action === 'image') { sendMessage(txt || 'cyberpunk city at night, neon', true); ta.value = ''; cc.textContent = '0 characters'; }
          else if (action === 'video') { sendMessage(txt || 'cinematic drone shot over mountains at sunset', false, true); ta.value = ''; cc.textContent = '0 characters'; }
          else if (action === 'attach') { if (isGuest) { promptLogin('file attachments'); return; } document.getElementById('fileInput').click(); }
          else if (action === 'clear') { messagesHistory = []; currentChatId = null; renderWelcomeScreen(); showToast('Conversation cleared', 'info'); }
        };
      }
    });
  }

  // syncToolMenu helper (per instance)
  function syncToolMenu() {
    if (!toolMenu) return;
    const dEl = toolMenu.querySelector('[data-tool="deep"]');
    const cEl = toolMenu.querySelector('[data-tool="coding"]');
    const liEl = toolMenu.querySelector('[data-tool="liveimage"]');
    const lvEl = toolMenu.querySelector('[data-tool="livevideo"]');
    if (dEl) dEl.classList.toggle('active', deepThink);
    if (cEl) cEl.classList.toggle('active', bestCodingMode);
    if (liEl) liEl.classList.toggle('active', liveImageMode);
    if (lvEl) lvEl.classList.toggle('active', liveVideoMode);
  }
  window.syncToolMenu = syncToolMenu;
  syncToolMenu();
  renderActiveTools();

  // Populate sidebar
  const sidebarUsername = document.getElementById('sidebarUsername');
  if (sidebarUsername) sidebarUsername.textContent = isGuest ? 'guest' : currentUser.username;

  await renderTournaments();
  if (!isGuest) await loadChatHistoryList();
  renderWelcomeScreen();
  startActivityTracking();
  updateGuestCounter();

  window.addEventListener('resize', () => {
    if (window.innerWidth > 820 && sidebar && overlay) {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }
  });
}

// ========== GOOGLE OAUTH ==========
window.handleGoogleLogin = async (response) => {
  try {
    const res = await apiPost('/api/auth/google', { token: response.credential });
    if (res.success) {
      currentUser = {
        email: res.email, username: res.username, name: res.name, profilePic: res.profilePic,
        extraChatCredits: res.extraChatCredits || 0, extraImageCredits: res.extraImageCredits || 0,
        banned: res.banned || false, totalHoursLive: res.totalHoursLive || 0,
        authProvider: 'google'
      };
      isGuest = false;
      localStorage.setItem('vrythos_current_session', res.email);
      const modal = document.getElementById('authModal');
      if (modal) modal.remove();
      showToast('Welcome back!', 'info');
      await loadAllData();
      await buildUI();
    } else {
      const el = document.getElementById('modalAuthMessage');
      if (el) el.textContent = res.error || 'Google login failed';
    }
  } catch (e) {
    const el = document.getElementById('modalAuthMessage');
    if (el) el.textContent = 'Google login error: ' + e.message;
  }
};

  document.body.appendChild(modal);

  // Close handlers
  const closeModal = () => modal.remove();
  modal.querySelector('#authModalClose').onclick = closeModal;
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function escHandler(e) {
    if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escHandler); }
  });

  // Toggle login/register
  modal.querySelector('#modalShowRegisterBtn').onclick = () => {
    document.getElementById('modalLoginForm').classList.add('hidden');
    document.getElementById('modalRegisterForm').classList.remove('hidden');
    document.getElementById('modalAuthHeading').textContent = 'Create your account';
    document.getElementById('modalAuthSubheading').textContent = 'Start using Vrythos AI in seconds';
    document.getElementById('modalAuthMessage').textContent = '';
  };
  modal.querySelector('#modalShowLoginBtn').onclick = () => {
    document.getElementById('modalRegisterForm').classList.add('hidden');
    document.getElementById('modalLoginForm').classList.remove('hidden');
    document.getElementById('modalAuthHeading').textContent = 'Welcome back';
    document.getElementById('modalAuthSubheading').textContent = 'Sign in to unlock all features';
    document.getElementById('modalAuthMessage').textContent = '';
  };

  // Render Google button inside modal (if loaded)
  setTimeout(() => {
    if (window.google && window.google.accounts) {
      try {
        window.google.accounts.id.initialize({
          client_id: '527067177247-mk8l2ratnkatefh8sogs4vedogmg9lk8.apps.googleusercontent.com',
          callback: window.handleGoogleLogin
        });
        const googleBtn = document.getElementById('modalGoogleBtn');
        if (googleBtn) {
          window.google.accounts.id.renderButton(googleBtn, {
            theme: 'filled_black', size: 'large', shape: 'rectangular',
            text: 'sign_in_with', logo_alignment: 'center'
          });
        }
      } catch (_) {}
    }
  }, 200);

  // Render reCAPTCHA widgets
  let recaptchaTries = 0;
  function tryRenderRecaptcha() {
    recaptchaTries++;
    if (window.grecaptcha && grecaptcha.render) {
      try {
        const loginEl = document.getElementById('modalRecaptchaLogin');
        const regEl = document.getElementById('modalRecaptchaRegister');
        if (loginEl && !loginEl.hasChildNodes()) {
          grecaptcha.render('modalRecaptchaLogin', { sitekey: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI', theme: 'dark' });
        }
        if (regEl && !regEl.hasChildNodes()) {
          grecaptcha.render('modalRecaptchaRegister', { sitekey: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI', theme: 'dark' });
        }
      } catch (_) {}
    } else if (recaptchaTries < 20) {
      setTimeout(tryRenderRecaptcha, 300);
    } else {
      const msgEl = document.getElementById('modalAuthMessage');
      if (msgEl && !msgEl.textContent) {
        msgEl.style.color = 'var(--danger)';
        msgEl.textContent = 'reCAPTCHA failed to load. Refresh the page or disable adblockers.';
      }
    }
  }
  setTimeout(tryRenderRecaptcha, 300);

  // LOGIN submit
  const loginBtn = modal.querySelector('#modalDoLoginBtn');
  if (loginBtn) {
    loginBtn.onclick = async () => {
      const email = document.getElementById('modalLoginEmail').value.trim();
      const pwd = document.getElementById('modalLoginPassword').value;
      const msgEl = document.getElementById('modalAuthMessage');
      msgEl.style.color = 'var(--danger)';
      msgEl.textContent = '';
      const recaptchaToken = (window.grecaptcha && grecaptcha.getResponse) ? grecaptcha.getResponse(0) : '';
      if (!recaptchaToken) { msgEl.textContent = 'Please complete the reCAPTCHA'; return; }
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';
      try {
        const res = await apiPost('/api/login', { email, password: pwd, recaptchaToken });
        if (res.success) {
          currentUser = {
            email: res.email, username: res.username, name: res.name || '', profilePic: res.profilePic || '',
            passwordHash: null, extraChatCredits: res.extraChatCredits || 0, extraImageCredits: res.extraImageCredits || 0,
            banned: res.banned || false, totalHoursLive: res.totalHoursLive || 0,
            authProvider: res.authProvider || 'email'
          };
          isGuest = false;
          localStorage.setItem('vrythos_current_session', res.email);
          localStorage.removeItem('vrythos_guest_chats');
          guestChatCount = 0;
          closeModal();
          showToast('Welcome back!', 'info');
          await loadAllData();
          await buildUI();
        }
      } catch (e) {
        msgEl.textContent = e.message || 'Login failed';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
        if (window.grecaptcha && grecaptcha.reset) { try { grecaptcha.reset(0); } catch (_) {} }
      }
    };
  }

  // REGISTER submit
  const regBtn = modal.querySelector('#modalDoRegisterBtn');
  if (regBtn) {
    regBtn.onclick = async () => {
      const username = document.getElementById('modalRegUsername').value.trim();
      const name = document.getElementById('modalRegName').value.trim();
      const email = document.getElementById('modalRegEmail').value.trim();
      const password = document.getElementById('modalRegPassword').value;
      const confirm = document.getElementById('modalRegPasswordConfirm').value;
      const msgEl = document.getElementById('modalAuthMessage');
      msgEl.style.color = 'var(--danger)';
      if (!username || !name || !email || password.length < 4 || password !== confirm) {
        msgEl.textContent = 'Fill all fields (password min 4 chars, must match)';
        return;
      }
      const recaptchaToken = (window.grecaptcha && grecaptcha.getResponse) ? grecaptcha.getResponse(1) : '';
      if (!recaptchaToken) { msgEl.textContent = 'Please complete the reCAPTCHA'; return; }
      regBtn.disabled = true;
      regBtn.textContent = 'Creating…';
      try {
        const users = await loadUsers();
        if (users.find(u => u.email === email)) { msgEl.textContent = 'Email already registered'; regBtn.disabled = false; regBtn.textContent = 'Create account'; return; }
        if (users.find(u => u.username === username)) { msgEl.textContent = 'Username taken'; regBtn.disabled = false; regBtn.textContent = 'Create account'; return; }
        const passwordHash = await hashPassword(password);
        await apiPost('/api/users', {
          recaptchaToken, email, username, name, passwordHash, profilePic: '',
          dailyCallsRecord: { date: '', count: 0 }, extraChatCredits: 0, extraImageCredits: 0,
          banned: false, createdAt: Date.now(), totalHoursLive: 0, lastActive: Date.now(),
          authProvider: 'email'
        });
        msgEl.style.color = 'var(--success)';
        msgEl.textContent = '✅ Account created! Please sign in.';
        document.getElementById('modalRegisterForm').classList.add('hidden');
        document.getElementById('modalLoginForm').classList.remove('hidden');
        document.getElementById('modalAuthHeading').textContent = 'Welcome back';
        document.getElementById('modalAuthSubheading').textContent = 'Sign in to unlock all features';
        document.getElementById('modalLoginEmail').value = email;
        if (window.grecaptcha && grecaptcha.reset) { try { grecaptcha.reset(0); grecaptcha.reset(1); } catch (_) {} }
      } catch (e) {
        msgEl.textContent = e.message || 'Registration failed';
        regBtn.disabled = false;
        regBtn.textContent = 'Create account';
        if (window.grecaptcha && grecaptcha.reset) { try { grecaptcha.reset(1); } catch (_) {} }
      }
    };
  }
}

// ========== INIT AUTH ==========
async function initAuth() {
  const saved = localStorage.getItem('vrythos_current_session');
  if (saved) {
    try {
      const users = await loadUsers();
      const dbUser = users.find(u => u.email === saved && !u.banned);
      if (dbUser) {
        currentUser = {
          email: dbUser.email, username: dbUser.username, name: dbUser.name || '',
          profilePic: dbUser.profilePic || '', passwordHash: dbUser.passwordHash || null,
          extraChatCredits: dbUser.extraChatCredits || 0, extraImageCredits: dbUser.extraImageCredits || 0,
          banned: dbUser.banned || false, totalHoursLive: dbUser.totalHoursLive || 0,
          authProvider: dbUser.authProvider || 'email'
        };
        isGuest = false;
        await loadAllData();
        await buildUI();
        return;
      }
    } catch (_) {
      localStorage.removeItem('vrythos_current_session');
    }
  }
  // Guest mode
  isGuest = true;
  currentUser = null;
  await buildUI();
}

// ========== BOOT ==========
(async function boot() {
  try {
    await loadAllData();
    await initAuth();
  } catch (err) {
    console.error('Boot error:', err);
    const root = document.getElementById('app-root');
    root.className = 'error';
    root.innerHTML = `<h2>Connection Error</h2><p>Could not connect to the Vrythos server. Make sure the backend is running and reachable.</p><p style="font-size:.85rem;color:var(--text-muted);">${escapeHtml(err.message)}</p><button onclick="location.reload()">Retry</button>`;
  }
})();
</script>
